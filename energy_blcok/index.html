<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파인만의 블록 — 에너지 보존 시뮬레이션</title>
<style>
:root{color-scheme:light}
html,body{background:#FFFFFF;margin:0}
body{color:#1F1E1D;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:32px 20px 48px}
*{box-sizing:border-box}
#root{max-width:720px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{font-size:13px;color:#5F5E5A;margin:0 0 20px}
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 226px;gap:16px;align-items:start}
@media (max-width:640px){#wrap{grid-template-columns:1fr}}
.sec{font-size:12px;color:#8A8880;margin:0 0 8px}
.card{background:#F5F4EE;border-radius:8px;padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.rl{font-size:13px;color:#5F5E5A}
.rv{font-size:18px;font-weight:500;color:#1F1E1D}
.fx{font-size:11px;color:#8A8880;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:-4px 0 8px}
button{font-family:inherit;font-size:13px;padding:6px 8px;width:100%;background:#FFFFFF;color:#1F1E1D;border:1px solid #DEDCD3;border-radius:6px;cursor:pointer;line-height:1.3}
button:hover:not(:disabled){background:#F5F4EE}
button:disabled{opacity:.4;cursor:default}
button.on{background:#E6F1FB;border-color:#7FB2E8;color:#185FA5}
button:focus-visible{outline:2px solid #185FA5;outline-offset:2px}
.lg{display:flex;align-items:center;gap:7px;font-size:11px;color:#5F5E5A;margin-bottom:5px}
.lb{font-size:12px;fill:#1F1E1D}
.sm{font-size:11px;fill:#5F5E5A}
.q{font-size:20px;fill:#5F5E5A}
@media (prefers-reduced-motion: no-preference){
@keyframes kin{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
@keyframes th{0%{transform:translate(0,0) rotate(45deg)}25%{transform:translate(2px,2px) rotate(45deg)}50%{transform:translate(-2px,1px) rotate(45deg)}75%{transform:translate(1px,-2px) rotate(45deg)}100%{transform:translate(0,0) rotate(45deg)}}
.e-kin{transform-box:fill-box;transform-origin:center;animation:kin 1.4s ease-in-out infinite}
.e-th{transform-box:fill-box;transform-origin:center;animation:th .35s linear infinite}}
.e-th{transform-box:fill-box;transform-origin:center;transform:rotate(45deg)}
</style>
</head>
<body>
<div id="root">
<h1>파인만의 블록</h1>
<p class="sub">아이가 하루 종일 놀아도 블록은 언제나 28개입니다. 어디에 있는지가 달라질 뿐이에요.</p>

<div id="wrap">
<div>
<svg width="100%" viewBox="0 0 434 400" role="img">
<title>블록이 있는 방과 커튼이 쳐진 마당</title>
<desc>바닥에는 쌓인 블록, 상자 안에는 구르는 블록, 욕조에는 흔들리는 블록이 있고 마당은 커튼에 가려져 있다.</desc>
<rect x="6" y="6" width="300" height="388" rx="12" fill="none" stroke="#C4C2B8" stroke-width="1"/>
<rect x="16" y="20" width="280" height="140" rx="8" fill="#F5F4EE"/>
<rect x="16" y="172" width="136" height="210" rx="8" fill="#F5F4EE"/>
<text class="lb" x="26" y="40">바닥</text>
<text class="sm" id="r1" x="286" y="40" text-anchor="end">28개</text>
<text class="lb" x="26" y="192">장난감 상자</text>
<g id="floorBlocks"></g>
<rect x="32" y="200" width="104" height="110" rx="6" fill="#BA7517" opacity="0.12"/>
<g id="boxBlocks"></g>
<g id="boxCover"><rect x="32" y="200" width="104" height="110" rx="6" fill="#BA7517" opacity="0.5"/><text class="q" x="84" y="262" text-anchor="middle" fill="#412402">?</text></g>
<rect x="32" y="200" width="104" height="110" rx="6" fill="none" stroke="#854F0B" stroke-width="1"/>
<line id="lid" x1="32" y1="220" x2="136" y2="220" stroke="#854F0B" stroke-width="2"/>
<line x1="70" y1="318" x2="98" y2="318" stroke="#8A8880" stroke-width="1.5"/>
<line x1="84" y1="310" x2="84" y2="340" stroke="#8A8880" stroke-width="1"/>
<path d="M54 366 A30 30 0 0 1 114 366" fill="none" stroke="#C4C2B8" stroke-width="1"/>
<line x1="54" y1="366" x2="114" y2="366" stroke="#C4C2B8" stroke-width="1"/>
<text class="sm" x="50" y="362" text-anchor="end">16</text>
<text class="sm" x="118" y="362">100</text>
<line id="needle" x1="84" y1="366" x2="59" y2="366" stroke="#993C1D" stroke-width="2" stroke-linecap="round"/>
<circle cx="84" cy="366" r="3" fill="#993C1D"/>
<text class="sm" id="r2" x="84" y="382" text-anchor="middle">16 온스</text>
<g id="tubZone">
<rect x="170" y="172" width="126" height="210" rx="8" fill="#F5F4EE"/>
<text class="lb" x="180" y="192">욕조</text>
<rect x="186" y="200" width="94" height="150" rx="6" fill="none" stroke="#185FA5" stroke-width="1"/>
<g id="tubBlocks"></g>
<rect id="water" x="187" y="300" width="92" height="48" fill="#378ADD" opacity="0.45"/>
<line id="wline" x1="187" y1="300" x2="279" y2="300" stroke="#185FA5" stroke-width="1.5"/>
<text class="sm" id="r3" x="233" y="370" text-anchor="middle">6.00 인치</text>
</g>
<g id="yardZone">
<rect x="318" y="6" width="110" height="388" rx="12" fill="none" stroke="#DEDCD3" stroke-width="1" stroke-dasharray="4 4"/>
<text class="lb" x="328" y="40">마당</text>
<text class="sm" id="r4" x="418" y="40" text-anchor="end">?</text>
<g id="yardBlocks"></g>
<g id="curtain">
<rect x="318" y="54" width="110" height="338" rx="8" fill="#888780" opacity="0.55"/>
<line x1="332" y1="54" x2="332" y2="392" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
<line x1="346" y1="54" x2="346" y2="392" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
<line x1="360" y1="54" x2="360" y2="392" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
<line x1="374" y1="54" x2="374" y2="392" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
<line x1="388" y1="54" x2="388" y2="392" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
<line x1="402" y1="54" x2="402" y2="392" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
<line x1="416" y1="54" x2="416" y2="392" stroke="#5F5E5A" stroke-width="0.5" opacity="0.5"/>
<text class="q" x="373" y="228" text-anchor="middle" fill="#2C2C2A">?</text>
</g>
<line x1="318" y1="52" x2="428" y2="52" stroke="#8A8880" stroke-width="2" stroke-linecap="round"/>
</g>
</svg>
<div style="display:flex;gap:12px;margin-top:8px">
<button id="bpeek" style="width:69%">꾹 누르면 안이 보여요</button>
<button id="bcurtain" style="width:25%;font-size:12px;padding:6px 2px">커튼 걷기</button>
</div>
</div>

<div>
<div style="display:flex;gap:6px;margin-bottom:12px">
<button onclick="nextDay()">하루가 지났다</button>
<button onclick="reset()">처음으로</button>
</div>

<div class="card">
<p class="sec">블록이 갈 수 있는 곳</p>
<button id="lv1" onclick="setLv(1)" style="margin-bottom:6px">상자까지</button>
<button id="lv2" onclick="setLv(2)" style="margin-bottom:6px">욕조까지</button>
<button id="lv3" onclick="setLv(3)">마당까지 · 열린 계</button>
</div>

<div class="card">
<p class="sec" id="daylabel">1일차 · 방 안의 블록</p>
<div class="row"><span class="rl">바닥에 보임</span><span class="rv" id="t1">28</span></div>
<div class="row"><span class="rl">상자 속</span><span class="rv" id="t2">0</span></div>
<p class="fx" id="f2">(16−16)÷3</p>
<div class="row" id="rowTub"><span class="rl">욕조 속</span><span class="rv" id="t3">0</span></div>
<p class="fx" id="f3">(6.00−6)÷0.25</p>
<div class="row" style="border-top:1px solid #DEDCD3;padding-top:8px;margin-bottom:0"><span class="rl" style="color:#1F1E1D">합계</span><span class="rv" id="tsum">28</span></div>
<p class="fx" id="fsum" style="margin:4px 0 0">변하지 않음</p>
</div>

<div class="card">
<p class="sec">색 · 블록이 있는 곳</p>
<div class="lg"><svg width="12" height="12" aria-hidden="true"><rect width="12" height="12" rx="2" fill="#1D9E75"/></svg> 바닥</div>
<div class="lg"><svg width="12" height="12" aria-hidden="true"><rect width="12" height="12" rx="2" fill="#BA7517"/></svg> 상자 속</div>
<div class="lg" id="lgTubColor" style="margin-bottom:0"><svg width="12" height="12" aria-hidden="true"><rect width="12" height="12" rx="2" fill="#378ADD"/></svg> 욕조 속</div>
</div>

<div class="card">
<p class="sec">모양 · 에너지 형태</p>
<div class="lg"><svg width="12" height="12" aria-hidden="true"><rect width="12" height="12" rx="2" fill="#8A8880"/></svg> 사각형 · 위치에너지</div>
<div class="lg"><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="6" fill="#8A8880"/></svg> 원 · 운동에너지</div>
<div class="lg" id="lgTubShape" style="margin-bottom:0"><svg width="12" height="12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" fill="#8A8880" transform="rotate(45 6 6)"/></svg> 마름모 · 열에너지</div>
</div>

<div class="card" style="margin-bottom:0">
<p class="sec">기록</p>
<p style="font-size:13px;color:#1F1E1D;margin:0" id="conv">아침에 세어보니 28개였어요</p>
</div>
</div>
</div>
</div>

<script>
var s={floor:28,box:0,tub:0,yard:0},peek=false,curtain=false,day=1,lv=2;
function draw(id,n,x0,y0,cols,pitch,sz,color,kind){
  var h='';
  for(var i=0;i<n;i++){
    var c=i%cols,r=Math.floor(i/cols),x=x0+c*pitch,y=y0-r*pitch;
    if(kind==='kin')h+='<circle cx="'+(x+sz/2)+'" cy="'+(y+sz/2)+'" r="'+(sz/2)+'" fill="'+color+'" opacity="0.85" class="e-kin"/>';
    else if(kind==='th')h+='<rect x="'+(x+2)+'" y="'+(y+2)+'" width="'+(sz-4)+'" height="'+(sz-4)+'" fill="'+color+'" opacity="0.85" class="e-th"/>';
    else h+='<rect x="'+x+'" y="'+y+'" width="'+sz+'" height="'+sz+'" rx="3" fill="'+color+'" opacity="0.85"/>';
  }
  document.getElementById(id).innerHTML=h;
}
function render(){
  draw('floorBlocks',s.floor,24,136,14,19,16,'#1D9E75','pot');
  draw('yardBlocks',curtain?s.yard:0,328,360,5,19,16,'#888780','none');
  draw('boxBlocks',peek?s.box:0,33,292,6,17,14,'#BA7517','kin');
  draw('tubBlocks',peek?s.tub:0,190,332,5,17,14,'#378ADD','th');
  document.getElementById('tubZone').setAttribute('opacity',lv>=2?1:0.2);
  document.getElementById('yardZone').setAttribute('opacity',lv>=3?1:0.2);
  document.getElementById('rowTub').style.display=lv>=2?'flex':'none';
  document.getElementById('f3').style.display=lv>=2?'block':'none';
  document.getElementById('lgTubColor').style.display=lv>=2?'flex':'none';
  document.getElementById('lgTubShape').style.display=lv>=2?'flex':'none';
  var bc=document.getElementById('bcurtain');
  bc.disabled=lv<3;
  document.getElementById('curtain').setAttribute('opacity',curtain?0:1);
  document.getElementById('boxCover').setAttribute('opacity',peek?0:1);
  document.getElementById('lid').setAttribute('y1',peek?188:220);
  document.getElementById('lid').setAttribute('y2',peek?194:220);
  var w=16+3*s.box,lvl=6+0.25*s.tub;
  var wa=document.getElementById('water'),px=lvl*7.9,y=348-px;
  wa.setAttribute('opacity',peek?0.2:0.45);
  wa.setAttribute('y',y.toFixed(1));wa.setAttribute('height',px.toFixed(1));
  document.getElementById('wline').setAttribute('y1',y.toFixed(1));
  document.getElementById('wline').setAttribute('y2',y.toFixed(1));
  var ang=Math.PI*(1-Math.min(1,(w-16)/84));
  document.getElementById('needle').setAttribute('x2',(84+25*Math.cos(ang)).toFixed(1));
  document.getElementById('needle').setAttribute('y2',(366-25*Math.sin(ang)).toFixed(1));
  document.getElementById('r1').textContent=s.floor+'개';
  document.getElementById('r2').textContent=w+' 온스';
  document.getElementById('r3').textContent=lvl.toFixed(2)+' 인치';
  document.getElementById('r4').textContent=curtain?(s.yard+'개'):'?';
  document.getElementById('daylabel').textContent=day+'일차 · 방 안의 블록';
  var t2=Math.round((w-16)/3),t3=Math.round((lvl-6)/0.25),sum=s.floor+t2+t3;
  document.getElementById('t1').textContent=s.floor;
  document.getElementById('t2').textContent=t2;
  document.getElementById('t3').textContent=t3;
  document.getElementById('f2').textContent=peek?('직접 세어봄: '+s.box):('('+w+'−16)÷3');
  document.getElementById('f3').textContent=peek?('직접 세어봄: '+s.tub):('('+lvl.toFixed(2)+'−6)÷0.25');
  document.getElementById('tsum').textContent=sum;
  var f=document.getElementById('fsum');
  if(lv<3) f.textContent='변하지 않음';
  else if(curtain) f.textContent=s.yard>0?('마당에 '+s.yard+'개 → 합쳐서 28'):'변하지 않음';
  else f.textContent=sum<28?((28-sum)+'개가 모자람'):'변하지 않음';
  ['lv1','lv2','lv3'].forEach(function(id,i){document.getElementById(id).classList.toggle('on',lv===i+1)});
}
function setLv(v){
  lv=v; s={floor:28,box:0,tub:0,yard:0}; day=1;
  document.getElementById('conv').textContent='아침에 세어보니 28개였어요';
  render();
}
function hold(id,set){
  var el=document.getElementById(id);
  var on=function(e){if(el.disabled)return;if(e.type.indexOf('touch')===0)e.preventDefault();set(true);el.classList.add('on')};
  var off=function(){set(false);el.classList.remove('on')};
  el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);
  el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off);el.addEventListener('touchcancel',off);
  el.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();on(e)}});
  el.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter'){off()}});
  el.addEventListener('blur',off);
  window.addEventListener('mouseup',off);
}
hold('bpeek',function(v){if(peek!==v){peek=v;render()}});
hold('bcurtain',function(v){if(curtain!==v){curtain=v;render()}});
function nextDay(){
  var tot=s.floor+s.box+s.tub;
  if(lv>=3&&Math.random()<0.45&&tot>3){var out=1+Math.floor(Math.random()*3);tot-=out;s.yard+=out;}
  var a,b;
  if(lv>=2){a=Math.floor(Math.random()*(tot+1));b=Math.floor(Math.random()*(tot-a+1));s.floor=a;s.box=b;s.tub=tot-a-b;}
  else {a=Math.floor(Math.random()*(tot+1));s.floor=a;s.box=tot-a;s.tub=0;}
  day++;
  document.getElementById('conv').textContent='아이가 하루 종일 놀았어요. 방 안을 세어 보세요';
  render();
}
function reset(){s={floor:28,box:0,tub:0,yard:0};day=1;document.getElementById('conv').textContent='아침에 세어보니 28개였어요';render();}
render();
</script>
</body>
</html>

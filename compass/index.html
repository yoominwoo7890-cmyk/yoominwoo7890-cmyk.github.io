<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자기장 측정기</title>
<style>
:root{
  --paper:#E9EBE5; --panel:#F5F6F2; --line:#CFD5CD;
  --ink:#1E2320; --ink-2:#6A726B; --pen:#B23A2E; --mark:#1D6E6E; --warn:#8A5A00;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  padding:14px 14px calc(28px + env(safe-area-inset-bottom));
  max-width:620px;margin-inline:auto}
h1{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:10px}
.pad{padding:12px}
.hide{display:none !important}

.read{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}
.read .k{font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
.read .v{font-family:var(--mono);font-size:clamp(27px,8.2vw,38px);font-weight:500;
  line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.read .v small{font-size:14px;color:var(--ink-2);font-weight:400;letter-spacing:0}
.read .v.dim{color:var(--ink-2);opacity:.45}
.sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);padding:0 14px 13px;margin:0}

canvas{display:block;width:100%;background:#FCFDFB;border-radius:3px}

button{width:100%;font-family:var(--sans);font-size:16px;font-weight:500;padding:15px 8px;
  border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button.sm{font-size:13.5px;font-weight:400;padding:12px 6px}
button.sm b{font-weight:500}
button:disabled{opacity:.3;cursor:default}
button + button{margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.two button{margin:0}

label.f{display:block;font-size:11.5px;color:var(--ink-2);margin:12px 0 5px}
select,input{width:100%;font-family:var(--sans);font-size:15px;padding:11px 10px;
  border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
input{font-family:var(--mono)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:11px;font-weight:500;color:var(--ink-2)}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.del{color:var(--pen);cursor:pointer;font-family:var(--sans)}

.note{font-size:12px;color:var(--ink-2);line-height:1.65;margin:14px 2px 0}
.banner{background:var(--warn);color:#fff;padding:11px 13px;border-radius:4px;
  font-size:13.5px;margin-bottom:10px}
.flash{font-size:12.5px;padding:9px 11px;border-radius:4px;margin:9px 0 0;line-height:1.55;
  background:#F6E7E4;color:#7A2D22;border:1px solid #E4C6C0}
</style>
</head>
<body>

<h1>자기장 측정기</h1>
<div id="banner"></div>

<div class="card">
  <div class="read">
    <div><div class="k" id="kT">방위</div><div class="v dim" id="vT">—</div></div>
    <div><div class="k">자기장</div><div class="v dim" id="vB">—</div></div>
  </div>
  <p class="sub" id="sub">센서 대기</p>
</div>

<div class="card">
  <div class="pad"><canvas id="dial"></canvas></div>
  <p class="flash hide" id="warn"></p>
</div>

<div class="card">
  <div class="pad">
    <button id="bRun">센서 켜기</button>
    <button class="ghost" id="bZero" disabled>이 방향을 기준으로</button>
    <label class="f" for="selH">지역 — 지구 자기장 수평 성분</label>
    <select id="selH"></select>
    <label class="f" for="inD">자석까지 거리 (cm)</label>
    <input type="number" id="inD" inputmode="decimal" step="0.5" min="0" placeholder="예: 15">
    <div class="two">
      <button class="ghost sm" id="bAdd" disabled>이 값 기록</button>
      <button class="ghost sm" id="bCsv" disabled>CSV</button>
    </div>
  </div>
</div>

<div class="card hide" id="cardTbl">
  <div class="pad" style="overflow-x:auto">
    <table id="tbl"></table>
    <p class="sub" style="padding:10px 0 0" id="fit">—</p>
  </div>
</div>

<p class="note">
지구 자기장을 자로 삼아 자석의 자기장을 잽니다. 자력계 값을 직접 읽지 않으므로
기기 감도와 무관하며, 아이폰과 안드로이드에서 같은 값이 나옵니다.<br>
자석을 치운 상태에서 <b>이 방향을 기준으로</b>를 누른 뒤, 자석을 <b>동쪽이나 서쪽</b>에서
가까이 가져오세요. 지구 자기장과 수직이라야 tan 관계가 성립합니다.<br>
편향각이 15°보다 작거나 65°보다 크면 오차가 크게 부풀어 오릅니다. 거리를 조절해 그 사이로 맞추세요.
</p>

<script>
const $ = id => document.getElementById(id);
const D2R = Math.PI/180;
function banner(msg){
  const b = $('banner'); b.innerHTML = '';
  if (!msg) return;
  const d = document.createElement('div');
  d.className = 'banner'; d.textContent = msg;
  b.appendChild(d);
}
window.addEventListener('error', e => banner('오류: ' + e.message));
window.addEventListener('unhandledrejection', e => banner('오류: ' + e.reason));

/* ── 지역별 지구 자기장 수평 성분 ────────────────────────
   이 값이 자가 됩니다. 자석의 세기는 늘 이것의 배수로 나옵니다. */
const REG = [['서울·경기',30.6],['강원',30.3],['충청',30.9],['전라',31.4],
             ['경상',31.2],['제주',32.4],['직접 입력',0]];
REG.forEach(([nm,h],i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = nm + (h ? '  ' + h.toFixed(1) + ' μT' : '');
  $('selH').appendChild(o);
});
let Hh = REG[0][1];
$('selH').addEventListener('change', () => {
  const i = +$('selH').value;
  if (REG[i][1]) Hh = REG[i][1];
  else {
    const v = parseFloat(prompt('지구 자기장 수평 성분을 μT 단위로 입력하세요', Hh.toFixed(1)));
    if (isFinite(v) && v > 0) Hh = v;
    else $('selH').value = 0;
  }
});

/* ── 방위 ────────────────────────────────────────────────
   기존 나침반과 같은 방식입니다. 절대 방위가 한 번이라도 오면
   상대 방위는 무시합니다. 둘을 함께 쓰면 값이 번갈아 들어와 떨립니다. */
let sensorOn = false, haveOri = false, absSeen = false, headSeen = false;
let heading = null, zero = null, wl = null;

function take(e){
  let a = e.alpha;
  if (typeof e.webkitCompassHeading === 'number'){
    a = e.webkitCompassHeading; headSeen = true;
  } else if (a !== null){
    a = 360 - a;                       /* alpha는 반시계, 방위는 시계 */
  }
  if (a === null) return;
  heading = (a % 360 + 360) % 360;
  haveOri = true;
}
function onAbs(e){ absSeen = true; take(e); }
function onRel(e){ if (absSeen) return; take(e); }

$('bRun').addEventListener('click', async () => {
  if (sensorOn) return;
  $('bRun').disabled = true;
  try{
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'){
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== 'granted'){
        banner('센서 권한이 거부되었습니다. 설정 > Safari > 동작 및 방향 접근을 켜 주세요.');
        $('bRun').disabled = false; return;
      }
    }
    window.addEventListener('deviceorientationabsolute', onAbs);
    window.addEventListener('deviceorientation', onRel);
    sensorOn = true;
    $('bRun').textContent = '센서 켜짐';
    $('bZero').disabled = false;
    keepAwake();
    setTimeout(() => {
      if (!haveOri) banner('방위 값이 들어오지 않습니다. 센서가 없는 기기일 수 있습니다.');
      else if (!absSeen && !headSeen)
        banner('이 기기는 절대 방위를 제공하지 않습니다. 기준을 잡은 뒤 폰을 움직이지 마세요.');
    }, 2500);
  }catch(err){ banner('센서 켜기 실패: ' + err); $('bRun').disabled = false; }
});

async function keepAwake(){
  try{ if ('wakeLock' in navigator && !wl){
    wl = await navigator.wakeLock.request('screen');
    wl.addEventListener('release', () => { wl = null; });
  }}catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && sensorOn && !wl) keepAwake();
});

$('bZero').addEventListener('click', () => {
  if (heading == null) return;
  zero = heading;
  hist.length = 0;
});

/* ── 편향각과 자기장 ─────────────────────────────────────
   나침반이 서는 방향은 지구 자기장과 자석 자기장의 합입니다.
   자석을 지구 자기장과 수직으로 놓으면 B = H·tanθ 가 성립합니다. */
const hist = [];
let devNow = null, bNow = null, steady = false;

function devi(){
  if (heading == null || zero == null) return null;
  let d = heading - zero;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return d;
}
setInterval(() => {
  const d = devi();
  if (d != null){
    hist.push(d); if (hist.length > 20) hist.shift();
    const s = [...hist].sort((a,b) => a-b);
    devNow = s[s.length >> 1];             /* 중앙값으로 튐 제거 */
    /* 값이 안정됐는지 — 최근 2초의 흔들림 폭 */
    steady = hist.length >= 15 && (s[s.length-1] - s[0]) < 1.5;
    const t = Math.abs(devNow);
    bNow = t < 89.5 ? Hh*Math.tan(t*D2R) : null;
  }
  const has = devNow != null;
  $('vT').classList.toggle('dim', !has && heading == null);
  $('vB').classList.toggle('dim', bNow == null);
  $('vT').innerHTML = has ? devNow.toFixed(1) + ' <small>°</small>'
    : (heading != null ? heading.toFixed(0) + ' <small>° 방위</small>' : '—');
  $('vB').innerHTML = bNow == null ? '—'
    : (bNow < 100 ? bNow.toFixed(1) : bNow.toFixed(0)) + ' <small>μT</small>';
  $('kT').textContent = zero == null ? '방위' : '편향각';
  $('sub').textContent = !sensorOn ? '센서 대기'
    : zero == null ? '자석을 치우고 기준을 잡으세요'
    : '기준 ' + zero.toFixed(0) + '° · 지구 ' + Hh.toFixed(1) + ' μT · '
      + (steady ? '안정' : '흔들림');

  const t = has ? Math.abs(devNow) : 0;
  const w = $('warn');
  if (has && t < 15){
    w.textContent = '편향각이 작아 오차가 큽니다 (' + (100/Math.max(t,1)*1.0).toFixed(0)
      + '% 수준). 자석을 더 가까이 가져오세요.';
    w.classList.remove('hide');
  } else if (has && t > 65){
    w.textContent = '편향각이 커서 오차가 큽니다. 자석을 더 멀리 두세요.';
    w.classList.remove('hide');
  } else w.classList.add('hide');

  $('bAdd').disabled = !(bNow != null && steady);
  $('bAdd').textContent = bNow == null ? '이 값 기록'
    : steady ? '이 값 기록' : '흔들림 — 기다리세요';
}, 100);

/* ── 눈금판 ──────────────────────────────────────────────*/
const cv = $('dial'), cx = cv.getContext('2d');
let S = 300;
function refit(){
  const w = cv.clientWidth;
  if (w < 1) return;
  S = Math.min(w, 340);
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w*d); cv.height = Math.round(S*d);
  cv.style.height = S + 'px';
  cx.setTransform(d, 0, 0, d, 0, 0);
}
if (window.ResizeObserver) new ResizeObserver(refit).observe(cv);
window.addEventListener('resize', refit);
refit(); setTimeout(refit, 300);

function draw(){
  requestAnimationFrame(draw);
  const w = cv.clientWidth, h = S;
  cx.clearRect(0, 0, w, h);
  const cxp = w/2, cyp = h/2, R = Math.min(w, h)/2 - 26;

  cx.strokeStyle = '#DDE2DA'; cx.lineWidth = 1;
  cx.beginPath(); cx.arc(cxp, cyp, R, 0, 6.2832); cx.stroke();
  cx.font = '500 11px ' + getComputedStyle(document.body).fontFamily;
  cx.fillStyle = '#6A726B'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  const zeroed = zero != null;
  for (let a = zeroed ? -90 : -180; a <= 180; a += 15){
    if (zeroed && a > 90) break;
    const r = a*D2R;
    const x1 = cxp + Math.sin(r)*(R-8), y1 = cyp - Math.cos(r)*(R-8);
    const x2 = cxp + Math.sin(r)*R,     y2 = cyp - Math.cos(r)*R;
    cx.strokeStyle = (a % 45 === 0) ? '#AEB6AC' : '#DDE2DA';
    cx.lineWidth = (a % 45 === 0) ? 1.5 : 1;
    cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke();
    if (a % 45 === 0)
      cx.fillText((zeroed ? a : ((a % 360 + 360) % 360)) + '°',
        cxp + Math.sin(r)*(R+14), cyp - Math.cos(r)*(R+14));
  }
  /* 기준을 잡은 뒤에만 쓸 만한 구간 15~65도를 표시 */
  if (zeroed){
    cx.strokeStyle = 'rgba(29,110,110,.30)'; cx.lineWidth = 7;
    for (const s of [1, -1]){
      cx.beginPath();
      cx.arc(cxp, cyp, R-4, -90*D2R + s*15*D2R, -90*D2R + s*65*D2R, s < 0);
      cx.stroke();
    }
  }
  cx.strokeStyle = '#AEB6AC'; cx.lineWidth = 1; cx.setLineDash([4,4]);
  cx.beginPath(); cx.moveTo(cxp, cyp - R); cx.lineTo(cxp, cyp + 8); cx.stroke();
  cx.setLineDash([]);

  /* 기준을 잡기 전에는 방위를 그대로, 잡은 뒤에는 편향각을 그립니다.
     둘 다 없으면 센서가 아직 값을 안 준 것입니다. */
  const shown = devNow != null ? devNow : (heading != null ? heading : null);
  if (shown != null){
    const r = shown*D2R;
    cx.strokeStyle = devNow != null ? '#B23A2E' : '#AEB6AC';
    cx.lineWidth = 3; cx.lineCap = 'round';
    cx.beginPath();
    cx.moveTo(cxp, cyp);
    cx.lineTo(cxp + Math.sin(r)*(R-6), cyp - Math.cos(r)*(R-6));
    cx.stroke();
    /* 반대쪽 꼬리 */
    cx.lineWidth = 1.5;
    cx.beginPath();
    cx.moveTo(cxp, cyp);
    cx.lineTo(cxp - Math.sin(r)*(R*0.3), cyp + Math.cos(r)*(R*0.3));
    cx.stroke();
  } else if (sensorOn){
    cx.fillStyle = '#6A726B'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.font = '13px ' + getComputedStyle(document.body).fontFamily;
    cx.fillText('방위 값을 기다리는 중', cxp, cyp);
  }
  cx.beginPath(); cx.arc(cxp, cyp, 5, 0, 6.2832);
  cx.fillStyle = '#1E2320'; cx.fill();
}
requestAnimationFrame(draw);

/* ── 기록과 맞춤 ─────────────────────────────────────────
   거리를 바꿔가며 재면 B ∝ 1/r³ 을 확인할 수 있습니다.
   log B 대 log r 의 기울기가 −3에 가까우면 성공입니다. */
const rows = [];
$('bAdd').addEventListener('click', () => {
  const r = parseFloat($('inD').value);
  rows.push({ r: isFinite(r) && r > 0 ? r : null, t: devNow, B: bNow, H: Hh });
  render();
});
function render(){
  $('cardTbl').classList.toggle('hide', !rows.length);
  $('bCsv').disabled = !rows.length;
  let html = '<tr><th>거리(cm)</th><th>편향각(°)</th><th>자기장(μT)</th><th></th></tr>';
  rows.forEach((x, i) => {
    html += '<tr><td>' + (x.r == null ? '—' : x.r.toFixed(1)) + '</td><td>'
      + x.t.toFixed(1) + '</td><td>' + x.B.toFixed(1)
      + '</td><td class="del" data-i="' + i + '">지움</td></tr>';
  });
  $('tbl').innerHTML = html;

  const pts = rows.filter(x => x.r != null && x.B > 0);
  if (pts.length < 3){
    $('fit').textContent = '거리를 적어 세 점 이상 모으면 거리 법칙을 확인합니다';
    return;
  }
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (const p of pts){
    const X = Math.log(p.r), Y = Math.log(p.B);
    sx += X; sy += Y; sxx += X*X; sxy += X*Y;
  }
  const N = pts.length, den = N*sxx - sx*sx;
  if (Math.abs(den) < 1e-9){ $('fit').textContent = '거리가 모두 같습니다'; return; }
  const k = (N*sxy - sx*sy)/den;
  let ss = 0, st = 0; const my = sy/N;
  for (const p of pts){
    const X = Math.log(p.r), Y = Math.log(p.B);
    const pred = my + k*(X - sx/N);
    ss += (Y - pred)*(Y - pred); st += (Y - my)*(Y - my);
  }
  const r2 = st > 0 ? 1 - ss/st : 0;
  $('fit').textContent = 'log B – log r 기울기 ' + k.toFixed(2)
    + ' (쌍극자라면 −3) · R² ' + r2.toFixed(3) + ' · 점 ' + N + '개';
}
$('tbl').addEventListener('click', e => {
  const t = e.target.closest('.del'); if (!t) return;
  rows.splice(+t.dataset.i, 1); render();
});

$('bCsv').addEventListener('click', () => {
  if (!rows.length) return;
  const out = ['\ufeff거리(cm),편향각(도),자기장(μT),지구수평성분(μT)'];
  for (const x of rows)
    out.push((x.r == null ? '' : x.r.toFixed(2)) + ',' + x.t.toFixed(2)
      + ',' + x.B.toFixed(3) + ',' + x.H.toFixed(1));
  const d = new Date(), p = v => String(v).padStart(2, '0');
  const name = '자기장_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
    + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.csv';
  try{
    const url = URL.createObjectURL(new Blob([out.join('\n') + '\n'],
      {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }catch(err){ banner('내보내기에 실패했습니다: ' + (err.message || err)); }
});
</script>
</body>
</html>

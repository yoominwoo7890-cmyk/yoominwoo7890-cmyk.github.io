<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물리 실험 도구 모음</title>
<style>
:root{
  --paper:#E9EBE5; --panel:#F5F6F2; --line:#CFD5CD;
  --ink:#1E2320; --ink-2:#6A726B;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  padding:26px 14px calc(40px + env(safe-area-inset-bottom));
  max-width:620px;margin-inline:auto}
header{margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  color:var(--ink-2);margin:0 0 5px}
h1{font-size:23px;font-weight:600;margin:0;letter-spacing:-.015em}
header p{font-size:13px;color:var(--ink-2);margin:8px 0 0;line-height:1.6}

a.item{display:block;text-decoration:none;color:inherit;
  background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:15px 40px 15px 16px;margin-bottom:9px;position:relative}
a.item:active{background:#EFF1EC}
a.item .no{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-2)}
a.item h2{font-size:17px;font-weight:600;margin:3px 0 4px;letter-spacing:-.01em}
a.item p{font-size:13px;color:var(--ink-2);margin:0;line-height:1.55}
a.item .tags{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
a.item .tag{font-size:11px;font-family:var(--mono);color:var(--ink-2);
  border:1px solid var(--line);border-radius:3px;padding:2px 7px;background:#fff}
a.item .go{position:absolute;right:15px;top:50%;transform:translateY(-50%);
  color:var(--ink-2);font-size:18px}
.soon{opacity:.5}
.soon .go{display:none}

footer{margin-top:26px;font-size:12px;color:var(--ink-2);line-height:1.7}
footer code{font-family:var(--mono);font-size:11.5px;background:var(--panel);
  border:1px solid var(--line);border-radius:3px;padding:1px 5px}
</style>
</head>
<body>

<header>
  <p class="eyebrow">물리 · 측정 도구</p>
  <h1>휴대폰으로 하는 실험</h1>
  <p>휴대폰의 센서를 그대로 측정 장비로 씁니다. 설치할 것 없이 눌러서 바로 여세요.</p>
</header>

<div id="list"></div>

<footer>
  각 도구는 <code>https</code> 주소에서만 센서를 쓸 수 있습니다.<br>
  실험 중에는 화면 자동 회전을 잠그고, 절전으로 화면이 꺼지지 않게 해 주세요.
</footer>

<script>
/* ══════════════════════════════════════════════════════════
   여기만 고치면 목록이 바뀝니다.
   새 도구를 만들면 아래 덩어리를 복사해 붙여 넣으세요.
     path  : 폴더 이름 (그 안에 index.html 이 있어야 합니다)
     title : 목록에 보일 이름
     desc  : 한 줄 설명
     tags  : 쓰는 센서나 주제
     ready : false 로 두면 '준비 중'으로 표시되고 눌리지 않습니다
   마지막 덩어리 뒤에는 쉼표를 붙이지 않습니다.
   ══════════════════════════════════════════════════════════ */
const SIMS = [
  {
    path : 'pendulum',
    title: '진자 가속도 기록계',
    desc : '휴대폰을 실에 매달아 흔들면 가속도와 각속도를 재고 주기를 계산합니다. 태블릿으로 실시간 관찰과 원격 조작이 됩니다.',
    tags : ['가속도계', '자이로', '단진자', 'CSV'],
    ready: true
  },
  {
    path : 'sound',
    title: '음파 간섭 발생기',
    desc : '스피커 두 대의 위상차를 조절해 보강·상쇄 무늬를 만듭니다. 걸어 다니며 널 간격을 재면 음속이 나옵니다.',
    tags : ['스피커 2대', '간섭', '위상'],
    ready: true
  },
  {
    path : 'compass',
    title: '3D 자기장 나침반',
    desc : '지구 자기장의 방향을 3차원 바늘로 봅니다. 평면 나침반이 보여주지 못하는 복각이 함께 보입니다.',
    tags : ['지자기', '복각', '3D'],
    ready: true
  }
];

const list = document.getElementById('list');
SIMS.forEach((s, i) => {
  const el = document.createElement('a');
  el.className = 'item' + (s.ready ? '' : ' soon');
  if (s.ready) el.href = s.path + '/';
  el.innerHTML =
    `<div class="no">${String(i+1).padStart(2,'0')}${s.ready ? '' : ' · 준비 중'}</div>` +
    `<h2>${s.title}</h2><p>${s.desc}</p>` +
    `<div class="tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` +
    `<span class="go">→</span>`;
  list.appendChild(el);
});
</script>
</body>
</html>

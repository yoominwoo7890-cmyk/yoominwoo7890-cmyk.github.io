<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로켓 방정식 — 운동량·에너지 시뮬레이터</title>
<style>
  :root{
    --paper:#ffffff; --surface:#f6f7f9; --sunk:#eceef2;
    --rule:#e2e5eb; --rule-hard:#c9ced8;
    --ink:#111620; --muted:#5d6879; --faint:#8f98a8;
    --rocket:#0d7fb8; --exhaust:#dd5f10; --pe:#6247cc; --peExh:#a8348f;
    --warn:#a5730a; --good:#0d7a4c; --bad:#c0392b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
            "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    --side:308px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow-x:hidden}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:12px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;align-items:flex-start;min-height:100%}

  /* ================= SIDEBAR ================= */
  .sidebar{
    width:var(--side); flex:0 0 var(--side);
    position:sticky; top:0; height:100vh; overflow-y:auto;
    background:var(--surface); border-right:1px solid var(--rule);
    padding:20px 20px 32px;
  }
  .sidebar::-webkit-scrollbar{width:8px}
  .sidebar::-webkit-scrollbar-thumb{background:var(--rule-hard);border-radius:4px}

  .brand{padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:18px}
  .brand h1{font-size:14px;font-weight:680;letter-spacing:-.015em;margin:0 0 5px}
  .brand p{margin:0;font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.6}

  .group{margin-bottom:22px}
  .group > h2{
    font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
    color:var(--faint);margin:0 0 10px;
  }

  .modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .modes button{
    background:var(--paper);border:1px solid var(--rule-hard);color:var(--muted);
    border-radius:8px;padding:10px 6px;font-family:var(--sans);font-size:13px;
    cursor:pointer;transition:.14s;line-height:1.35
  }
  .modes button small{display:block;font-size:10px;color:var(--faint);margin-top:2px;font-family:var(--mono)}
  .modes button:hover{border-color:var(--muted)}
  .modes button[aria-pressed="true"]{
    border-color:var(--rocket);color:var(--rocket);background:#eaf4fa;
    box-shadow:inset 0 0 0 1px var(--rocket);font-weight:600
  }
  .modes button[aria-pressed="true"] small{color:var(--rocket)}
  .modes button:focus-visible{outline:2px solid var(--rocket);outline-offset:2px}

  .ctl{margin-bottom:15px}
  .ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ctl label{font-size:13px;color:var(--muted)}
  .ctl .val{font-family:var(--mono);font-size:14px;color:var(--ink);font-weight:600}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;
    margin:4px 0 0;cursor:pointer;display:block
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--sunk);border-radius:2px}
  input[type=range]::-moz-range-track{height:4px;background:var(--sunk);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--rocket);margin-top:-5px;border:2px solid var(--paper);
    box-shadow:0 1px 3px rgba(17,22,32,.28)
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:var(--rocket);
    border:2px solid var(--paper);box-shadow:0 1px 3px rgba(17,22,32,.28)
  }
  input[type=range]:focus-visible{outline:2px solid var(--rocket);outline-offset:3px;border-radius:4px}

  .fire{
    width:100%;margin-top:10px;padding:13px;border-radius:9px;border:1px solid #c2540a;
    background:linear-gradient(180deg,#f0801f,#dd5f10);color:#fff;font-family:var(--sans);
    font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.02em;transition:.1s
  }
  .fire:hover{filter:brightness(1.07)}
  .fire:active{transform:translateY(1px)}
  .fire:disabled{background:var(--sunk);border-color:var(--rule-hard);color:var(--faint);cursor:default}
  .fire.armed{background:linear-gradient(180deg,#ffa04a,#f0801f)}
  .pulsestat{margin-top:9px;font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.7}
  .pulsestat b{color:var(--ink)}
  .runbar{display:grid;grid-template-columns:1fr auto auto;gap:6px}
  #bSound{padding:10px 12px;font-size:15px;line-height:1;color:var(--muted)}
  #bSound[aria-pressed="true"]{color:var(--rocket);border-color:var(--rocket);background:#eaf4fa}
  .btn{
    background:var(--paper);border:1px solid var(--rule-hard);color:var(--ink);border-radius:8px;
    padding:10px 12px;font-family:var(--sans);font-size:13px;cursor:pointer;transition:.14s
  }
  .btn:hover{border-color:var(--muted)}
  .btn:focus-visible{outline:2px solid var(--rocket);outline-offset:2px}
  .btn.primary{background:var(--rocket);border-color:var(--rocket);color:#fff;font-weight:600}
  .btn.primary:hover{background:#0a6c9d;border-color:#0a6c9d}



  /* ================= MAIN ================= */
  .main{flex:1;min-width:0;padding:22px 26px 56px;max-width:1180px}

  .stage{
    position:relative;background:#070a12;
    border:1px solid #1b2334;border-radius:12px;overflow:hidden;
    box-shadow:0 2px 10px rgba(17,22,32,.16)
  }
  canvas{display:block;width:100%}
  #view{height:520px}
  #chart{height:180px;border-top:1px solid #1b2334}
  .hud{
    position:absolute;top:12px;left:14px;font-family:var(--mono);font-size:12px;
    color:#93a0b8;pointer-events:none;
    background:rgba(7,10,18,.72);padding:6px 10px;border-radius:7px;border:1px solid #1f293d;
    backdrop-filter:blur(3px)
  }
  .hud b{color:#e9eff9;font-weight:600}
  .hud .ctx{color:#6f7d96}
  .status{
    position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:11px;font-weight:600;
    padding:6px 12px;border-radius:20px;border:1px solid #2a3550;background:rgba(7,10,18,.75);
    color:#93a0b8;backdrop-filter:blur(3px)
  }
  .status.burn{color:#ffa14f;border-color:rgba(255,161,79,.55);background:rgba(255,161,79,.12)}
  .status.coast{color:#93a0b8}
  .status.esc{color:#5ee6a0;border-color:rgba(94,230,160,.55);background:rgba(94,230,160,.12)}
  .status.fail{color:#ff7b6b;border-color:rgba(255,123,107,.55);background:rgba(255,123,107,.12)}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
    background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin:16px 0 0}
  .metrics div{background:var(--paper);padding:12px 13px}
  .metrics dt{font-size:9.5px;letter-spacing:.04em;color:var(--faint);margin:0}
  .metrics dd{margin:4px 0 0;font-family:var(--mono);font-size:15px;color:var(--ink);font-weight:600}


  .card{background:var(--paper);border:1px solid var(--rule-hard);border-radius:12px;
        box-shadow:0 1px 2px rgba(17,22,32,.04)}
  .card h2{
    font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
    color:var(--faint);margin:0;padding:14px 16px 0;
  }
  .card .body{padding:12px 16px 16px}

  .workrow{display:flex;gap:16px;align-items:stretch}
  .workrow .stage{flex:1;min-width:0}
  .epanel{flex:0 0 232px;background:var(--paper);border:1px solid var(--rule-hard);
          border-radius:12px;box-shadow:0 1px 2px rgba(17,22,32,.04);
          padding:14px 14px 12px;display:flex;flex-direction:column}
  .etitle{font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
          color:var(--faint);margin-bottom:12px;white-space:nowrap}
  .etitle span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:0;
               text-transform:none;font-weight:600;color:var(--muted);margin-top:3px}
  .ecols{position:relative;flex:1;display:flex;gap:5px;min-height:220px}
  .ecol{position:relative;flex:1;border-radius:3px;background:var(--sunk);
        border:1px solid var(--rule);
        display:flex;flex-direction:column-reverse;justify-content:flex-start;overflow:hidden}
  .ecol.top{flex-direction:column;justify-content:flex-start}
  .ecol i{display:block;width:100%;transition:height .08s linear}
  .emark{position:absolute;left:-3px;right:-3px;bottom:var(--mk,0%);height:0;
         border-top:1.5px dashed var(--warn);pointer-events:none;z-index:2}
  .enums{display:flex;gap:5px;margin-top:8px;height:104px;flex:0 0 auto}
  .enums span{
    flex:1;height:100%;font-size:11px;color:var(--muted);white-space:nowrap;line-height:1;
    writing-mode:vertical-rl;text-orientation:mixed;   /* 칸이 21px 뿐이라 세로로 적는다 */
    display:flex;justify-content:flex-start;align-items:center;
  }
  @media (max-width:1000px){ .epanel{flex:0 0 168px;padding:12px 10px} }
  @media (max-width:760px){ .workrow{flex-direction:column} .epanel{flex:1 1 auto} .ecols{min-height:200px} }




  /* 좁은 폭(미리보기 창 등)에서도 사이드바는 항상 옆에 남고, 폭만 줄어듭니다 */
  @media (max-width:1100px){
    :root{--side:262px}
    .main{padding:18px 18px 48px}
    #view{height:460px}
  }
  @media (max-width:820px){
    :root{--side:224px}
    .sidebar{padding:16px 14px 28px}
    .brand h1{font-size:13px}
    .group{margin-bottom:18px}
    .main{padding:14px 14px 40px}
    #view{height:400px}
    #chart{height:150px}
    .metrics dd{font-size:13px}
  }
  @media (max-width:620px){
    :root{--side:196px}
    .modes{grid-template-columns:1fr}
    .runbar{grid-template-columns:1fr}
    .ctl label{font-size:12px}
    .metrics{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
    .metrics dd{font-size:12px}
    #view{height:340px}
  }
</style>

<div class="app">
<!-- ================= SIDEBAR ================= -->
<aside class="sidebar">
  <div class="brand">
    <h1>운동량으로 보는 로켓 방정식</h1>
    <p>m·dv = vₑ·(−dm)<br>Δv = vₑ ln(m₀ / m_f)</p>
  </div>

  <div class="group">
    <h2>모드</h2>
    <div class="modes">
      <button id="mHoriz" aria-pressed="true">무중력 수평<small>g = 0</small></button>
      <button id="mVert" aria-pressed="false">연직 상승<small>g = GM/r²</small></button>
    </div>

    <button class="fire" id="bFire">분 사</button>

    <div class="pulsestat" id="pulseStat"></div>

    <div class="runbar">
      <button class="btn primary" id="bRun">재생</button>
      <button class="btn" id="bReset">초기화</button>
      <button class="btn" id="bSound" aria-pressed="true" title="효과음 켜기/끄기">♪</button>
    </div>
  </div>

  <div class="group">
    <h2>로켓 설계</h2>
    <div class="ctl">
      <div class="row"><label for="sFuel">연료 질량비 m<sub>p</sub>/m₀</label><span class="val" id="vFuel"></span></div>
      <input type="range" id="sFuel" min="0.30" max="0.96" step="0.01">
    </div>
    <div class="ctl">
      <div class="row"><label for="sVe">배기속도 v<sub>e</sub></label><span class="val" id="vVe"></span></div>
      <input type="range" id="sVe" min="800" max="5000" step="50">
    </div>
  </div>

  <div class="group" style="margin-bottom:0">
    <h2>분사 제어</h2>

    <div class="ctl">
      <div class="row"><label for="sPulse">단발 방출 질량 Δm</label><span class="val" id="vPulse"></span></div>
      <input type="range" id="sPulse" min="1" max="300" step="1">
    </div>

    <div class="ctl">
      <div class="row"><label for="sMdot">연속 분사 유량 ṁ</label><span class="val" id="vMdot"></span></div>
      <input type="range" id="sMdot" min="2" max="120" step="1">
    </div>

  </div>

</aside>

<!-- ================= MAIN ================= -->
<main class="main">
  <div class="workrow">
  <div class="stage">
    <canvas id="view"></canvas>
    <div class="hud" id="hud"></div>
    <div class="status" id="status">대기</div>
    <canvas id="chart"></canvas>
  </div>

  <div class="epanel">
    <div class="etitle">에너지 <span id="eFullTop"></span></div>
    <div class="ecols" id="eCols">
          <div class="ecol top" id="cFU"><i id="bFU" style="background:var(--warn)"></i></div>
          <div class="ecol" id="cRK"><i id="bRK" style="background:var(--rocket)"></i></div>
          <div class="ecol" id="cXK"><i id="bXK" style="background:var(--exhaust)"></i></div>
          <div class="ecol" id="cRP"><i id="bRP" style="background:var(--pe)"></i></div>
          <div class="ecol" id="cXP"><i id="bXP" style="background:var(--peExh)"></i></div>
          <div class="ecol" id="cTH"><i id="bTH" style="background:var(--bad)"></i></div>
          <div class="ecol" id="cGD"><i id="bGD" style="background:var(--faint)"></i></div>
          <div class="ecol stack" id="cTOT">
            <i id="tRK" style="background:var(--rocket)"></i>
            <i id="tXK" style="background:var(--exhaust)"></i>
            <i id="tRP" style="background:var(--pe)"></i>
            <i id="tXP" style="background:var(--peExh)"></i>
            <i id="tTH" style="background:var(--bad)"></i>
            <i id="tGD" style="background:var(--faint)"></i>
          </div>
          <div class="emark" id="eMark"></div>
        </div>
    <div class="enums">
          <span id="nFU">연료 잔량</span><span id="nRK"></span><span id="nXK"></span>
          <span id="nRP"></span><span id="nXP"></span><span id="nTH"></span>
          <span id="nGD"></span><span id="nTOT">합계</span>
    </div>
  </div>
  </div>

  <dl class="metrics" id="metrics"></dl>

</div>

<script>
"use strict";
// MU = GM (지구 표준중력상수). 화면 표기는 GM, 계산에서는 한 덩어리 상수로 쓴다.
const MU=3.986004418e14, RE=6.371e6, G0=9.80665, M0=1000;
const VESC0=Math.sqrt(2*MU/RE);

const ETA=0.75;   // 노즐 효율: 연소열 중 방향성 운동으로 바뀌는 비율 (고정)
const P={mode:'horiz',fuel:0.94,ve:4400,mdot:40,speed:2,pulseM:50};
let holding=false;
const SPEEDS=[0.25,0.5,1,2,5,12,30];
let S,running=false;

function reset(){
  const mp=M0*P.fuel, mDry=M0-mp;
  /* 화살표 고정 축척의 기준: 무중력 전량 연소에서 선체 운동량 p = m·vₑln(m₀/m) 의 최댓값.
     dp/dm = 0 → m = m₀/e,  즉  p_max = m₀·vₑ/e.  (Δv < vₑ 면 단조증가라 m_f·Δv) */
  const dvI=P.ve*Math.log(M0/mDry);
  const pRef=Math.max((dvI>=P.ve)? M0*P.ve/Math.E : mDry*dvI, 1);
  S={t:0,m:M0,v:0,r:RE,x:0,mDry:mDry,mProp:mp,phase:'pad',pRef:pRef,
     EexhK:0,EexhP:0,pExh:0,Jth:0,Jg:0,Wth:0,gLoss:0,
     apogee:0,maxV:0,acc:0,maxG:0,escaped:false,particles:[],hist:[],padTime:0,
     Echem:0,pulses:0,dvGain:0,burnTime:0,lastPulse:null,flash:0,Eground:0};
  holding=false;
  starPhase=0; boostEase=1;
  running=false;
  document.getElementById('bRun').textContent='재생';
}

const DT=0.005; let particleClock=0;
function step(){
  if(S.phase==='escaped'||S.phase==='impact') return;
  const vert=(P.mode==='vert');
  const g=vert?MU/(S.r*S.r):0;
  if(S.flash>0) S.flash-=DT;

  /* 연속 분사: 버튼을 누르고 있는 동안 매 순간 dm = ṁ·dt 를 상대속도 vₑ 로 흘려보낸다.
     운동량:  m·dv = vₑ·dm       →  적분하면  Δv = vₑ ln(m₀/m)
     추력  :  F = vₑ·ṁ  (일정)                                              */
  const burning = holding && S.m>S.mDry+1e-9;
  let a;
  if(burning){
    const dm=Math.min(P.mdot*DT,S.m-S.mDry);
    const F=P.ve*(dm/DT);
    a=F/S.m-g;
    // 배기속도는 '추력 임펄스 직후' 로켓 속도 기준이어야 단발 분사와 식이 일치한다
    const vEx=(S.v+P.ve*dm/S.m)-P.ve;
    S.EexhK+=0.5*dm*vEx*vEx;
    if(vert) S.EexhP+=dm*MU*(1/RE-1/S.r);
    S.pExh+=dm*vEx;
    S.Jth+=F*DT; S.Wth+=F*S.v*DT;
    S.Echem+=0.5*P.ve*P.ve*dm*(S.m-dm)/S.m;
    S.dvGain+=P.ve*dm/S.m;
    S.m-=dm; S.burnTime+=DT; S.flash=0.1;
  }else{
    a=-g;
  }

  const resting = vert && S.r<=RE+1e-9 && S.v<=0 && a<0;
  if(vert && !resting){ S.Jg+=S.m*g*DT; S.gLoss+=g*DT; }

  S.acc=a;
  S.v+=a*DT;
  if(vert){
    S.r+=S.v*DT;
    if(S.r<RE){
      S.r=RE;
      if(S.v<0){ S.Eground+=0.5*S.m*S.v*S.v; S.v=0;
                 if(S.apogee>1e3) S.phase='impact'; }
    }
    S.apogee=Math.max(S.apogee,S.r-RE);
    if(S.r>RE+5e5&&0.5*S.v*S.v-MU/S.r>=0&&!burning) S.escaped=true;   // 판정만, 비행은 계속
    if(S.r>60*RE) S.phase='escaped';                                   // 달 궤도쯤에서 종료
  }else{ S.x+=S.v*DT; }
  S.maxV=Math.max(S.maxV,S.v); S.maxG=Math.max(S.maxG,Math.abs(a)/G0); S.t+=DT;

  particleClock+=DT;
  if(burning&&particleClock>0.025){
    particleClock=0;
    for(let i=0;i<3;i++) S.particles.push({
      r:S.r, x:S.x, v:S.v-P.ve*(0.85+Math.random()*0.3),
      lat:(Math.random()-0.5), life:1});
  }
  for(const p of S.particles){
    if(P.mode==='vert'){p.v-=MU/(p.r*p.r)*DT;p.r+=p.v*DT;} else p.x+=p.v*DT;
    p.life-=DT/2.2;
  }
  if(S.particles.length>420) S.particles.splice(0,S.particles.length-420);
  S.particles=S.particles.filter(p=>p.life>0);

  const gap=Math.max(0.05,S.t/1500);
  if(S.hist.length===0||S.t-S.hist[S.hist.length-1].t>gap){
    S.hist.push({t:S.t,v:S.v,vesc:vert?Math.sqrt(2*MU/S.r):0});
  }
}

/* 한 덩어리 Δm 을 상대속도 vₑ 로 순간 방출
   운동량:  m·v = (m−Δm)v′ + Δm(v′−vₑ)   →   Δv = vₑ·Δm/m
   에너지:  ΔE = ½vₑ²·Δm(m−Δm)/m                                        */
function firePulse(){
  const dm=Math.min(P.pulseM,S.m-S.mDry);
  if(dm<=1e-9||S.phase==='escaped'||S.phase==='impact') return;
  const ve=P.ve, m=S.m;
  const dv=ve*dm/m, vAfter=S.v+dv, vEx=vAfter-ve;

  S.EexhK+=0.5*dm*vEx*vEx;
  if(P.mode==='vert') S.EexhP+=dm*MU*(1/RE-1/S.r);
  S.pExh+=dm*vEx;
  S.Jth+=dm*ve;
  S.Wth+=m*dv*(S.v+vAfter)/2;
  S.Echem+=0.5*ve*ve*dm*(m-dm)/m;

  S.dvGain+=dv;
  S.lastPulse={dm,ve,dv,m};
  S.v=vAfter; S.m-=dm; S.pulses++; S.flash=0.32;
  audioThump(dm);
  S.maxV=Math.max(S.maxV,S.v);

  const np=Math.max(2,Math.min(20,Math.round(dm/2.5)));
  for(let i=0;i<np;i++) S.particles.push({
    r:S.r, x:S.x, v:vEx*(0.85+Math.random()*0.3),
    lat:(Math.random()-0.5), life:1});

  if(!running){running=true;$('bRun').textContent='일시정지';}
}

function derive(){
  const vert=(P.mode==='vert');
  const burned=M0-S.m;
  /* q = 연료 1 kg의 실제 반응열. 노즐은 그중 η 만 방향성 운동으로 바꾸므로 ½vₑ² = η·q.
     나머지는 뜨거운 채 빠져나가는 열이다. */
  const q=0.5*P.ve*P.ve/ETA;
  const Echem=S.Echem;                 // 역학적으로 쓰인 몫 (기존 수지 대상)
  const EchemRel=q*burned;             // 실제로 연소된 화학에너지
  const Eth=Math.max(0,EchemRel-Echem);// 열
  const rKE=0.5*S.m*S.v*S.v;
  const rPE=vert?S.m*MU*(1/RE-1/S.r):0;
  const xKE=S.EexhK, xPE=S.EexhP, gnd=S.Eground, sum=rKE+rPE+xKE+xPE+gnd;
  const u=S.v/P.ve;
  return {vert,burned,q,Echem,EchemRel,Eth,rKE,rPE,xKE,xPE,gnd,sum,resid:Echem-sum,
          dvIdeal:P.ve*Math.log(M0/S.mDry),
          eps:vert?0.5*S.v*S.v-MU/S.r:0,
          vesc:vert?Math.sqrt(2*MU/S.r):0,
          pRocket:S.m*S.v,pExh:S.pExh};
}

function si(x,unit,dp){
  const a=Math.abs(x); let d=1,p='';
  if(a>=1e9){d=1e9;p='G'}else if(a>=1e6){d=1e6;p='M'}else if(a>=1e3){d=1e3;p='k'}
  const v=x/d;
  const n=dp!==undefined?dp:(Math.abs(v)>=100?0:Math.abs(v)>=10?1:2);
  return v.toFixed(n)+' '+p+unit;
}
const pct=x=>(x*100).toFixed(1)+' %';
const kms=(v,dp=2)=>(v/1000).toFixed(dp)+' km/s';   // 속도는 언제나 km/s 로 통일
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function niceStep(x){
  const e=Math.pow(10,Math.floor(Math.log10(Math.max(x,1e-9)))), m=x/e;
  return (m<1.5?1:m<3.5?2:m<7.5?5:10)*e;
}

/* ---------- canvas ---------- */
const view=document.getElementById('view'), vctx=view.getContext('2d');
const chart=document.getElementById('chart'), cctx=chart.getContext('2d');
function fit(cv){
  const dpr=Math.min(devicePixelRatio||1,2), r=cv.getBoundingClientRect();
  cv.width=Math.max(1,r.width*dpr); cv.height=Math.max(1,r.height*dpr);
  cv.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  return {w:r.width,h:r.height};
}
let VS,CS;
function resize(){VS=fit(view);CS=fit(chart);}
addEventListener('resize',resize);

function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

/* L = 로켓 전체 길이(px)
   cap  = m_p/m₀        탱크 자체의 크기. 말미(노즐 쪽)에 붙어 위로 자란다.
   fill = (m−m_dry)/m_p 그 탱크 안에 남은 추진제 비율. */
function drawRocket(ctx,x,y,ang,L,thrusting,cap,fill){
  const W=L*0.30;
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);

  if(thrusting){
    const tip=L*(0.50+0.42+Math.random()*0.26);
    const g=ctx.createLinearGradient(0,L*0.50,0,tip);
    g.addColorStop(0,'rgba(255,238,190,.98)');
    g.addColorStop(.35,'rgba(255,150,70,.65)');
    g.addColorStop(1,'rgba(255,110,40,0)');
    ctx.fillStyle=g; ctx.beginPath();
    ctx.moveTo(-W*0.40,L*0.49); ctx.lineTo(W*0.40,L*0.49); ctx.lineTo(0,tip);
    ctx.closePath(); ctx.fill();
  }

  ctx.fillStyle='#8fa2c4';
  for(const sgn of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(sgn*W*0.48,L*0.08);
    ctx.lineTo(sgn*W*1.02,L*0.42);
    ctx.lineTo(sgn*W*0.48,L*0.36);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle='#7285a4';
  ctx.beginPath();
  ctx.moveTo(-W*0.30,L*0.34); ctx.lineTo(W*0.30,L*0.34);
  ctx.lineTo(W*0.44,L*0.50); ctx.lineTo(-W*0.44,L*0.50);
  ctx.closePath(); ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0,-L*0.50);
  ctx.quadraticCurveTo(W*0.50,-L*0.32,W*0.50,-L*0.24);
  ctx.lineTo(W*0.50,L*0.34); ctx.lineTo(-W*0.50,L*0.34);
  ctx.lineTo(-W*0.50,-L*0.24);
  ctx.quadraticCurveTo(-W*0.50,-L*0.32,0,-L*0.50);
  ctx.closePath();
  ctx.fillStyle='#e9eff9'; ctx.fill();
  ctx.strokeStyle='#93a5c2'; ctx.lineWidth=1.1; ctx.stroke();

  /* ---- 연료 탱크 게이지 ---- */
  const tBot=L*0.31, tHmax=L*0.57, tW=W*0.68;
  const tH=Math.max(tHmax*clamp(cap,0,1),4), tTop=tBot-tH;
  const rr=Math.min(W*0.10,tH/2-0.5,tW/2-0.5);
  const fh=tH*clamp(fill,0,1);
  ctx.save();
  rrect(ctx,-tW/2,tTop,tW,tH,rr); ctx.clip();
  ctx.fillStyle='#111a27'; ctx.fillRect(-tW/2,tTop,tW,tH);           // 비어 있는 탱크 내부
  if(fh>0.6){
    const fTop=tBot-fh;
    const fg=ctx.createLinearGradient(0,fTop,0,tBot);
    fg.addColorStop(0,'#ffcf7a'); fg.addColorStop(1,'#f4701c');
    ctx.fillStyle=fg; ctx.fillRect(-tW/2,fTop,tW,fh);
    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fillRect(-tW/2,fTop,tW,1.8);
  }
  ctx.restore();
  rrect(ctx,-tW/2,tTop,tW,tH,rr);
  ctx.strokeStyle='#93a5c2'; ctx.lineWidth=1.1; ctx.stroke();
  if(tH>L*0.10){                                                     // 탱크 용량 대비 1/4 눈금
    ctx.strokeStyle='rgba(147,165,194,.55)'; ctx.lineWidth=1;
    for(let k=1;k<4;k++){
      const yy=tTop+tH*k/4;
      ctx.beginPath(); ctx.moveTo(tW/2-W*0.16,yy); ctx.lineTo(tW/2-1,yy); ctx.stroke();
    }
  }
  ctx.fillStyle='#4dd6e8';
  ctx.beginPath(); ctx.arc(0,-L*0.29,W*0.13,0,6.283); ctx.fill();
  ctx.restore();
}

function arrow(ctx,x1,y1,x2,y2,col,label){
  if(Math.hypot(x2-x1,y2-y1)<3) return;
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-8*Math.cos(a-.4),y2-8*Math.sin(a-.4));
  ctx.lineTo(x2-8*Math.cos(a+.4),y2-8*Math.sin(a+.4));
  ctx.closePath(); ctx.fill();
  ctx.font='600 12px ui-monospace, monospace';
  ctx.fillText(label,x2+6,y2-4);
}

/* ---------- 효과음 (Web Audio 합성) ----------
   배기 굉음 = 핑크노이즈 → 로우패스,  저주파 럼블 = 톱니파 → 로우패스.
   한 발마다 트랜지언트(붐 + 노이즈 버스트)를 얹고, 꾹 누르는 동안엔 지속음을 유지한다. */
let AC=null, master=null, noiseBuf=null, roarLP=null, roarGain=null, rumbleOsc=null, rumbleGain=null;
let soundOn=true, sustaining=false, lastThump=-1;

function audioInit(){
  if(AC) return;
  const Ctor=window.AudioContext||window.webkitAudioContext;
  if(!Ctor) return;
  try{ AC=new Ctor(); }catch(e){ return; }

  master=AC.createGain(); master.gain.value=soundOn?0.9:0; master.connect(AC.destination);

  const len=Math.floor(AC.sampleRate*2);
  noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){                       // 핑크 노이즈 근사 (Paul Kellet)
    const w=Math.random()*2-1;
    b0=0.99765*b0+w*0.0990460;
    b1=0.96300*b1+w*0.2965164;
    b2=0.57000*b2+w*1.0526913;
    d[i]=(b0+b1+b2+w*0.1848)*0.28;
  }
  const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
  roarLP=AC.createBiquadFilter(); roarLP.type='lowpass'; roarLP.frequency.value=900; roarLP.Q.value=0.8;
  roarGain=AC.createGain(); roarGain.gain.value=0;
  src.connect(roarLP); roarLP.connect(roarGain); roarGain.connect(master); src.start();

  rumbleOsc=AC.createOscillator(); rumbleOsc.type='sawtooth'; rumbleOsc.frequency.value=42;
  const rlp=AC.createBiquadFilter(); rlp.type='lowpass'; rlp.frequency.value=110; rlp.Q.value=0.9;
  rumbleGain=AC.createGain(); rumbleGain.gain.value=0;
  rumbleOsc.connect(rlp); rlp.connect(rumbleGain); rumbleGain.connect(master); rumbleOsc.start();
}
function audioWake(){ audioInit(); if(AC&&AC.state==='suspended') AC.resume(); }

function setSustain(on){
  if(!AC||on===sustaining) return;
  sustaining=on;
  const t=AC.currentTime;
  roarLP.frequency.setTargetAtTime(420+Math.min(P.ve,5000)*0.42, t, 0.08);
  rumbleOsc.frequency.setTargetAtTime(34+Math.min(P.mdot,120)*0.22, t, 0.12);
  roarGain.gain.setTargetAtTime(on?0.50:0, t, on?0.05:0.13);
  rumbleGain.gain.setTargetAtTime(on?0.34:0, t, on?0.06:0.16);
}

function audioThump(dm){
  if(!AC||!soundOn) return;
  const t=AC.currentTime;
  if(t-lastThump<0.045) return;                 // 연사 시 트랜지언트 과밀 방지
  lastThump=t;
  const amp=Math.min(1,0.22+dm/200);

  const o=AC.createOscillator(), og=AC.createGain();   // 저음 붐
  o.type='sine';
  o.frequency.setValueAtTime(160,t);
  o.frequency.exponentialRampToValueAtTime(36,t+0.30);
  og.gain.setValueAtTime(0.0001,t);
  og.gain.exponentialRampToValueAtTime(0.55*amp,t+0.014);
  og.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
  o.connect(og); og.connect(master); o.start(t); o.stop(t+0.47);

  const n=AC.createBufferSource(); n.buffer=noiseBuf; n.loop=true;   // 파열음
  const nf=AC.createBiquadFilter(); nf.type='bandpass';
  nf.frequency.setValueAtTime(1400,t);
  nf.frequency.exponentialRampToValueAtTime(420,t+0.25);
  nf.Q.value=0.7;
  const ng=AC.createGain();
  ng.gain.setValueAtTime(0.0001,t);
  ng.gain.exponentialRampToValueAtTime(0.42*amp,t+0.008);
  ng.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
  n.connect(nf); nf.connect(ng); ng.connect(master); n.start(t); n.stop(t+0.34);
}

/* ---------- 별 (속도감) ---------- */
const STARS=[];
for(let i=0;i<190;i++) STARS.push({u:Math.random(),w:Math.random(),d:0.16+Math.random()*0.84});
let starPhase=0, lastDt=0.016, starRate=0;
/* 별의 화면 축척. 두 모드가 같은 값을 써야 같은 속도가 같은 속도감으로 보인다.
   연직 모드의 지면·고도 눈금은 고도에 따라 줌아웃하지만(그건 카메라 문제),
   별은 로켓에서 일정 거리에 고정된 기준점이므로 줌과 무관하다. */
function starScale(){
  return VS ? (VS.w*0.5)/(P.ve*0.75) : 0;
}
function updateStars(){
  /* 배속을 그대로 반영한다. 상한을 걸면 고고도(축척이 1/r 로 작아진 구간)에서
     실제로는 초속 수 km 로 날아가는데 별이 멈춰 보인다. 최종 px/s 만 가독 한계로 제한. */
  starRate = clamp(S.v*starScale()*simScale, -1400, 1400);
  starPhase += starRate*lastDt;
  if(!isFinite(starPhase)) starPhase=0;
}
function drawStars(ctx,w,h,vertical){
  const vs=starRate, dir=Math.sign(vs)||1;
  for(const st of STARS){
    const off=starPhase*st.d;
    const len=Math.min(Math.abs(vs)*st.d*0.030,44);   // 노출 30 ms 분량의 모션 블러
    let x,y;
    if(vertical){ x=st.u*w; y=(((st.w*h+off)%h)+h)%h; }
    else        { y=st.w*h; x=(((st.u*w-off)%w)+w)%w; }
    ctx.globalAlpha=0.22+st.d*0.62;
    if(len>1.6){
      ctx.strokeStyle='#c6d3ec'; ctx.lineWidth=Math.max(.6,st.d*1.3);
      ctx.beginPath();
      if(vertical){ ctx.moveTo(x,y-len*dir); ctx.lineTo(x,y); }
      else        { ctx.moveTo(x+len*dir,y); ctx.lineTo(x,y); }
      ctx.stroke();
    }else{
      ctx.fillStyle='#c6d3ec'; const r=.8+st.d*1.2; ctx.fillRect(x,y,r,r);
    }
  }
  ctx.globalAlpha=1;
}

const ALT_MARKS=[

  [2.02e7,'GPS 위성'],[3.5786e7,'정지궤도'],[3.844e8,'달 궤도']
];

  [325e3,'서울–부산'],[11e6,'서울–뉴욕'],[40.075e6,'지구 한 바퀴'],[3.844e8,'지구–달']

function refText(x, table){
  let best=null;
  for(const [d,n] of table) if(x>=d*0.9) best=[d,n];
  if(!best) return '';
  const k=x/best[0];
  return `${best[1]}의 ${k<10?k.toFixed(1):k.toFixed(0)}배`;
}

/* 로켓과 배기가스의 운동량을 공통 원점에서 서로 반대로 뻗는 한 쌍으로 그린다.
   같은 축척을 쓰므로, 무중력에서는 두 길이가 항상 정확히 같다 (총 운동량 0). */
function thickArrow(ctx,x1,y1,x2,y2,col,lw){
  const L=Math.hypot(x2-x1,y2-y1);
  if(L<2) return;
  const a=Math.atan2(y2-y1,x2-x1), hd=Math.min(13,L*0.5);
  const bx=x2-hd*Math.cos(a), by=y2-hd*Math.sin(a);
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(bx,by); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(bx+lw*1.6*Math.sin(a), by-lw*1.6*Math.cos(a));
  ctx.lineTo(bx-lw*1.6*Math.sin(a), by+lw*1.6*Math.cos(a));
  ctx.closePath(); ctx.fill(); ctx.lineCap='butt';
}
/* 운동량 벡터 하나. 그것이 속한 물체 옆에 원점을 두고, (ux,uy) 방향을 +로 삼는다.
   축척은 S.pRef 로 고정 — 두 벡터가 같은 축척을 쓰므로 길이를 직접 비교할 수 있다. */
/* 운동량 벡터. 속도 벡터와 같은 방식으로 중심을 고정하고 양쪽으로 자란다.
   (ux,uy) 는 p>0 일 때의 방향, side 는 라벨을 어느 쪽에 붙일지(-1 왼쪽/위, +1 오른쪽/아래). */
function momVec(ctx,cx,cy,ux,uy,p,col,name,maxLen,active,side){
  if(Math.abs(p)<1e-6) return;
  const sc=maxLen/S.pRef, lw=active?4.5:3;
  const raw=p*sc, cap=maxLen*1.18;
  const len=Math.max(-cap,Math.min(cap,raw)), clipped=Math.abs(raw)>cap;
  const px=-uy, py=ux;                                   // 방향에 수직인 단위벡터
  const hx=ux*len/2, hy=uy*len/2;
  const ex=cx+hx, ey=cy+hy;

  ctx.save();
  ctx.globalAlpha=active?1:0.75;
  ctx.strokeStyle='rgba(233,239,249,.45)'; ctx.lineWidth=1;          // 고정된 중심
  ctx.beginPath(); ctx.moveTo(cx-px*7,cy-py*7); ctx.lineTo(cx+px*7,cy+py*7); ctx.stroke();
  ctx.strokeStyle='rgba(233,239,249,.18)';                            // 전체 축척 눈금
  for(const sg of [1,-1]){
    const tx=cx+ux*maxLen/2*sg, ty=cy+uy*maxLen/2*sg;
    ctx.beginPath(); ctx.moveTo(tx-px*4,ty-py*4); ctx.lineTo(tx+px*4,ty+py*4); ctx.stroke();
  }

  thickArrow(ctx,cx-hx,cy-hy,ex,ey,col,lw);
  if(clipped){
    ctx.strokeStyle=col; ctx.lineWidth=2;
    for(let k=0;k<2;k++){
      const bx=ex-ux*(11+k*5)*Math.sign(len), by=ey-uy*(11+k*5)*Math.sign(len);
      ctx.beginPath(); ctx.moveTo(bx-px*7,by-py*7); ctx.lineTo(bx+px*7,by+py*7); ctx.stroke();
    }
  }

  ctx.fillStyle=col; ctx.textBaseline='middle';
  const off=(side||1)*13;
  if(uy===0){                                            // 가로 벡터 → 위/아래로 비켜서 표기
    ctx.textAlign=len>=0?'left':'right';
    const tx=ex+(len>=0?11:-11);
    ctx.font='700 12px ui-monospace, monospace'; ctx.fillText(name, tx, ey+off-7);
    ctx.font='11px ui-monospace, monospace';    ctx.fillText(si(Math.abs(p),'N·s',1), tx, ey+off+8);
  }else{                                                 // 세로 벡터 → 좌/우로 비켜서 표기
    ctx.textAlign=off>0?'left':'right';
    ctx.font='700 12px ui-monospace, monospace'; ctx.fillText(name, ex+off, ey-8);
    ctx.font='11px ui-monospace, monospace';    ctx.fillText(si(Math.abs(p),'N·s',1), ex+off, ey+7);
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.restore();
}

const VPX=110;   // 속도 화살표 축척: 1 px = 110 m/s (두 모드 공통, 전체 12,100 m/s)

/* 속도 벡터: 중심을 한 자리에 고정하고 시작점·끝점이 그 중심에서 양쪽으로 자란다.
   꼬리가 고정된 화살표는 로켓이나 화면 밖으로 밀려 가려지기 쉬운데, 이렇게 두면
   길이가 아무리 변해도 항상 같은 자리에 머문다. */
function centerArrow(ctx,cx,cy,ux,uy,len,col,label){
  const hx=ux*len/2, hy=uy*len/2;
  ctx.strokeStyle='rgba(233,239,249,.45)'; ctx.lineWidth=1;   // 고정된 중심 표식
  ctx.beginPath(); ctx.moveTo(cx+uy*6,cy-ux*6); ctx.lineTo(cx-uy*6,cy+ux*6); ctx.stroke();
  if(Math.abs(len)>=3) arrow(ctx,cx-hx,cy-hy,cx+hx,cy+hy,col,'');
  ctx.fillStyle=col; ctx.font='600 12px ui-monospace, monospace';
  ctx.textAlign = uy!==0 ? 'left' : (len>=0?'left':'right');
  ctx.fillText(label, cx+hx+(uy!==0?10:(len>=0?9:-9)), cy+hy+(uy!==0?0:-9));
  ctx.textAlign='left';
}

function drawView(){
  const {w,h}=VS, ctx=vctx;
  ctx.clearRect(0,0,w,h);
  const vertical=(P.mode==='vert');
  const burning=S.flash>0;

  // 우주 배경
  const bg=ctx.createRadialGradient(w*.5,h*.35,0,w*.5,h*.35,Math.max(w,h)*.8);
  bg.addColorStop(0,'#101827'); bg.addColorStop(1,'#05070d');
  ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
  drawStars(ctx,w,h,vertical);

  if(vertical){
    const alt=S.r-RE, rocketY=h*0.40;
    const RL=clamp(h*0.42,120,224), fuelFill=S.mProp>0?(S.m-S.mDry)/S.mProp:0;

    /* 지표·고도 눈금·배기를 모두 별과 같은 축척에 둔다.
       그래야 지면이 흘러가는 속도와 별이 흘러가는 속도가 일치한다.
       실제 비율이므로 지면은 곧 화면 아래로 사라진다 — 둥근 지구는 그리지 않는다. */
    const scale=starScale();
    const groundY=rocketY+RL*0.5+alt*scale;

    // 대기 — 고도로만 옅어진다 (축척과 무관)
    const air=clamp(1-alt/1.0e5,0,1);
    if(air>0.01){
      const g=ctx.createLinearGradient(0,h,0,h*0.15);
      g.addColorStop(0,`rgba(70,140,220,${0.5*air})`); g.addColorStop(1,'rgba(70,140,220,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    }
    // 지표 — 평면으로만
    if(groundY<h){
      const eg=ctx.createLinearGradient(0,groundY,0,h);   // 지표는 흙빛으로 — 하늘과 헷갈리지 않게
      eg.addColorStop(0,'#6b5433'); eg.addColorStop(1,'#2a1f13');
      ctx.fillStyle=eg; ctx.fillRect(0,groundY,w,h-groundY);
      ctx.strokeStyle='#a8874f'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(w,groundY); ctx.stroke();
    }

    // 고도 기준선 (숫자 대신 이름)
    ctx.font='12px ui-monospace, monospace';
    for(const [A,name] of ALT_MARKS){
      const y=groundY-A*scale;
      if(y<16||y>h-6) continue;
      ctx.strokeStyle='rgba(120,190,255,.30)'; ctx.lineWidth=1; ctx.setLineDash([3,5]);
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='rgba(150,205,255,.85)'; ctx.fillText(name,10,y-5);
    }
    // 배기
    for(const p of S.particles){
      const y=rocketY+RL*0.5-(p.r-S.r)*scale;
      if(y<-40||y>h+40) continue;
      ctx.globalAlpha=Math.max(0,p.life)*.9;
      ctx.fillStyle=p.life>.6?'#ffd68c':'#ff8c42';
      ctx.beginPath(); ctx.arc(w/2+p.lat*RL*0.30,y,2.0+p.life*RL*0.045,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;
    drawRocket(ctx,w/2,rocketY,0,RL,burning,P.fuel,fuelFill);
    centerArrow(ctx,w/2-RL*0.60,rocketY,0,-1,clamp(S.v/VPX,-VPX,VPX),'#4dd6e8','v '+kms(S.v));
    const act=burning||holding, ML=Math.min(RL*0.72,140), AX=w/2+RL*0.42;
    momVec(ctx,AX,     rocketY-RL*0.22,0,-1,S.m*S.v,'#4dd6e8','선체 p',ML,act,+1);
    momVec(ctx,AX+30,  rocketY+RL*0.30,0,-1,S.pExh, '#ff9f45','방출 연료 p',ML,act,+1);

  }else{
    const rocketX=w*0.58, y=h*0.50, scale=(w*0.5)/(P.ve*0.75);
    const RL=clamp(h*0.42,120,224), fuelFill=S.mProp>0?(S.m-S.mDry)/S.mProp:0;

    // 배기
    for(const p of S.particles){
      const sx=rocketX-RL*0.5+(p.x-S.x)*scale;
      if(sx<-40||sx>w+40) continue;
      ctx.globalAlpha=Math.max(0,p.life)*.9;
      ctx.fillStyle=p.life>.6?'#ffd68c':'#ff8c42';
      ctx.beginPath(); ctx.arc(sx,y+p.lat*RL*0.38,2.0+p.life*RL*0.045,0,6.283); ctx.fill();
    }
    ctx.globalAlpha=1;
    drawRocket(ctx,rocketX,y,Math.PI/2,RL,burning,P.fuel,fuelFill);
    centerArrow(ctx,rocketX,y-RL*0.62,1,0,clamp(S.v/VPX,-VPX,VPX),'#4dd6e8','v '+kms(S.v));
    const act=burning||holding, ML=Math.min(RL*0.72,140);
    // 선체 벡터는 동체 위, 연료 벡터는 노즐 바깥 연기 쪽 — 각자 자기 물체 옆에
    momVec(ctx,rocketX+RL*0.14, y-RL*0.42,1,0,S.m*S.v,'#4dd6e8','선체 p',ML,act,-1);
    momVec(ctx,rocketX-RL*0.62, y+RL*0.42,1,0,S.pExh, '#ff9f45','방출 연료 p',ML,act,+1);
  }
}

function drawChart(){
  const {w,h}=CS, ctx=cctx, pad={l:58,r:16,t:18,b:24};
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#080c15'; ctx.fillRect(0,0,w,h);
  const D=derive();
  const tMax=Math.max(S.t*1.05,10);
  const yMax=P.mode==='vert'?Math.max(VESC0*1.12,S.maxV*1.12)
                            :Math.max(D.dvIdeal*1.15,S.maxV*1.12,100);
  const X=t=>pad.l+(t/tMax)*(w-pad.l-pad.r);
  const Y=v=>h-pad.b-(v/yMax)*(h-pad.t-pad.b);

  ctx.font='10px ui-monospace, monospace'; ctx.lineWidth=1;
  for(let k=0;k<=4;k++){
    const v=yMax*k/4,y=Y(v);
    ctx.strokeStyle='rgba(255,255,255,.07)';
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
    ctx.fillStyle='#6f7d96'; ctx.fillText(kms(v,1),8,y+3);
  }
  ctx.fillStyle='#6f7d96'; ctx.fillText(S.t.toFixed(1)+' s',w-pad.r-40,h-7);

  if(P.mode==='vert'){
    ctx.strokeStyle='rgba(255,209,102,.5)'; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(pad.l,Y(VESC0)); ctx.lineTo(w-pad.r,Y(VESC0)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#ffd166'; ctx.fillText('지표 탈출속도 11.2 km/s',pad.l+6,Y(VESC0)-5);
    ctx.strokeStyle='#e07be0'; ctx.lineWidth=1.6; ctx.beginPath();
    S.hist.forEach((p,i)=>i?ctx.lineTo(X(p.t),Y(p.vesc)):ctx.moveTo(X(p.t),Y(p.vesc)));
    ctx.stroke();
  }else{
    ctx.strokeStyle='rgba(255,209,102,.5)'; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(pad.l,Y(D.dvIdeal)); ctx.lineTo(w-pad.r,Y(D.dvIdeal)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#ffd166';
    ctx.fillText('Δv = v\u2091 ln(m₀/m_f) = '+kms(D.dvIdeal),pad.l+6,Y(D.dvIdeal)-5);
  }
  ctx.strokeStyle='#4dd6e8'; ctx.lineWidth=2; ctx.beginPath();
  S.hist.forEach((p,i)=>i?ctx.lineTo(X(p.t),Y(p.v)):ctx.moveTo(X(p.t),Y(p.v)));
  ctx.stroke();
  ctx.font='600 11px ui-monospace, monospace';
  ctx.fillStyle='#4dd6e8'; ctx.fillText('v(t)',w-pad.r-92,pad.t+2);
  if(P.mode==='vert'){ctx.fillStyle='#e07be0'; ctx.fillText('v_esc(r)',w-pad.r-50,pad.t+2);}
}

const $=id=>document.getElementById(id);

function drawPanels(){
  const D=derive(), vert=D.vert;
  const ctxTxt = vert ? refText(S.r-RE, ALT_MARKS.map(([d,n])=>[d,n]))
                      : refText(S.x, DIST_REFS);
  $('hud').innerHTML = (vert
    ? `t <b>${S.t.toFixed(1)} s</b> &nbsp; 고도 <b>${si(S.r-RE,'m')}</b> &nbsp; v <b>${kms(S.v)}</b> &nbsp; m <b>${S.m.toFixed(0)} kg</b>`
    : `t <b>${S.t.toFixed(1)} s</b> &nbsp; 이동 <b>${si(S.x,'m')}</b> &nbsp; v <b>${kms(S.v)}</b> &nbsp; m <b>${S.m.toFixed(0)} kg</b>`)
    + (ctxTxt?`<br><span class="ctx">≈ ${ctxTxt}</span>`:'');

  const map={pad:['대기','coast'],burn:['연소 중','burn'],stuck:['추력 < 중력 — 이륙 실패','fail'],
             coast:['',''],escaped:['탈출 — 관측 종료','esc'],impact:['지표 충돌','fail']};
  if(S.phase!=='escaped'&&S.phase!=='impact')
    map[S.phase]=holding?'연속 분사 중':(S.flash>0?'단발 분사!'
      :(S.escaped?`탈출 확정 ×${Math.round(boostEase)}`
        :((S.pulses||S.burnTime)?'':'대기 — 분사하세요')));
  if(typeof map[S.phase]==='string') map[S.phase]=[map[S.phase],(holding||S.flash>0)?'burn':(S.escaped?'esc':'coast')];
  const [txt,cls]=map[S.phase]||['대기','coast'];
  $('status').textContent=txt;
  $('status').className='status '+cls;
  $('status').style.display = txt ? '' : 'none';

  $('metrics').innerHTML=[
    ['속도 v',kms(S.v)],
    ['질량비 m₀/m',(M0/S.m).toFixed(2)],
    ['가속도',(S.acc/G0).toFixed(1)+' g'],
    ['최대 가속도',S.maxG.toFixed(0)+' g'],
    vert?['고도',si(S.r-RE,'m')]:['이동거리',si(S.x,'m')],
    vert?['현 위치 탈출속도',kms(D.vesc)]:['Δv 한계',kms(D.dvIdeal)],
    ['분사 횟수',S.pulses+' 발']
  ].map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');

  {
    const left=S.m-S.mDry;
    $('pulseStat').innerHTML=`남은 연료 <b>${left.toFixed(0)} kg</b>`;
    const done=(S.m-S.mDry)<=1e-9||S.phase==='escaped'||S.phase==='impact';
    $('bFire').disabled=done;
  }
  /* 모든 막대가 같은 축척을 쓴다 — 폭 100 % = 연료 전량 ½vₑ²m_p.
     노란 점선 = 지금까지 방출된 화학에너지(①의 오른쪽 끝).
     맨 아래 ②+③+④ 막대가 그 선에 정확히 멈추는 것이 에너지 보존이다. */
  const EF=Math.max(D.q*S.mProp,1e-9);          // 연료가 품은 순수 화학에너지 전량
  const E=Math.max(D.Echem,1e-9);
  const pc=v=>(Math.max(0,v)/EF*100)+'%';

  /* 세로 막대: 아래에서 위로 자라고, ①만 위에 붙어 아래로 줄어든다.
     가로 점선(--mk)이 지금까지 연소된 화학에너지 높이 — ①의 아랫변과 Σ의 윗변이 여기서 만난다. */
  $('eCols').style.setProperty('--mk', pc(D.EchemRel));
  $('bFU').style.height=pc(EF-D.EchemRel);
  $('eFullTop').textContent=si(EF,'J',1)+' 만재';

  [['RK',D.rKE],['XK',D.xKE],['RP',D.rPE],['XP',D.xPE],['TH',D.Eth],['GD',D.gnd]].forEach(([k,v])=>{
    $('b'+k).style.height=pc(v);
    $('t'+k).style.height=pc(v);
  });
  /* 번호는 '지금 화면에 보이는 줄'에만 순서대로 매긴다.
     무중력이면 ②③ 두 줄뿐이고, 연직이면 위치E 두 줄이 ④⑤ 로 이어진다. */
  const vis=[['RK','선체 운동'],['XK','방출연료 운동']];
  if(vert) vis.push(['RP','선체 위치'],['XP','방출연료 위치']);
  vis.push(['TH','열']);
  if(D.gnd>0) vis.push(['GD','지면 흡수']);
  ['RK','XK','RP','XP','TH','GD'].forEach(k=>{
    const i=vis.findIndex(r=>r[0]===k);
    $('c'+k).style.display = i<0?'none':'flex';
    $('n'+k).style.display = i<0?'none':'flex';
    if(i>=0) $('n'+k).textContent = vis[i][1];
  });

}

function syncControls(){
  const mp=M0*P.fuel, mf=M0-mp;
  $('mHoriz').setAttribute('aria-pressed',P.mode==='horiz');
  $('mVert').setAttribute('aria-pressed',P.mode==='vert');
  $('sPulse').value=P.pulseM;
  $('vPulse').textContent=P.pulseM+' kg';
  $('sFuel').value=P.fuel; $('sVe').value=P.ve; $('sMdot').value=P.mdot;
  $('vFuel').textContent=(P.fuel*100).toFixed(0)+' %';
  $('vVe').textContent=kms(P.ve);
  $('vMdot').textContent=P.mdot+' kg/s';

}

$('mHoriz').onclick=()=>{P.mode='horiz';reset();syncControls();redraw();};
$('mVert').onclick =()=>{P.mode='vert'; reset();syncControls();redraw();};
$('sFuel').oninput =e=>{P.fuel=+e.target.value;reset();syncControls();redraw();};
$('sVe').oninput   =e=>{P.ve=+e.target.value;  reset();syncControls();redraw();};
$('sMdot').oninput =e=>{P.mdot=+e.target.value;reset();syncControls();redraw();};
$('sPulse').oninput =e=>{P.pulseM=+e.target.value;syncControls();redraw();};
$('bSound').onclick =()=>{
  soundOn=!soundOn;
  const b=$('bSound');
  b.setAttribute('aria-pressed',soundOn); b.textContent=soundOn?'♪':'✕';
  if(soundOn) audioWake(); 
  if(master) master.gain.setTargetAtTime(soundOn?0.9:0, AC.currentTime, 0.02);
};
function startBurn(){ audioWake(); if(holding) return; holding=true;
  if(!running){running=true;$('bRun').textContent='일시정지';} syncControls(); redraw(); }
function stopBurn(){ holding=false; setSustain(false); syncControls(); }
function shoot(){ audioWake(); firePulse(); syncControls(); redraw(); }

/* 하나의 버튼: 짧게 누르면 단발 Δm, HOLD_MS 이상 누르고 있으면 연속 분사 ṁ */
const HOLD_MS=180;
let pressing=false, holdTimer=null;
const bf=$('bFire');
function pressStart(){
  if(pressing) return; pressing=true; audioWake();
  bf.classList.add('armed');
  holdTimer=setTimeout(()=>{ holdTimer=null; startBurn(); }, HOLD_MS);
}
function pressEnd(){
  if(!pressing) return; pressing=false;
  bf.classList.remove('armed');
  if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; shoot(); }  // 짧게 → 단발
  else stopBurn();                                                     // 길게 → 연속 종료
}
function pressCancel(){
  if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
  pressing=false; bf.classList.remove('armed'); stopBurn();
}
bf.addEventListener('pointerdown',e=>{e.preventDefault();bf.blur();pressStart();});
['pointerup','pointerleave','pointercancel'].forEach(ev=>bf.addEventListener(ev,pressEnd));
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.repeat) return;
  if(e.code==='Space'){ e.preventDefault(); pressStart(); }
});
addEventListener('keyup',e=>{ if(e.code==='Space') pressEnd(); });
addEventListener('blur',pressCancel);
$('bRun').onclick=()=>{running=!running;$('bRun').textContent=running?'일시정지':'재생';};
$('bReset').onclick=()=>{pressCancel();reset();syncControls();redraw();};

/* 연소가 끝난 뒤 관성 비행은 실시간으로 보면 수십 시간이 걸린다.
   고도가 높아질수록(=변화가 느려질수록) 시계를 크게 앞당긴다. */
let simScale=1, boostEase=1;
function coastBoost(){
  const flying = S.pulses>0 || S.burnTime>0;
  const burningNow = holding && S.m>S.mDry+1e-9;
  if(P.mode!=='vert' || burningNow || !flying) return 1;
  /* 연소 직후(r≈R⊕)에는 1배로 시작해야 별 흐름이 튀지 않는다.
     고도가 오르면 화면 축척이 1/r 로 줄어 움직임이 안 보이므로 가파르게 끌어올린다. */
  return clamp(Math.pow(S.r/RE,8),1,4000);
}

function redraw(){drawView();drawChart();drawPanels();}
let last=performance.now();
function loop(now){
  const dtReal=Math.min((now-last)/1000,0.05); last=now; lastDt=dtReal;
  if(holding && !running){ running=true; $('bRun').textContent='일시정지'; }
  /* 배속을 계단처럼 올리면 연소 종료 순간 별이 갑자기 튄다.
     지수 완화로 밀어 올리고(1.2 s), 다시 분사하면 빠르게 되돌린다(0.25 s). */
  const bTarget=coastBoost();
  const tau = bTarget>boostEase ? 1.2 : 0.25;
  boostEase += (bTarget-boostEase)*(1-Math.exp(-dtReal/tau));
  simScale=SPEEDS[P.speed]*boostEase;
  if(running) updateStars(); else starRate=0;
  if(running){
    const n=Math.min(Math.ceil(dtReal*simScale/DT),25000);
    for(let i=0;i<n;i++){
      step();
      if(S.phase==='escaped'||S.phase==='impact'){running=false;$('bRun').textContent='재생';break;}
    }
  }
  setSustain(soundOn && holding && S.m>S.mDry+1e-9);
  redraw(); requestAnimationFrame(loop);
}
reset(); resize(); syncControls(); redraw(); requestAnimationFrame(loop);
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기체 법칙 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 수업용 시뮬레이션: 회색 실험판 하나에 장치(왼쪽)와 그래프(오른쪽). 카드·배지 없이 평평하게. */
:root{
  --bg:#ffffff;
  --board:#f2f2f2;
  --ink:#222222;
  --muted:#777777;
  --rule:#d6d6d6;
  --red:#d33a2c;
  --blue:#2f5fc4;
  --green:#2a7d4f;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:14px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 24px;border-bottom:1px solid var(--rule);margin-bottom:14px}
h1{margin:0 0 9px;font-size:1.3rem;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:0 18px}
.tabs{order:3}
.tabs button{border:0;background:none;padding:6px 0 9px;font-size:1rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.law{order:4;margin:0 0 9px auto;font-size:1.1rem;font-weight:500;color:#333;white-space:nowrap}

.sim{background:var(--board);display:grid;grid-template-columns:minmax(0,1fr);gap:12px 28px;padding:16px 18px 18px}
@media (min-width:940px){.sim{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.left,.right{min-width:0;display:flex;flex-direction:column;gap:8px}

#stage{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.meters{position:relative;display:flex;flex-direction:column;gap:6px;font-size:.95rem;border-top:1px solid var(--rule);padding-top:12px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:12px;align-items:center;margin-right:64px}
.bar .t{height:9px;background:#e0e0e0}
.bar .t i{display:block;height:100%;width:0}
#barExt{background:var(--red)} #barGas{background:var(--blue)}
.bar output{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
#valExt{color:var(--red)} #valGas{color:var(--blue)}
.pill{position:absolute;right:0;top:12px;font-weight:700;font-size:.95rem}
.pill.ok{color:var(--green)} .pill.moving{color:#b06a10}

.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 20px;font-size:1.2rem;color:#666;font-variant-numeric:tabular-nums}
.readout div{white-space:nowrap}
.readout b{font-weight:500;color:#444}
.readout em{font-style:normal;font-size:.75rem;color:var(--green);margin-left:4px;visibility:hidden}
.readout .const em{visibility:visible}
.gtitle{margin:10px 0 0;font-size:1.05rem;font-weight:700}
#chart{display:block;width:100%;aspect-ratio:4/3.3}
.foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.foot .key{flex:1;min-width:0}
.foot .key i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 10px;vertical-align:1px}
.foot .key i:first-child{margin-left:0}
.btn{border:1px solid #bdbdbd;background:#fff;padding:5px 14px;font-size:.9rem;border-radius:3px}
.btn:hover{background:#fafafa;border-color:#999}
body{margin:0}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>기체 법칙 실험실</h1>
    <b class="law" id="lawEq">PV = 일정</b>
    <nav class="tabs" role="tablist" aria-label="실험 모드">
      <button role="tab" data-mode="boyle" aria-selected="true">보일 법칙</button>
      <button role="tab" data-mode="charles" aria-selected="false">샤를 법칙</button>
      <button role="tab" data-mode="gay" aria-selected="false">게이뤼삭 법칙</button>
      <button role="tab" data-mode="avog" aria-selected="false">아보가드로 법칙</button>
    </nav>
  </header>

  <main class="sim">
    <section class="left">
      <canvas id="stage" aria-label="수조에 담긴 실린더와 피스톤. 손바닥, 모닥불, 얼음, 펌프를 끌어서 조작합니다."></canvas>
      <div class="meters">
        <span class="pill ok" id="pill">평형</span>
        <div class="bar" id="mExt"><span>누르는 압력</span><div class="t"><i id="barExt"></i></div><output id="valExt">0</output></div>
        <div class="bar"><span>기체 압력</span><div class="t"><i id="barGas"></i></div><output id="valGas">0</output></div>
      </div>
    </section>

    <section class="right">
      <div class="readout">
        <div id="tP">P = <b id="rP">0</b> kPa<em>일정</em></div>
        <div id="tV">V = <b id="rV">0</b> L<em>일정</em></div>
        <div id="tT">T = <b id="rT">0</b> K<em>일정</em></div>
        <div id="tN">N = <b id="rN">0</b> 개<em>일정</em></div>
      </div>
      <h2 class="gtitle" id="gTitle">P–V 그래프</h2>
      <canvas id="chart" aria-label="측정 그래프"></canvas>
      <div class="foot">
        <button class="btn" id="viewBtn" hidden>0 K까지 보기</button>
        <button class="btn" id="clearBtn">점 지우기</button>
        <button class="btn" id="resetBtn">처음으로</button>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
const R = 8.314, PATM = 101.3, AREA = 0.01, G = 9.8, NM = 0.002, TROOM = 298.15;
const LW = 600, LH = 660;
const CL = 170, CR = 350, BOT = 530, HMAX = 420, PR = 4.5, S0 = 150;
const WATER_TOP = 200, BEAKER_BOT = 557;
const FMAX = 2000;           // 손바닥 최대 힘 (N)
const MAXN = 70, MINN = 5;   // 아보가드로 모드 분자 수 한계
const HEAT_RATE = 6;         // 모닥불/얼음이 바꾸는 물 온도 속도 (°C/s)
const HOLD = 0.5;            // 점을 찍기 위해 상태가 유지돼야 하는 시간(초)
const FIT_MIN = 3;           // 추세선을 그리기 위한 최소 점 개수
const VFIX = 0.8;            // 게이뤼삭 모드: 고정 핀으로 묶인 부피 (L)
const HOLE_TOP = 468;        // 실린더 오른쪽 아래 배출구 윗끝 (넓을수록 빨리 빠져나감)
const PUMP_TRAVEL = 120, PUMP_PER = 24;   // 펌프 손잡이 이동 거리, 분자 1개당 이동 거리

// 펌프 → 실린더 호스 경로, 배출 밸브 위치
const HOSE = [[495,530],[470,530],[470,150],[425,150],[425,515],[352,515]];
const VALVE = [447.5, 150], VALVE_D = 25 + 380 + 22.5;
const HOSE_SEG = []; let HOSE_LEN = 0;
for (let i = 1; i < HOSE.length; i++) {
  const [x0,y0] = HOSE[i-1], [x1,y1] = HOSE[i];
  const l = Math.hypot(x1-x0, y1-y0); HOSE_SEG.push({x0,y0,x1,y1,l,s:HOSE_LEN}); HOSE_LEN += l;
}
// 도구 상자 속 기본 위치
const HOME = { ice:[544, 548], fire:[544, 622] };
const SPOT_Y = { fire:622, ice:588 };   // 수조 바로 아래 한 자리 (모닥불·얼음 공용)

const MODES = {
  boyle:  { eq:'PV = 일정', text:'온도와 기체의 양이 일정할 때, 압력과 부피는 반비례해요.', Vmax:1.2, vTick:0.2, mass:0, N0:20,
            title:'P–V 그래프', guide:'추세선', span:0.3, spanTxt:'부피 차이 0.3 L', consts:['tT','tN'],
            hint:'<b>손바닥</b>을 잡고 아래로 끌면 더 세게, 위로 끌면 약하게 눌러요.' },
  charles:{ eq:'V / T = 일정', text:'압력과 기체의 양이 일정할 때, 부피는 절대 온도에 비례해요.', Vmax:1.2, vTick:0.2, mass:20, N0:20,
            title:'V–T 그래프', guide:'추세선', span:30, spanTxt:'온도 차이 30 K', consts:['tP','tN'],
            hint:'<b>모닥불</b>이나 <b>얼음</b>을 수조 바로 아래로 끌어다 놓으면 물 온도가 변해요. 원하는 온도에서 다시 빼내세요.' },
  gay:    { eq:'P / T = 일정', text:'부피와 분자 수가 일정할 때, 압력은 절대 온도에 비례해요.', Vmax:1.2, vTick:0.2, mass:0, N0:20,
            title:'P–T 그래프', guide:'추세선', span:30, spanTxt:'온도 차이 30 K', consts:['tV','tN'],
            hint:'<b>모닥불</b>이나 <b>얼음</b>을 수조 바로 아래로 끌어다 놓으면 물 온도가 변해요. 원하는 온도에서 다시 빼내세요.' },
  avog:   { eq:'V / N = 일정', text:'온도와 압력이 일정할 때, 부피는 분자 수(기체의 양)에 비례해요.', Vmax:3.2, vTick:0.5, mass:20, N0:10,
            title:'V–N 그래프', guide:'추세선', span:15, spanTxt:'분자 수 차이 15개', consts:['tP','tT'],
            hint:'<b>펌프 손잡이</b>를 아래로 끌어 기체를 넣어요. <b>배출 밸브</b>를 누르면 열려서 기체가 빠져나가요.' }
};

const S = {
  mode:'boyle', F:0, Tw:25, TwShown:25, Tg:TROOM, V:1, parts:[], transit:[], puffs:[],
  pumpOff:0, pumpAcc:0, valveOpen:false, fullAt:-10, closedAt:-10,
  items:{ ice:{x:HOME.ice[0],y:HOME.ice[1],tx:HOME.ice[0],ty:HOME.ice[1],placed:false},
          fire:{x:HOME.fire[0],y:HOME.fire[1],tx:HOME.fire[0],ty:HOME.fire[1],placed:false} },
  drag:null, ratio:1, Pmeas:PATM, flashes:[], vtFull:false,
  rec:{boyle:[],charles:[],gay:[],avog:[]}, trail:{boyle:[],charles:[],gay:[],avog:[]}, trailT:0, stable:0,
  skip:false, time:0, settled:true
};

/* ---------- physics ---------- */
const lerp = (a,b,t) => a+(b-a)*t;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const heatMode = () => S.mode === 'charles' || S.mode === 'gay';
const nMol = () => S.parts.length * NM;
const inbound = () => S.transit.reduce((a,t) => a + (t.dir > 0), 0);
// 화면 속 분자 속력 배율: 온도 차이가 눈에 잘 띄도록 T²에 비례하게 과장 (실제는 √T)
const vf = T => Math.pow(T / TROOM, 2);
const Pgas = () => nMol() * R * S.Tg / S.V;
const Pext = () => S.mode === 'gay' ? Pgas() : PATM + (MODES[S.mode].mass*G + (S.mode==='boyle' ? S.F : 0)) / AREA / 1000;
const Veq = () => S.mode === 'gay' ? VFIX : nMol() * R * S.Tg / Pext();
const pistonY = () => BOT - HMAX * S.V / MODES[S.mode].Vmax;
function rayleigh(){ const f = 0.798*Math.sqrt(-2*Math.log(1-Math.random())); return Math.min(2.4, Math.max(0.3, f)); }
function addParticle(x, y, angle){
  const s = S0 * rayleigh() * vf(S.Tg);
  const a = angle ?? Math.random()*Math.PI*2;
  S.parts.push({x, y, vx:s*Math.cos(a), vy:s*Math.sin(a)});
}
function sendHome(id){ const it = S.items[id]; it.placed = false; [it.tx, it.ty] = HOME[id]; }

function resetApparatus(){
  const m = MODES[S.mode];
  S.F = 0; S.Tw = 25; S.TwShown = 25; S.Tg = TROOM;
  S.parts = []; S.transit = []; S.puffs = []; S.pumpOff = 0; S.pumpAcc = 0; S.valveOpen = false;
  for (const id of ['ice','fire']) { sendHome(id); const it = S.items[id]; it.x = it.tx; it.y = it.ty; }
  S.drag = null;
  S.V = S.mode === 'gay' ? VFIX : m.N0 * NM * R * S.Tg / Pext();
  const py = pistonY();
  for (let i = 0; i < m.N0; i++) addParticle(CL+PR+Math.random()*(CR-CL-2*PR), py+PR+Math.random()*(BOT-py-2*PR));
  S.ratio = 1; S.flashes = []; S.skip = false; S.stable = 0;
}

function hosePoint(d){
  for (const g of HOSE_SEG) if (d <= g.s + g.l) { const k=(d-g.s)/g.l; return [g.x0+(g.x1-g.x0)*k, g.y0+(g.y1-g.y0)*k]; }
  const L = HOSE[HOSE.length-1]; return [L[0], L[1]];
}

function update(dt){
  S.time += dt;
  // 도구(모닥불·얼음) 위치 보간과 물 온도 변화
  for (const id of ['ice','fire']) {
    const it = S.items[id];
    if (!(S.drag && S.drag.id === id)) { const k = 1-Math.exp(-dt*12); it.x += (it.tx-it.x)*k; it.y += (it.ty-it.y)*k; }
  }
  if (heatMode()) {
    if (S.items.fire.placed) S.Tw += HEAT_RATE*dt;
    if (S.items.ice.placed) S.Tw -= HEAT_RATE*dt;
    S.Tw = clamp(S.Tw, 0, 100);
  }
  S.TwShown += (S.Tw - S.TwShown) * (1-Math.exp(-dt*8));
  const target = S.Tw + 273.15;
  if (Math.abs(S.Tg - target) > 1e-4) {
    const newT = S.Tg + (target - S.Tg) * (1-Math.exp(-dt*2.2));
    const k = vf(newT) / vf(S.Tg);
    for (const p of S.parts) { p.vx *= k; p.vy *= k; }
    S.Tg = newT;
  }
  // 펌프 손잡이: 놓으면 위로 되돌아감
  if (S.mode === 'avog') {
    if (!(S.drag && S.drag.id === 'pump')) { S.pumpOff = Math.max(0, S.pumpOff - 260*dt); if (S.pumpOff === 0) S.pumpAcc = 0; }
    for (let i = S.transit.length-1; i >= 0; i--) {
      const tr = S.transit[i]; tr.d += tr.dir * 820 * dt;
      if (tr.dir > 0 && tr.d >= HOSE_LEN) { S.transit.splice(i,1); addParticle(CR-PR-1, 515, Math.PI + (Math.random()-0.5)*1.9); }
      else if (tr.dir < 0 && tr.d <= VALVE_D) {
        S.transit.splice(i,1);
        S.puffs.push({x:VALVE[0], y:VALVE[1]-8, vx:(Math.random()-0.5)*60, vy:-70-Math.random()*50, life:1});
      }
    }
    for (let i = S.puffs.length-1; i >= 0; i--) {
      const f = S.puffs[i]; f.x += f.vx*dt; f.y += f.vy*dt; f.life -= dt*0.8;
      if (f.life <= 0) S.puffs.splice(i,1);
    }
  }
  // 피스톤
  const ve = Veq();
  S.V += (ve - S.V) * (1-Math.exp(-dt*2.6));
  const py = pistonY();
  // 분자 운동
  let imp = 0, escaped = false;
  const steps = Math.max(1, Math.ceil(dt*240)), h = dt/steps;
  for (let s = 0; s < steps; s++) {
    for (const p of S.parts) {
      if (p.dead) continue;
      p.x += p.vx*h; p.y += p.vy*h;
      if (p.x < CL+PR) { p.x = CL+PR; p.vx = Math.abs(p.vx); }
      else if (p.x > CR-PR) {
        // 배출 밸브가 열려 있으면 호스 입구로 들어간 분자는 빠져나감
        if (S.mode === 'avog' && S.valveOpen && p.y > HOLE_TOP && S.parts.length > MINN) {
          p.dead = true; escaped = true; S.transit.push({d:HOSE_LEN, dir:-1}); continue;
        }
        p.x = CR-PR; p.vx = -Math.abs(p.vx);
      }
      if (p.y > BOT-PR) { p.y = BOT-PR; p.vy = -Math.abs(p.vy); }
      if (p.y < py+PR) {
        p.y = py+PR;
        if (p.vy < 0) { imp += 2*Math.abs(p.vy); p.vy = -p.vy; if (S.flashes.length < 40) S.flashes.push({x:p.x, a:1}); }
      }
    }
    if (escaped) { S.parts = S.parts.filter(p => !p.dead); escaped = false; }
  }
  if (S.mode === 'avog' && S.valveOpen && S.parts.length <= MINN) { S.valveOpen = false; S.closedAt = S.time; }
  let sumS2 = 0; for (const p of S.parts) sumS2 += p.vx*p.vx + p.vy*p.vy;
  const expected = sumS2 / (2*Math.max(10, BOT - py - 2*PR));
  if (expected > 0) S.ratio += (imp/dt/expected - S.ratio) * (1-Math.exp(-dt/1.8));
  S.Pmeas = Pgas() * clamp(S.ratio, 0.92, 1.08);
  for (let i = S.flashes.length-1; i >= 0; i--) { S.flashes[i].a -= dt*6; if (S.flashes[i].a <= 0) S.flashes.splice(i,1); }

  // 평형 판정과 자동 기록
  S.settled = Math.abs(S.V - ve)/ve < 0.004 && Math.abs(S.Tg - target) < 0.5 && !S.transit.length && !S.valveOpen;
  S.stable = S.settled ? S.stable + dt : 0;
  if (S.stable >= HOLD && !S.skip) {
    const P = Pext(), n = nMol(), recs = S.rec[S.mode];
    const near = recs.some(r => S.mode === 'boyle' ? Math.abs(r.P-P) < 2 : heatMode() ? Math.abs(r.T-S.Tg) < 1.5 : Math.abs(r.n-n) < 1e-6);
    if (!near) recs.push({P, V:ve, T:S.Tg, n});
  }
  // 현재 상태의 궤적
  S.trailT += dt;
  if (S.trailT > 0.06) {
    S.trailT = 0;
    const tr = S.trail[S.mode], pt = dataXY(S.V, Pgas(), S.Tg, nMol()), lp = tr[tr.length-1];
    if (!lp || Math.abs(lp[0]-pt[0]) + Math.abs(lp[1]-pt[1]) > 1e-4) { tr.push(pt); if (tr.length > 4000) tr.shift(); }
  }
}
function fitReady(){
  const m = MODES[S.mode], recs = S.rec[S.mode];
  const xs = recs.map(r => dataXY(r.V, r.P, r.T, r.n)[0]);
  const span = xs.length ? Math.max(...xs) - Math.min(...xs) : 0;
  return { ok: recs.length >= FIT_MIN, count: recs.length, span };
}
function dataXY(V, P, T, n){
  if (S.mode === 'boyle') return [V, P];
  if (S.mode === 'charles') return [T, V];
  if (S.mode === 'gay') return [T, P];
  return [n/NM, V];
}

/* ---------- drawing helpers ---------- */
const stage = document.getElementById('stage'), sctx = stage.getContext('2d');
const chart = document.getElementById('chart');
let dpr = 1, stageScale = 1;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = stage.clientWidth || 600;
  stage.style.height = (w*LH/LW) + 'px';
  stage.width = Math.round(w*dpr); stage.height = Math.round(w*LH/LW*dpr);
  stageScale = w/LW*dpr;
  chart.width = Math.round(chart.clientWidth*dpr); chart.height = Math.round(chart.clientHeight*dpr);
}
new ResizeObserver(resize).observe(stage);
new ResizeObserver(resize).observe(chart);

const mix = (a,b,t) => `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
function waterRGB(t){
  const st = [[0,[176,218,244]],[25,[205,232,243]],[50,[247,221,198]],[100,[243,170,138]]];
  for (let i = 1; i < st.length; i++) if (t <= st[i][0]) return mix(st[i-1][1], st[i][1], (t-st[i-1][0])/(st[i][0]-st[i-1][0]));
  return mix(st[3][1], st[3][1], 0);
}

  else { ctx.moveTo(vx, vy-34); ctx.lineTo(vx, vy-10); }
  ctx.stroke();
  ctx.strokeStyle = open ? '#1d8656' : '#c8372d'; ctx.lineWidth = 3;
  if (open) { ctx.beginPath(); ctx.moveTo(vx, vy-15); ctx.lineTo(vx, vy-10); ctx.stroke(); }
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(vx, vy, 4, 0, Math.PI*2); ctx.fill();
  ctx.font = `500 13px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = '#555';
  ctx.fillText('밸브', vx+26, vy-22);
  // 빠져나간 분자
  ctx.fillStyle = gasColor();
  for (const f of S.puffs) { ctx.globalAlpha = Math.max(0, f.life); ctx.beginPath(); ctx.arc(f.x, f.y, PR, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha = 1;
  // 펌프 몸통
  ctx.fillStyle = '#f1f4f7'; ctx.strokeStyle = '#7d8996'; ctx.lineWidth = 2.5;
  rrect(ctx,495,360,52,186,6); ctx.fill(); ctx.stroke();
  const plY = 368 + off;
  ctx.fillStyle = 'rgba(42,99,212,0.08)'; ctx.fillRect(498, plY+10, 46, 546-plY-12);
  ctx.fillStyle = '#4a5562'; ctx.fillRect(498,plY,46,10);
  ctx.fillStyle = '#6b7784'; ctx.fillRect(516,330+off,10,plY-(330+off));
  const grab = S.drag && S.drag.id === 'pump';
  ctx.fillStyle = grab ? '#444' : '#2d3540'; rrect(ctx,478,320+off,86,14,7); ctx.fill();
  ctx.fillStyle = '#4a5562'; rrect(ctx,482,546,78,9,3); ctx.fill();
  ctx.fillStyle = '#555'; ctx.font = `500 13px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('펌프', 521, 574);
}

/* ---------- 직접 조작 (끌기) ---------- */
function toLogical(e){ const r = stage.getBoundingClientRect(); return [(e.clientX-r.left)*LW/r.width, (e.clientY-r.top)*LH/r.height]; }
function hitTest(x, y){
  const py = pistonY();
  if (S.mode === 'boyle') {
    const capTop = py - 58;
    if ((x > 170 && x < 345 && y > capTop-64 && y < capTop+10) || (x > 262 && x < 334 && y < capTop)) return 'hand';
  }
  if (heatMode()) {
    for (const id of ['ice','fire']) {
      const it = S.items[id], cy = id === 'fire' ? it.y - 10 : it.y - 6;
      if (Math.abs(x-it.x) < 36 && Math.abs(y-cy) < 34) return id;
    }
  }
  if (S.mode === 'avog') {
    if (Math.hypot(x-VALVE[0], y-VALVE[1]+12) < 26) return 'valve';
    const hy = 320 + S.pumpOff;
    if (x > 470 && x < 572 && y > hy-16 && y < hy+30) return 'pump';
  }
  return null;
}
stage.addEventListener('pointerdown', e => {
  const [x, y] = toLogical(e), id = hitTest(x, y);
  if (!id) return;
  e.preventDefault();
  S.skip = false;
  if (id === 'valve') { S.valveOpen = !S.valveOpen; if (S.valveOpen && S.parts.length <= MINN) { S.valveOpen = false; S.closedAt = S.time; } return; }
  try { stage.setPointerCapture(e.pointerId); } catch(_) {}
  S.drag = { id, x0:x, y0:y, F0:S.F, off0:S.pumpOff };
  if (id === 'ice' || id === 'fire') { const it = S.items[id]; it.placed = false; S.drag.dx = it.x - x; S.drag.dy = it.y - y; }
  stage.style.cursor = 'grabbing';
});
stage.addEventListener('pointermove', e => {
  const [x, y] = toLogical(e);
  if (!S.drag) {
    const id = hitTest(x, y);
    stage.style.cursor = id === 'valve' ? 'pointer' : id ? 'grab' : 'default';
    return;
  }
  const d = S.drag;
  if (d.id === 'hand') S.F = clamp(d.F0 + (y - d.y0) * 8, 0, FMAX);
  else if (d.id === 'pump') {
    const nOff = clamp(d.off0 + (y - d.y0), 0, PUMP_TRAVEL), delta = nOff - S.pumpOff;
    if (delta > 0) {
      S.pumpAcc += delta;
      while (S.pumpAcc >= PUMP_PER) {
        S.pumpAcc -= PUMP_PER;
        if (S.parts.length + inbound() < MAXN) S.transit.push({d:0, dir:1});
        else S.fullAt = S.time;
      }
    }
    S.pumpOff = nOff;
  } else {
    const it = S.items[d.id];
    it.x = clamp(x + d.dx, 20, LW-20); it.y = clamp(y + d.dy, 20, LH-14); it.tx = it.x; it.ty = it.y;
  }
});
function endDrag(){
  const d = S.drag; if (!d) return;
  if (d.id === 'fire' || d.id === 'ice') {
    const it = S.items[d.id], other = d.id === 'fire' ? 'ice' : 'fire';
    // 수조 바로 아래(또는 수조 위)에 놓으면 그 자리에 고정. 자리는 하나라 다른 도구는 상자로 돌아감
    if (it.x > 50 && it.x < 470 && it.y > 140) {
      it.placed = true; it.tx = clamp(it.x, 120, 400); it.ty = SPOT_Y[d.id];
      if (S.items[other].placed) sendHome(other);
    } else sendHome(d.id);
  }
  S.drag = null; stage.style.cursor = 'default';
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('lostpointercapture', endDrag);

/* ---------- 그래프 ---------- */
function drawChart(){
  const ctx = chart.getContext('2d'), w = chart.width/dpr, h = chart.height/dpr;
  if (!w || !h) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#f2f2f2'; ctx.fillRect(0,0,w,h);
  const md = S.mode;
  const ax = md === 'boyle'   ? {x:[0,1.2,0.2,1], y:[0,350,50,0], xl:'부피 V (L)', yl:'압력 P (kPa)'}
           : md === 'charles' ? (S.vtFull ? {x:[0,400,50,0], y:[0,1.2,0.2,1], xl:'절대 온도 T (K)', yl:'부피 V (L)'}
                                          : {x:[260,380,10,0], y:[0.7,1.06,0.04,2], xl:'절대 온도 T (K)', yl:'부피 V (L)'})
           : md === 'gay'     ? (S.vtFull ? {x:[0,400,50,0], y:[0,200,25,0], xl:'절대 온도 T (K)', yl:'압력 P (kPa)'}
                                          : {x:[260,380,10,0], y:[105,165,5,0], xl:'절대 온도 T (K)', yl:'압력 P (kPa)'})
           :                    {x:[0,80,10,0],  y:[0,3.5,0.5,1], xl:'분자 수 N (개)', yl:'부피 V (L)'};
  const [x0,x1,xs,xd] = ax.x, [y0,y1,ys,yd] = ax.y;
  const L = 58, Rr = 18, T = 30, B = 46, pw = w-L-Rr, ph = h-T-B;
  const X = v => L + (v-x0)/(x1-x0)*pw, Y = v => T + ph - (v-y0)/(y1-y0)*ph;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(L, T, pw, ph);
  ctx.font = `400 13px ${FONT}`; ctx.lineWidth = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let i = 0; i <= Math.round((x1-x0)/xs); i++) {
    const v = x0+i*xs, x = X(v);
    ctx.strokeStyle = '#cfcfcf'; ctx.beginPath(); ctx.moveTo(x,T); ctx.lineTo(x,T+ph); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.fillText(v.toFixed(xd), x, T+ph+5);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i = 0; i <= Math.round((y1-y0)/ys); i++) {
    const v = y0+i*ys, y = Y(v);
    ctx.strokeStyle = '#cfcfcf'; ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(L+pw,y); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.fillText(v.toFixed(yd), L-8, y);
  }
  if (md === 'charles' || md === 'gay') {
    ctx.strokeStyle = '#e2b48c'; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(X(273.15),T); ctx.lineTo(X(273.15),T+ph); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#b5651d'; ctx.font = `400 11px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('0 °C', X(273.15), T+2);
  }
  ctx.strokeStyle = '#bdbdbd'; ctx.lineWidth = 1;
  ctx.strokeRect(L+0.5, T+0.5, pw-1, ph-1);
  ctx.fillStyle = '#222'; ctx.font = `500 14px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(ax.xl, L+pw/2, h-4);
  ctx.textAlign = 'left'; ctx.fillText(ax.yl, 6, 15);

  ctx.save(); ctx.beginPath(); ctx.rect(L-2,T-2,pw+4,ph+4); ctx.clip();
  const trail = S.trail[md];
  if (trail.length > 1) {
    ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); trail.forEach(([a,b],i) => i ? ctx.lineTo(X(a),Y(b)) : ctx.moveTo(X(a),Y(b))); ctx.stroke();
  }
  const recs = S.rec[md], pts = recs.map(r => dataXY(r.V, r.P, r.T, r.n));
  if (fitReady().ok) {
    ctx.strokeStyle = '#666'; ctx.lineWidth = 1.5; ctx.setLineDash([7,5]); ctx.beginPath();
    if (md === 'boyle') {
      const c = pts.reduce((a,[v,p]) => a + v*p, 0) / pts.length;
      for (let i = 0; i <= 160; i++) { const v = 0.15 + (x1-0.15)*i/160; i ? ctx.lineTo(X(v),Y(c/v)) : ctx.moveTo(X(v),Y(c/v)); }
    } else {
      const k = pts.reduce((a,[x,y]) => a + x*y, 0) / pts.reduce((a,[x]) => a + x*x, 0);
      ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(x1), Y(k*x1));
    }
    ctx.stroke(); ctx.setLineDash([]);

  }
  pts.forEach(([a,b], i) => {
    const last = i === pts.length-1;
    ctx.fillStyle = '#222'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(X(a), Y(b), 5.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  });
  const [cx, cy] = dataXY(S.V, Pgas(), S.Tg, nMol());
  const lx = X(cx), ly = Y(cy);
  ctx.fillStyle = '#e8261b'; ctx.beginPath(); ctx.arc(lx, ly, 7, 0, Math.PI*2); ctx.fill();
  if (S.settled && S.stable < HOLD && !S.skip) {
    ctx.strokeStyle = '#e8261b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(lx, ly, 11, -Math.PI/2, -Math.PI/2 + Math.PI*2*S.stable/HOLD); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);

function setMode(mode){
  S.mode = mode;
  const m = MODES[mode];
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === mode)));
  $('lawEq').textContent = m.eq;
  $('gTitle').textContent = m.title;
  $('viewBtn').hidden = !heatMode();
  $('mExt').hidden = mode === 'gay';
  ['tP','tV','tT','tN'].forEach(id => $(id).classList.toggle('const', m.consts.includes(id)));
  resetApparatus();
}

function statusText(){
  const target = S.Tw + 273.15, it = S.items;
  if (S.mode === 'avog') {
    if (S.time - S.fullAt < 2) return `실린더가 가득 찼어요. 분자는 최대 ${MAXN}개까지 넣을 수 있어요.`;
    if (S.time - S.closedAt < 2.5) return `분자가 ${MINN}개만 남아 배출 밸브가 저절로 닫혔어요.`;
    if (S.valveOpen) return '배출 밸브가 열려 있어요. 호스 입구로 들어간 분자가 빠져나가요. 다시 눌러 닫으세요.';
    if (S.transit.some(t => t.dir > 0)) return '펌프로 밀어 넣은 기체 분자가 호스를 따라 실린더로 들어가요.';
    if (S.transit.length) return '밸브를 닫았어요. 호스에 남은 분자가 빠져나가는 중이에요.';
  }
  if (heatMode()) {
    const heating = it.fire.placed && !it.ice.placed, cooling = it.ice.placed && !it.fire.placed;
    if (heating && S.Tw >= 100) return '물이 끓고 있어요. 물은 100 °C보다 뜨거워지지 않아요. 모닥불을 빼면 점이 찍혀요.';
    if (cooling && S.Tw <= 0) return '물이 0 °C까지 식었어요. 얼음을 빼면 점이 찍혀요.';
    const g = S.mode === 'gay' ? ' 피스톤에 더 자주, 더 세게 부딪혀 압력이 올라가요.' : ' 기체가 팽창해 피스톤이 올라가요.';
    const c = S.mode === 'gay' ? ' 피스톤에 덜 부딪혀 압력이 내려가요.' : ' 기체가 수축해 피스톤이 내려가요.';
    if (heating) return '모닥불이 물을 데우고 있어요. 분자가 빨라지면서' + g;
    if (cooling) return '얼음이 물을 식히고 있어요. 분자가 느려지면서' + c;
    if (Math.abs(S.Tg - target) > 0.5)
      return S.Tg < target ? '물의 열이 기체로 전달돼 분자가 빨라지고 있어요.' : '기체의 열이 물로 빠져나가 분자가 느려지고 있어요.';
    if (S.mode === 'gay') return '열평형 상태예요. 피스톤이 핀에 고정돼 부피는 변하지 않아요.';
  }
  if (!S.settled) return S.V > Veq() ? '누르는 압력이 더 커서 피스톤이 내려가요.' : '기체 압력이 더 커서 피스톤이 올라가요.';
  return '두 압력이 같아져 피스톤이 멈췄어요.';
}

function updateUI(){
  const pe = Pext(), pm = S.Pmeas;
  $('barExt').style.width = clamp(pe/350*100,0,100) + '%';
  $('barGas').style.width = clamp(pm/350*100,0,100) + '%';
  $('valExt').textContent = pe.toFixed(1) + ' kPa';
  $('valGas').textContent = pm.toFixed(1) + ' kPa';
  const pill = $('pill'); pill.textContent = S.settled ? '평형' : '변화 중'; pill.className = 'pill ' + (S.settled ? 'ok' : 'moving');
  $('rP').textContent = Pgas().toFixed(1);
  $('rV').textContent = S.V.toFixed(3);
  $('rT').textContent = S.Tg.toFixed(1);
  $('rN').textContent = String(S.parts.length);
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { if (b.dataset.mode !== S.mode) setMode(b.dataset.mode); }));
$('resetBtn').addEventListener('click', resetApparatus);
$('viewBtn').addEventListener('click', () => {
  S.vtFull = !S.vtFull;
  $('viewBtn').textContent = S.vtFull ? '확대해서 보기' : '0 K까지 보기';
});
$('clearBtn').addEventListener('click', () => { S.rec[S.mode] = []; S.trail[S.mode] = []; S.skip = true; });

let last = performance.now(), uiT = 0;
function frame(now){
  const dt = Math.min(0.033, Math.max(0.001, (now-last)/1000)); last = now;
  update(dt); drawStage(); drawChart();
  uiT += dt; if (uiT > 0.1) { uiT = 0; updateUI(); }
  requestAnimationFrame(frame);
}
setMode('boyle'); resize(); updateUI();
requestAnimationFrame(frame);
})();
</script>
</body>

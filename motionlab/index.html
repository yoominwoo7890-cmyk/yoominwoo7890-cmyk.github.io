<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동과 벡터 실험실 — 속도변화 벡터 시각화</title>
<style>
  :root{
    --bg:#E9E8E2;
    --panel:#F7F6F1;
    --panel-line:#D8D6CC;
    --ink:#22303C;
    --ink-soft:#5B6B7A;
    --canvas-bg:#FFFFFF;
    --dot:#1B1B1B;
    --object:#FFB020;
    --green:#189E4A;
    --blue:#2E6FE8;
    --red:#E4453A;
    --purple:#9333EA;
    --teal:#0D9488;
    --pink:#DB2777;
    --ke:#F97316;
    --pe:#0EA5E9;
    --accent:#22303C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  button, input, label{touch-action:manipulation;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden;
    font-size:21px;
    -webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:ui-monospace,'SF Mono','Cascadia Code','Consolas',monospace;}

  header{
    display:flex; align-items:center; gap:14px;
    padding:10px 16px; background:var(--panel);
    border-bottom:1px solid var(--panel-line);
    flex-shrink:0;
  }
  header h1{font-size:22.5px; font-weight:700; letter-spacing:-0.3px; white-space:nowrap;}
  header h1 small{display:block; font-size:15px; font-weight:500; color:var(--ink-soft); letter-spacing:0.5px;}
  .mode-btns{display:flex; gap:6px; flex-wrap:wrap;}
  .mode-btn{
    padding:7px 12px; border:1px solid var(--panel-line); background:#fff;
    border-radius:999px; cursor:pointer; font-size:19.5px; color:var(--ink);
    transition:background .12s, color .12s, border-color .12s;
  }
  .mode-btn:hover{border-color:var(--ink-soft);}
  .mode-btn.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}
  .mode-btn:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  main{flex:1; display:flex; min-height:0;}
  aside{
    width:380px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--panel-line);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .section{padding:12px 16px; border-bottom:1px solid var(--panel-line);}
  .section h2{
    font-size:16.5px; font-weight:700; color:var(--ink-soft);
    letter-spacing:1px; margin-bottom:9px;
  }

  .transport{display:flex; gap:8px;}
  .transport button{
    flex:1; padding:9px 0; border-radius:8px; border:1px solid var(--panel-line);
    background:#fff; cursor:pointer; font-size:19.5px; font-weight:600; color:var(--ink);
  }
  .transport button:hover{border-color:var(--ink-soft);}
  #playBtn.playing{background:var(--accent); color:#fff; border-color:var(--accent);}
  .transport button:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  .slider-row{margin-bottom:12px;}
  .slider-row:last-child{margin-bottom:0;}
  .slider-row label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:19.5px; margin-bottom:5px;
  }
  .slider-row label .val{font-size:18px; color:var(--ink-soft);}
  input[type=range]{
    width:100%; -webkit-appearance:none; appearance:none; height:6px;
    background:var(--panel-line); border-radius:3px; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:24px; height:24px; border-radius:50%;
    background:var(--accent); border:3px solid var(--panel);
    box-shadow:0 0 0 1px var(--panel-line);
  }
  input[type=range]::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%;
    background:var(--accent); border:3px solid var(--panel);
    box-shadow:0 0 0 1px var(--panel-line);
  }
  input[type=range]:focus-visible{outline:2px solid var(--blue); outline-offset:4px;}

  .arrow-toggle{
    display:flex; align-items:center; gap:9px; padding:6px 8px;
    border-radius:8px; cursor:pointer; user-select:none;
  }
  .arrow-toggle:hover{background:rgba(0,0,0,0.04);}
  .arrow-toggle input{accent-color:var(--accent); width:18px; height:18px; cursor:pointer;}
  .chip{width:26px; height:0; border-top-width:3px; border-top-style:solid; position:relative; flex-shrink:0;}
  .chip::after{
    content:''; position:absolute; right:-2px; top:-5px;
    border-left:7px solid; border-left-color:inherit;
    border-top:4px solid transparent; border-bottom:4px solid transparent;
  }
  .chip.green{border-top-color:var(--green); color:var(--green);}
  .chip.blue{border-top-color:var(--blue); color:var(--blue);}
  .chip.red{border-top-color:var(--red); color:var(--red);}
  .chip.purple{border-top-color:var(--purple); color:var(--purple);}
  .chip.teal{border-top-color:var(--teal); color:var(--teal);}
  .chip.pink{border-top-color:var(--pink); color:var(--pink);}
  .chip.comp{border-top-color:#7FA6EF; border-top-style:dashed; color:#7FA6EF;}
  .chip-bar{width:26px; height:12px; flex-shrink:0; border-radius:2px;
    background:linear-gradient(90deg, var(--ke) 50%, var(--pe) 50%);}
  .chip-t{width:26px; flex-shrink:0; text-align:center; border-radius:4px;
    font-family:ui-monospace,monospace; font-size:15px; font-weight:700;
    color:var(--ink-soft); background:#fff; border:1px solid var(--panel-line);}
  .arrow-toggle .desc{font-size:16.5px; color:var(--ink-soft); display:block;}

  #dvBtn, #dpBtn{
    width:100%; padding:10px 0; border-radius:8px; font-size:19.5px; font-weight:700;
    border:1.5px dashed var(--ink-soft); background:transparent; color:var(--ink); cursor:pointer;
  }
  #dpBtn{margin-top:8px;}
  #dvBtn.active{background:var(--purple); border:1.5px solid var(--purple); color:#fff;}
  #dpBtn.active{background:var(--pink); border:1.5px solid var(--pink); color:#fff;}
  #dvBtn:focus-visible, #dpBtn:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  #clearSelBtn{
    width:100%; margin-top:8px; padding:7px 0; border-radius:8px; font-size:18.75px;
    border:1px solid var(--panel-line); background:#fff; color:var(--ink); cursor:pointer;
  }
  #clearSelBtn:hover{border-color:var(--ink-soft);}
  .tbl-btns{display:flex; gap:6px; flex-wrap:wrap;}
  .tbl-btn{
    flex:1 1 calc(50% - 3px); padding:9px 0; border-radius:8px;
    font-size:19.5px; font-weight:600;
    border:1px solid var(--panel-line); background:#fff; color:var(--ink); cursor:pointer;
  }
  .tbl-btn:hover{border-color:var(--ink-soft);}
  .tbl-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .tbl-btn.wide{flex:1 1 100%; margin-top:2px; font-weight:700;}
  .tbl-btn:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  #tblHint{font-size:17.25px; color:var(--ink-soft); margin-top:9px; line-height:1.55;}
  #dvHint{font-size:17.25px; color:var(--ink-soft); margin-top:9px; line-height:1.55;}
  .legend-dv{display:flex; align-items:center; gap:9px; margin-top:10px; font-size:18px;}

  /* 벡터 다이어그램 (합성) */
  #diagram{
    width:100%; height:260px; display:block;
    background:#fff; border:1px solid var(--panel-line); border-radius:10px;
  }
  #diagramInfo{font-size:17.25px; color:var(--ink-soft); margin-top:7px; line-height:1.5; min-height:17px;}

  /* 메인 캔버스 — 800×600 고정 */
  .stage{
    flex:1; min-width:0; overflow:auto;
    display:flex; align-items:center; justify-content:center; padding:14px;
  }
  .canvas-box{position:relative; width:800px; height:600px; flex-shrink:0;}
  #canvas{
    width:800px; height:600px; display:block;
    background:var(--canvas-bg); border-radius:12px;
    border:1px solid var(--panel-line);
    touch-action:none;
  }
  #canvas.dv-mode{cursor:crosshair;}

  /* ── 인쇄 전용 ──────────────────────────────────
     용지를 캔버스와 같은 비율(720×540pt = 254×190.5mm)로 잡고 여백을 0으로 둔다.
     · 여백 0 이면 Chrome 계열은 머리말·꼬리말(URL·날짜·쪽번호)을 자동으로 숨긴다
     · 용지 비율이 캔버스와 같으므로 위아래 흰 띠가 생기지 않는다
     결과적으로 종이에는 캔버스 그림만 남는다. */
  #printArea{display:none;}
  @media print{
    /* 용지 크기와 이미지 치수는 applyPrintSize() 가 캔버스 높이에 맞춰 주입한다 */
    @page{ margin:0; }
    /* height:100% 를 주면 자식의 위쪽 여백이 부모 밖으로 빠져나가(마진 병합)
       내용 높이가 한 쪽을 넘겨 빈 2쪽이 생긴다. 높이를 auto 로 두고
       위쪽 간격도 margin 이 아니라 padding 으로 준다. */
    html, body{
      width:auto; height:auto; margin:0; padding:0;
      background:#fff; overflow:visible; display:block;
    }
    body > *{ display:none !important; }
    #printArea{ display:block !important; break-inside:avoid; page-break-inside:avoid; }
    #printImg{ display:block; margin:0 auto; break-after:avoid; page-break-after:avoid; }
  }

  /* ── 화면 폭에 따른 대응 ─────────────────────────
     좌우 배치(캔버스 + 사이드바)를 최대한 오래 지킨다.
     캔버스는 fitLayout 이 알아서 줄이므로 폭이 좁아도 좌우 배치가 가능하고,
     세로로 쌓는 것은 정말 좁을 때(휴대폰)만 한다. */

  /* 캔버스를 키우기 위해 머리말과 사이드바를 최대한 조인다 */
  header{gap:10px; padding:6px 10px;}
  header h1{font-size:12.5px; line-height:1.15;}
  header h1 small{font-size:8.5px; letter-spacing:0.3px;}
  .mode-btns{gap:4px;}
  .mode-btn{font-size:13px; padding:4px 9px;}
  .stage{padding:8px;}
  aside{width:296px;}
  .section{padding:9px 12px 11px;}

  @media (max-width: 1180px){
    aside{width:274px;}
    .mode-btn{font-size:12px; padding:4px 8px;}
  }
  @media (max-width: 980px){
    aside{width:254px;}
    .section{padding:8px 10px 10px;}
    .tgl{font-size:10.5px; padding:6px 2px 5px;}
    .tgl .chip, .tgl .chip-bar, .tgl .chip-t{width:26px;}
    .slider-row label{font-size:13px;}
  }
  @media (max-width: 820px){
    aside{width:232px;}
    .tgl-grid{grid-template-columns:repeat(2,1fr);}
    header h1{display:none;}
  }

  /* 휴대폰 등 아주 좁은 화면에서만 세로로 쌓는다 */
  @media (max-width: 640px){
    body{overflow:auto;}
    main{flex-direction:column;}
    .stage{order:0; padding:10px; overflow:visible; flex:none;}
    aside{
      order:1; width:100%; border-right:none;
      border-top:1px solid var(--panel-line);
      flex-direction:row; flex-wrap:wrap; align-items:flex-start;
      overflow:visible;
    }
    .section{flex:1 1 260px; border-right:1px solid var(--panel-line);}
    .tgl-grid{grid-template-columns:repeat(3,1fr);}
  }

  /* ══ 컴팩트 사이드바 ═══════════════════════════════
     접지 않고 전부 펼쳐 두되, 세로 길이를 줄인다.
       · 토글 7행(≈370px) → 3열 아이콘 격자 2행(≈100px)
       · 슬라이더 행 높이 62 → 42px
       · 다이어그램은 Δv·Δp 모드일 때만 자리를 차지 */

  aside{width:344px;}
  .section{padding:11px 14px 13px;}
  .section + .section{border-top:none;}

  /* 묶음 제목 : 얇은 띠 */
  .section h2{
    font-size:12.5px; font-weight:800; letter-spacing:1.5px;
    margin-bottom:9px; display:flex; align-items:center; gap:8px;
  }
  .section h2::before{
    content:''; width:3px; height:13px; border-radius:2px; background:var(--accent);
  }

  /* 슬라이더 : 한 줄 라벨 + 얇은 트랙 */
  .slider-row{margin-bottom:10px;}
  .slider-row:last-child{margin-bottom:0;}
  .slider-row label{font-size:14px; font-weight:600; color:var(--ink); margin-bottom:4px;}
  .slider-row label .val{
    font-size:13px; font-weight:700; color:var(--ink);
    background:#fff; border:1px solid var(--panel-line);
    border-radius:20px; padding:1px 9px;
  }
  input[type=range]{height:5px;}
  input[type=range]::-webkit-slider-thumb{width:19px; height:19px; border-width:3px;}
  input[type=range]::-moz-range-thumb{width:17px; height:17px; border-width:3px;}

  /* 벡터 토글 : 3열 아이콘 격자 — 꺼진 것은 흐리게 */
  .tgl-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:2px 0 11px;}
  .tgl{
    position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px;
    padding:9px 3px 8px; border-radius:9px; cursor:pointer;
    border:1px solid transparent; background:transparent;
    font-size:12px; font-weight:700; line-height:1.15; text-align:center;
    color:var(--ink); opacity:0.4; transition:opacity .12s;
  }
  .tgl input{position:absolute; opacity:0; width:0; height:0;}
  .tgl:has(input:checked){opacity:1; background:#fff; border-color:var(--panel-line);}
  .tgl:hover{opacity:0.85;}
  .tgl:has(input:checked):hover{opacity:1; border-color:var(--ink-soft);}
  .tgl:has(input:focus-visible){outline:2px solid var(--blue); outline-offset:1px;}
  .tgl .chip{width:34px;}
  .tgl .chip-bar{width:34px; height:13px; border-radius:3px;}
  .tgl .chip-t{width:34px; font-size:12px; padding:1px 0; border-radius:5px;}

  /* 색 견본 공통 */
  .chip{border-top-width:4px;}
  .chip::after{right:-3px; top:-7px;
    border-left-width:11px; border-top-width:6px; border-bottom-width:6px;}

  /* 버튼 */
  .transport{gap:6px;}
  .transport button{font-size:14px; font-weight:700; padding:9px 0; border-radius:7px;}
  .btn-row{display:flex; gap:6px; margin-bottom:6px;}
  .btn-row > button{flex:1;}
  #dvBtn, #dpBtn{width:auto; margin:0; font-size:13.5px; padding:9px 0; border-radius:7px;}
  #clearSelBtn{margin-top:0; font-size:13px; padding:7px 0;}
  .tbl-btns{gap:5px;}
  .tbl-btn{flex:1 1 0; font-size:13px; padding:8px 0; border-radius:7px;}
  .tbl-btn.wide{flex:1 1 calc(50% - 3px); font-size:13px; margin-top:0;}
  .tbl-btn.full{flex:1 1 100%;}

  /* 보조 설명 */
  #dvHint, #tblHint, #diagramInfo{font-size:12px; line-height:1.55; color:var(--ink-soft);}
  #dvHint{margin-top:7px;}
  #tblHint{margin-top:8px;}
  .legend-dv{font-size:12.5px; gap:9px; margin-top:7px;}
  .legend-dv .chip{width:30px;}

  /* 다이어그램 : Δv·Δp 모드일 때만 자리를 차지 */
  #deltaView{display:none; margin-top:10px;}
  #diagram{height:150px;}
</style>
</head>
<body>

<header>
  <h1>운동과 벡터 실험실<small>MOTION &amp; VECTOR LAB</small></h1>
  <div class="mode-btns" id="modeBtns"></div>
</header>

<main>
  <aside>
    <div class="section">
      <h2>재생</h2>
      <div class="transport">
        <button id="playBtn">▶ 재생</button>
        <button id="resetBtn">↺ 초기화</button>
      </div>
      <div class="transport" style="margin-top:6px;">
        <button id="stepBackBtn">⏴ −Δt</button>
        <button id="stepFwdBtn">+Δt ⏵</button>
      </div>
      <div class="slider-row" style="margin-top:11px;">
        <label>재생 속도 <span class="val mono" id="speedVal">1.00×</span></label>
        <input type="range" id="speedSlider" min="0.25" max="2" step="0.25" value="1">
      </div>
    </div>

    <div class="section">
      <h2>운동 설정</h2>
      <div id="modeParams"></div>
      <div class="slider-row">
        <label>중력가속도 g <span class="val mono" id="gVal">10.0 m/s²</span></label>
        <input type="range" id="gSlider" min="1" max="20" step="0.1" value="10">
      </div>
      <div class="slider-row">
        <label>질량 m <span class="val mono" id="massVal">0.5 kg</span></label>
        <input type="range" id="massSlider" min="0.1" max="2.0" step="0.1" value="0.5">
      </div>
      <div class="slider-row">
        <label>섬광 간격 Δt <span class="val mono" id="dtVal">1.00 s</span></label>
        <input type="range" id="dtSlider" min="0.25" max="3.0" step="0.25" value="1.0">
      </div>
    </div>

    <div class="section">
      <h2>화면 표시</h2>
      <div class="tgl-grid">
        <label class="tgl" title="속도 벡터 — 물체 위쪽, 1 cm = 10 m/s">
          <input type="checkbox" id="tglVel" checked>
          <span class="chip blue"></span><span>속도 v</span>
        </label>
        <label class="tgl" title="운동량 벡터 — 물체 아래쪽, p = m × v">
          <input type="checkbox" id="tglMom">
          <span class="chip teal"></span><span>운동량 p</span>
        </label>
        <label class="tgl" title="알짜힘 벡터 — 물체 중심, 1 cm = 10 N">
          <input type="checkbox" id="tglForce">
          <span class="chip red"></span><span>알짜힘 F</span>
        </label>
        <label class="tgl" title="속도를 가로·세로 성분으로 분해">
          <input type="checkbox" id="tglComp">
          <span class="chip comp"></span><span>성분 분해</span>
        </label>
        <label class="tgl" title="각 섬광점의 시각 표시">
          <input type="checkbox" id="tglTime" checked>
          <span class="chip-t">t</span><span>섬광 시각</span>
        </label>
        <label class="tgl" title="운동 에너지 K 와 퍼텐셜 에너지 P 막대">
          <input type="checkbox" id="tglEnergy">
          <span class="chip-bar"></span><span>에너지</span>
        </label>
      </div>
      <div class="slider-row">
        <label>벡터 표시 개수 <span class="val mono" id="vecVal">전체</span></label>
        <input type="range" id="vecSlider" min="0" max="20" step="1" value="20">
      </div>
      <div class="slider-row">
        <label>물체 크기 <span class="val mono" id="sizeVal">3 m</span></label>
        <input type="range" id="sizeSlider" min="1" max="10" step="1" value="3">
      </div>
    </div>

    <div class="section">
      <h2>변화량 분석</h2>
      <div class="btn-row">
        <button id="dvBtn">Δv 속도변화</button>
        <button id="dpBtn">Δp 운동량변화</button>
      </div>
      <button id="clearSelBtn">선택 지우기</button>
      <div id="deltaView">
        <canvas id="diagram"></canvas>
        <div id="diagramInfo" class="mono"></div>
        <div class="legend-dv"><span class="chip purple"></span><span>Δv = v₂ − v₁</span></div>
        <div class="legend-dv"><span class="chip pink"></span><span>Δp = p₂ − p₁</span></div>
      </div>
      <div id="dvHint">모드를 켜고 궤적 점들을 클릭하세요.</div>
    </div>

    <div class="section">
      <h2>학습지 만들기</h2>
      <div class="tbl-btns">
        <button class="tbl-btn" id="tblV">v</button>
        <button class="tbl-btn" id="tblP">p</button>
        <button class="tbl-btn" id="tblVx">vₓ</button>
        <button class="tbl-btn" id="tblVy">v_y</button>
        <button class="tbl-btn wide active" id="tblFill">값 채움</button>
        <button class="tbl-btn wide active" id="tblCond">조건 표시 — 켜짐</button>
        <button class="tbl-btn full" id="printBtn">🖨 인쇄 · PDF 저장</button>
      </div>
      <div id="tblHint">위 네 개는 캔버스 오른쪽 표에 넣을 항목입니다. <b>빈 표</b> + <b>조건 숨김</b> + <b>벡터 개수 ↓</b> → 문제지, 모두 켜기 → 정답지</div>

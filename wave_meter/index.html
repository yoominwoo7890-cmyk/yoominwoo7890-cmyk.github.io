<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음파 기록계</title>
<style>
:root{
  --paper:#E9EBE5; --panel:#F5F6F2; --line:#CFD5CD;
  --ink:#1E2320; --ink-2:#6A726B; --pen:#B23A2E; --warn:#8A5A00;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  padding:14px 14px calc(28px + env(safe-area-inset-bottom));
  max-width:620px;margin-inline:auto}
h1{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:10px}
.pad{padding:12px}

.read{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}
.read .k{font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
.read .v{font-family:var(--mono);font-size:clamp(28px,8.5vw,40px);font-weight:500;
  line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.read .v.dim{color:var(--ink-2);opacity:.45}
.sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  padding:0 14px 13px;margin:0}

.chan{padding:11px 14px 12px}
.lab{display:flex;justify-content:space-between;align-items:baseline;
  font-size:11.5px;color:var(--ink-2);margin-bottom:5px}
canvas{display:block;background:#FCFDFB;border:1px solid var(--line);width:100%}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:11px;color:var(--ink-2);margin-top:5px}

button{width:100%;font-family:var(--sans);font-size:16px;font-weight:500;padding:16px 8px;
  border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button.rec{background:var(--pen);border-color:var(--pen)}
button:disabled{opacity:.3;cursor:default}
button b{font-weight:500}
button + button{margin-top:8px}

.note{font-size:12px;color:var(--ink-2);line-height:1.65;margin:14px 2px 0}
.banner{background:var(--warn);color:#fff;padding:11px 13px;border-radius:4px;
  font-size:13.5px;margin-bottom:10px}
</style>
</head>
<body>

<h1>음파 기록계</h1>
<div id="banner"></div>

<div class="card">
  <div class="read">
    <div>
      <div class="k">지금 진폭</div>
      <div class="v dim" id="vNow">—</div>
    </div>
    <div>
      <div class="k">최대 진폭</div>
      <div class="v dim" id="vMax">—</div>
    </div>
  </div>
  <p class="sub" id="sub">대기 중</p>
</div>

<div class="card">
  <div class="chan">
    <div class="lab"><b style="color:var(--pen);font-weight:500">진폭 vs 시간</b><span id="tag">—</span></div>
    <canvas id="scope"></canvas>
    <div class="axis"><span>0 s</span><span id="tEnd">—</span></div>
  </div>
</div>

<div class="card">
  <div class="pad">
    <button id="bRun">녹음 시작</button>
    <button class="ghost" id="bCsv" disabled>CSV 내보내기</button>
  </div>
</div>

<p class="note">
표본율만큼 촘촘하게, 마이크가 준 값을 그대로 기록합니다. 계산하거나 다듬은 값이 아닙니다.<br>
진폭은 기기가 받아들일 수 있는 최댓값을 ±1로 본 상대값입니다. 절대 음압(dB SPL)이 아니라
기종이 다르면 값도 달라집니다.<br>
한 번에 20초까지 담습니다. 그 이상은 행이 백만 개를 넘어 엑셀이 열지 못합니다.
</p>

<script>
const $ = id => document.getElementById(id);
function banner(msg){
  const b = $('banner'); b.innerHTML = '';
  if (!msg) return;
  const d = document.createElement('div');
  d.className = 'banner'; d.textContent = msg;
  b.appendChild(d);
}
window.addEventListener('error', e => banner('오류: ' + e.message));
window.addEventListener('unhandledrejection', e => banner('오류: ' + e.reason));
if (!(location.protocol === 'https:' || location.hostname === 'localhost'))
  banner('HTTPS가 아니어서 마이크를 쓸 수 없습니다. https 주소로 열어 주세요.');

/* ── 기록통 ──────────────────────────────────────────────
   표본을 있는 그대로 담습니다. 화면에 그릴 때 쓰려고 512개마다
   최솟값·최댓값 한 쌍을 같이 쌓아 둡니다. 매 프레임 백만 개를
   훑으면 폰이 버티지 못하기 때문입니다. */
const MAXSEC = 20, DEC = 512;
let SR = 48000, buf = null, env0 = null, env1 = null;
let cap = 0, n = 0, curE = -1, peak = 0, recent = 0;

function alloc(sr){
  SR = sr; cap = Math.round(sr*MAXSEC);
  buf = new Float32Array(cap);
  const m = Math.ceil(cap/DEC) + 1;
  env0 = new Float32Array(m); env1 = new Float32Array(m);
  n = 0; curE = -1; peak = 0; recent = 0;
}
function push(ch){
  for (let i = 0; i < ch.length; i++){
    if (n >= cap){ stop(true); return; }
    const v = ch[i];
    buf[n] = v;
    const e = (n/DEC)|0;
    if (e !== curE){ curE = e; env0[e] = v; env1[e] = v; }
    else { if (v < env0[e]) env0[e] = v; if (v > env1[e]) env1[e] = v; }
    const a = v < 0 ? -v : v;
    if (a > peak) peak = a;
    n++;
  }
  /* 화면에 띄울 '지금 진폭'은 최근 50 ms의 봉우리 */
  let r = 0;
  const from = Math.max(0, n - Math.round(SR*0.05));
  for (let i = from; i < n; i += 4){ const a = buf[i] < 0 ? -buf[i] : buf[i]; if (a > r) r = a; }
  recent = r;
}

/* ── 마이크 ──────────────────────────────────────────────
   자동 이득·잡음 제거·에코 제거는 반드시 꺼야 합니다. 켜져 있으면
   기기가 진폭을 제 마음대로 눌렀다 올렸다 하여 기록이 무의미해집니다. */
const WORKLET = `
class Cap extends AudioWorkletProcessor {
  constructor(){ super(); this.b = new Float32Array(1024); this.n = 0; }
  process(inputs){
    const ch = inputs[0] && inputs[0][0];
    if (ch) for (let i = 0; i < ch.length; i++){
      this.b[this.n++] = ch[i];
      if (this.n === 1024){ this.port.postMessage(this.b.slice()); this.n = 0; }
    }
    return true;
  }
}
registerProcessor('cap', Cap);
`;

let ctx = null, stream = null, node = null, running = false, wl = null;

async function start(){
  $('bRun').disabled = true;
  try{
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      banner('이 브라우저에서는 마이크를 쓸 수 없습니다.');
      $('bRun').disabled = false; return;
    }
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false
    }});
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    alloc(ctx.sampleRate);
    banner('');

    const src = ctx.createMediaStreamSource(stream);
    const mute = ctx.createGain(); mute.gain.value = 0;
    if (ctx.audioWorklet){
      const url = URL.createObjectURL(new Blob([WORKLET], {type:'text/javascript'}));
      await ctx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      node = new AudioWorkletNode(ctx, 'cap');
      node.port.onmessage = e => push(e.data);
    } else {
      node = ctx.createScriptProcessor(2048, 1, 1);
      node.onaudioprocess = e => push(e.inputBuffer.getChannelData(0));
    }
    src.connect(node); node.connect(mute); mute.connect(ctx.destination);

    running = true;
    $('bRun').textContent = '녹음 정지';
    $('bRun').classList.add('rec');
    $('bRun').disabled = false;
    $('bCsv').disabled = true;
    if (SR < 44100)
      banner('표본율이 ' + SR + ' Hz로 낮습니다. 블루투스 마이크가 통화 모드로 잡힌 것 같습니다. 기기 내장 마이크를 쓰세요.');
    keepAwake();
    setTimeout(() => { if (running && n === 0) banner('마이크에서 소리가 들어오지 않습니다.'); }, 2000);
  }catch(err){
    banner('마이크를 열지 못했습니다: ' + (err && err.message ? err.message : err));
    $('bRun').disabled = false;
  }
}

function stop(auto){
  if (!running) return;
  running = false;
  $('bRun').textContent = '녹음 시작';
  $('bRun').classList.remove('rec');
  $('bCsv').disabled = n < 2;
  if (node){ try{ node.disconnect(); }catch(e){} node = null; }
  if (stream){ for (const t of stream.getTracks()) t.stop(); stream = null; }
  if (ctx){ ctx.close().catch(()=>{}); ctx = null; }
  if (wl){ try{ wl.release(); }catch(e){} wl = null; }
  if (auto) banner('20초가 차서 자동으로 멈췄습니다. CSV로 받으신 뒤 다시 시작하세요.');
}

$('bRun').addEventListener('click', () => { running ? stop(false) : start(); });

async function keepAwake(){
  try{ if ('wakeLock' in navigator){
    wl = await navigator.wakeLock.request('screen');
    wl.addEventListener('release', () => { wl = null; });
  }}catch(err){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running && !wl) keepAwake();
});

/* ── 그리기 ──────────────────────────────────────────────
   가로는 늘 녹음 전체입니다. 세로는 지금까지의 최댓값에 맞춰
   저절로 잡히므로 눈금을 만질 일이 없습니다. */
const H = 200;
const cv = $('scope'), cx = cv.getContext('2d');
let W = 1, lastW = 0, rt = null;

function refit(){
  const w = cv.clientWidth;
  if (w < 1 || w === lastW) return;
  lastW = w; W = w;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w*d); cv.height = Math.round(H*d);
  cv.style.height = H + 'px';
  cx.setTransform(d, 0, 0, d, 0, 0);
}
if (window.ResizeObserver) new ResizeObserver(refit).observe(cv);
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(refit, 150); });
window.addEventListener('orientationchange', () => setTimeout(refit, 300));
refit(); requestAnimationFrame(refit); setTimeout(refit, 300);

function draw(){
  requestAnimationFrame(draw);
  cx.clearRect(0, 0, W, H);
  cx.lineWidth = 1; cx.strokeStyle = '#DDE2DA';
  for (let i = 1; i < 10; i++){
    const x = Math.round(W*i/10) + .5;
    cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke();
  }
  for (let i = 1; i < 4; i++){
    const y = Math.round(H*i/4) + .5;
    cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
  }
  cx.strokeStyle = '#AEB6AC';
  const mid = Math.round(H/2) + .5;
  cx.beginPath(); cx.moveTo(0, mid); cx.lineTo(W, mid); cx.stroke();
  if (n < 2) return;

  const vmax = Math.max(peak*1.12, 0.02);
  const g = (H/2)/vmax;
  const yOf = v => {
    const y = H/2 - v*g;
    return y < 0 ? 0 : (y > H ? H : y);
  };

  cx.strokeStyle = '#B23A2E'; cx.lineWidth = 1; cx.lineJoin = 'round';
  cx.beginPath();
  const hi = new Float32Array(W), lo = new Float32Array(W);
  const raw = n <= 120000;              /* 짧을 때는 원본에서 바로 */
  for (let px = 0; px < W; px++){
    const a = Math.floor(n*px/W), b = Math.max(a + 1, Math.floor(n*(px+1)/W));
    let mn = 1e9, mx = -1e9;
    if (raw){
      for (let i = a; i < b; i++){ const v = buf[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    } else {
      const e0 = (a/DEC)|0, e1 = Math.max(e0 + 1, Math.ceil(b/DEC));
      for (let e = e0; e < e1; e++){ if (env0[e] < mn) mn = env0[e]; if (env1[e] > mx) mx = env1[e]; }
    }
    if (mx < mn){ mn = mx = 0; }
    lo[px] = mn; hi[px] = mx;
  }
  for (let px = 0; px < W; px++){
    const x = px + .5, y = yOf(hi[px]);
    px ? cx.lineTo(x, y) : cx.moveTo(x, y);
  }
  for (let px = W - 1; px >= 0; px--) cx.lineTo(px + .5, yOf(lo[px]));
  cx.closePath();
  cx.fillStyle = 'rgba(178,58,46,.22)'; cx.fill();
  cx.stroke();
}
requestAnimationFrame(draw);

/* ── 숫자 ────────────────────────────────────────────────*/
setInterval(() => {
  const sec = n/SR;
  const has = n > 1;
  $('vNow').classList.toggle('dim', !running);
  $('vMax').classList.toggle('dim', !has);
  $('vNow').textContent = running ? recent.toFixed(3) : '—';
  $('vMax').textContent = has ? peak.toFixed(3) : '—';
  $('tEnd').textContent = has ? sec.toFixed(2) + ' s' : '—';
  $('tag').textContent = running ? '기록 중' : (has ? '멈춤' : '—');
  $('sub').textContent = has
    ? sec.toFixed(2) + '초 · ' + n.toLocaleString() + '행 · '
      + (n*19/1048576).toFixed(1) + ' MB · 표본율 ' + SR.toLocaleString() + ' Hz'
    : '대기 중';
  if (peak > 0.985 && running) banner('소리가 기기 한계를 넘었습니다. 마이크를 멀리 두세요.');
}, 100);

/* ── CSV ─────────────────────────────────────────────────
   백만 행을 한 문자열로 이으면 폰의 기억공간이 모자랄 수 있어
   5만 행씩 나누어 담습니다. 앞의 BOM은 엑셀이 한글 머리글을
   깨뜨리지 않게 하는 표식입니다. */
$('bCsv').addEventListener('click', () => {
  if (n < 2) return;
  try{
    const parts = ['\ufeff시간(s),진폭\n'];
    const STEP = 50000;
    for (let s = 0; s < n; s += STEP){
      const e = Math.min(n, s + STEP), rows = [];
      for (let i = s; i < e; i++) rows.push((i/SR).toFixed(6) + ',' + buf[i].toFixed(6));
      parts.push(rows.join('\n') + '\n');
    }
    const d = new Date(), p = v => String(v).padStart(2, '0');
    const name = '음파_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
      + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds())
      + '_' + SR + 'Hz.csv';
    const url = URL.createObjectURL(new Blob(parts, {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }catch(err){ banner('내보내기에 실패했습니다: ' + (err.message || err)); }
});
</script>
</body>
</html>

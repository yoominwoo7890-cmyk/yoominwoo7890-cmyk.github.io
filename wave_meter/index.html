<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음파 기록계</title>
<style>
:root{
  --paper:#E9EBE5; --panel:#F5F6F2; --line:#CFD5CD;
  --ink:#1E2320; --ink-2:#6A726B; --pen:#B23A2E; --mark:#1D6E6E; --warn:#8A5A00;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;
  padding:14px 14px calc(28px + env(safe-area-inset-bottom));
  max-width:620px;margin-inline:auto}
h1{font-size:13px;font-weight:500;color:var(--ink-2);margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:10px}
.pad{padding:12px}

.read{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px}
.read .k{font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
.read .v{font-family:var(--mono);font-size:clamp(27px,8.2vw,38px);font-weight:500;
  line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.read .v small{font-size:14px;color:var(--ink-2);font-weight:400;letter-spacing:0}
.read .v.dim{color:var(--ink-2);opacity:.45}
.sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);padding:0 14px 13px;margin:0}

.chan{padding:11px 14px 12px}
.lab{display:flex;justify-content:space-between;align-items:baseline;
  font-size:11.5px;color:var(--ink-2);margin-bottom:5px}
canvas{display:block;background:#FCFDFB;border:1px solid var(--line);width:100%}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:11px;color:var(--ink-2);margin-top:5px}

button{width:100%;font-family:var(--sans);font-size:16px;font-weight:500;padding:15px 8px;
  border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button.rec{background:var(--pen);border-color:var(--pen)}
button.mark{background:transparent;color:var(--ink);border-color:var(--ink);font-size:15px}
button.mark.live{background:var(--mark);border-color:var(--mark);color:#fff}
button.sm{font-size:13.5px;font-weight:400;padding:12px 6px}
button.sm b{font-weight:500}
button:disabled{opacity:.3;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.two button{margin:0}
button + button{margin-top:8px}

.note{font-size:12px;color:var(--ink-2);line-height:1.65;margin:14px 2px 0}
.banner{background:var(--warn);color:#fff;padding:11px 13px;border-radius:4px;
  font-size:13.5px;margin-bottom:10px}
</style>
</head>
<body>

<h1>음파 기록계</h1>
<div id="banner"></div>

<div class="card">
  <div class="read">
    <div>
      <div class="k">진동수</div>
      <div class="v dim" id="vF">—</div>
    </div>
    <div>
      <div class="k">진폭</div>
      <div class="v dim" id="vA">—</div>
    </div>
  </div>
  <p class="sub" id="sub">대기 중</p>
</div>

<div class="card">
  <div class="chan">
    <div class="lab"><b style="color:var(--pen);font-weight:500">진폭 vs 시간</b><span id="tag">—</span></div>
    <canvas id="scope"></canvas>
    <div class="axis"><span>0 s</span><span id="tEnd">—</span></div>
  </div>
</div>

<div class="card">
  <div class="pad">
    <button id="bRun">녹음 시작</button>
    <button class="mark" id="bSeg" disabled>측정 시작</button>
    <div class="two">
      <button class="ghost sm" id="bA" disabled>진폭 CSV</button>
      <button class="ghost sm" id="bF" disabled>진동수 CSV</button>
    </div>
  </div>
</div>

<p class="note">
진폭 CSV에는 마이크가 준 값이 표본 하나하나 그대로 들어갑니다. 계산하거나 다듬지 않은 원본입니다.<br>
진동수 CSV에는 그 원본을 0.17초씩 분석해 얻은 값이 초당 열 줄로 들어갑니다. 같은 구간을 다른 눈으로 본 것입니다.<br>
측정 구간을 잡지 않으면 녹음 전체가 나갑니다. 진폭은 ±1이 기기 한계인 상대값이며 절대 음압이 아닙니다.<br>
한 번에 20초까지 담습니다. 그 이상은 행이 백만 개를 넘어 엑셀이 열지 못합니다.
</p>

<script>
const $ = id => document.getElementById(id);
function banner(msg){
  const b = $('banner'); b.innerHTML = '';
  if (!msg) return;
  const d = document.createElement('div');
  d.className = 'banner'; d.textContent = msg;
  b.appendChild(d);
}
window.addEventListener('error', e => banner('오류: ' + e.message));
window.addEventListener('unhandledrejection', e => banner('오류: ' + e.reason));
if (!(location.protocol === 'https:' || location.hostname === 'localhost'))
  banner('HTTPS가 아니어서 마이크를 쓸 수 없습니다. https 주소로 열어 주세요.');

/* ── 기록통 ──────────────────────────────────────────────
   표본을 있는 그대로 담습니다. 화면에 그릴 때 쓰려고 512개마다
   최솟값·최댓값 한 쌍을 같이 쌓아 둡니다. 매 프레임 백만 개를
   훑으면 폰이 버티지 못하기 때문입니다. */
const MAXSEC = 20, DEC = 512;
let SR = 48000, buf = null, env0 = null, env1 = null;
let cap = 0, n = 0, curE = -1, peak = 0, recent = 0;
const flog = [];                     /* 진동수 기록 {i, f, a} */

function alloc(sr){
  SR = sr; cap = Math.round(sr*MAXSEC);
  buf = new Float32Array(cap);
  const m = Math.ceil(cap/DEC) + 1;
  env0 = new Float32Array(m); env1 = new Float32Array(m);
  n = 0; curE = -1; peak = 0; recent = 0;
  flog.length = 0; segA = segB = null; fHist.length = 0;
}
function push(ch){
  for (let i = 0; i < ch.length; i++){
    if (n >= cap){ stop(true); return; }
    const v = ch[i];
    buf[n] = v;
    const e = (n/DEC)|0;
    if (e !== curE){ curE = e; env0[e] = v; env1[e] = v; }
    else { if (v < env0[e]) env0[e] = v; if (v > env1[e]) env1[e] = v; }
    const a = v < 0 ? -v : v;
    if (a > peak) peak = a;
    n++;
  }
  let r = 0;
  const from = Math.max(0, n - Math.round(SR*0.05));
  for (let i = from; i < n; i += 4){ const a = buf[i] < 0 ? -buf[i] : buf[i]; if (a > r) r = a; }
  recent = r;
}

/* ── 마이크 ──────────────────────────────────────────────
   자동 이득·잡음 제거·에코 제거는 반드시 꺼야 합니다. 켜져 있으면
   기기가 진폭을 제 마음대로 눌렀다 올렸다 하여 기록이 무의미해집니다. */
const WORKLET = `
class Cap extends AudioWorkletProcessor {
  constructor(){ super(); this.b = new Float32Array(1024); this.n = 0; }
  process(inputs){
    const ch = inputs[0] && inputs[0][0];
    if (ch) for (let i = 0; i < ch.length; i++){
      this.b[this.n++] = ch[i];
      if (this.n === 1024){ this.port.postMessage(this.b.slice()); this.n = 0; }
    }
    return true;
  }
}
registerProcessor('cap', Cap);
`;

let ctx = null, stream = null, node = null, running = false, wl = null;

async function start(){
  $('bRun').disabled = true;
  try{
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      banner('이 브라우저에서는 마이크를 쓸 수 없습니다.');
      $('bRun').disabled = false; return;
    }
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false
    }});
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    alloc(ctx.sampleRate);
    banner('');

    const src = ctx.createMediaStreamSource(stream);
    const mute = ctx.createGain(); mute.gain.value = 0;
    if (ctx.audioWorklet){
      const url = URL.createObjectURL(new Blob([WORKLET], {type:'text/javascript'}));
      await ctx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      node = new AudioWorkletNode(ctx, 'cap');
      node.port.onmessage = e => push(e.data);
    } else {
      node = ctx.createScriptProcessor(2048, 1, 1);
      node.onaudioprocess = e => push(e.inputBuffer.getChannelData(0));
    }
    src.connect(node); node.connect(mute); mute.connect(ctx.destination);

    running = true;
    $('bRun').textContent = '녹음 정지';
    $('bRun').classList.add('rec');
    $('bRun').disabled = false;
    if (SR < 44100)
      banner('표본율이 ' + SR + ' Hz로 낮습니다. 블루투스 마이크가 통화 모드로 잡힌 것 같습니다. 기기 내장 마이크를 쓰세요.');
    keepAwake();
    setTimeout(() => { if (running && n === 0) banner('마이크에서 소리가 들어오지 않습니다.'); }, 2000);
  }catch(err){
    banner('마이크를 열지 못했습니다: ' + (err && err.message ? err.message : err));
    $('bRun').disabled = false;
  }
}

function stop(auto){
  if (!running) return;
  running = false;
  if (segA != null && segB == null) segB = n;    /* 열린 구간은 닫고 멈춥니다 */
  $('bRun').textContent = '녹음 시작';
  $('bRun').classList.remove('rec');
  if (node){ try{ node.disconnect(); }catch(e){} node = null; }
  if (stream){ for (const t of stream.getTracks()) t.stop(); stream = null; }
  if (ctx){ ctx.close().catch(()=>{}); ctx = null; }
  if (wl){ try{ wl.release(); }catch(e){} wl = null; }
  if (auto) banner('20초가 차서 자동으로 멈췄습니다. CSV로 받으신 뒤 다시 시작하세요.');
}

$('bRun').addEventListener('click', () => { running ? stop(false) : start(); });

async function keepAwake(){
  try{ if ('wakeLock' in navigator){
    wl = await navigator.wakeLock.request('screen');
    wl.addEventListener('release', () => { wl = null; });
  }}catch(err){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running && !wl) keepAwake();
});

/* ── 측정 구간 ───────────────────────────────────────────
   표본 번호로 잡아 둡니다. 진폭과 진동수 두 파일이 같은 구간을
   가리키므로, 범위를 정하는 방법은 이것 하나뿐입니다. */
let segA = null, segB = null;
const segEnd = () => segB == null ? n : segB;
const hasSeg = () => segA != null;
function segRange(){ return hasSeg() ? [segA, segEnd()] : [0, n]; }

$('bSeg').addEventListener('click', () => {
  if (segA == null || segB != null){ segA = n; segB = null; }
  else segB = n;
});
function segUI(){
  const b = $('bSeg');
  b.disabled = !running && segA == null;
  if (segA == null){ b.textContent = '측정 시작'; b.classList.remove('live'); }
  else if (segB == null){
    b.textContent = '측정 종료 · ' + ((segEnd()-segA)/SR).toFixed(1) + '초';
    b.classList.add('live');
  } else {
    b.textContent = '구간 다시 잡기 · ' + ((segB-segA)/SR).toFixed(1) + '초';
    b.classList.remove('live');
  }
}

/* ── 진동수 ──────────────────────────────────────────────
   창 함수를 씌운 8192점 FFT로 가장 센 성분을 찾고, 봉우리 양옆
   칸의 로그 크기로 포물선을 맞춰 칸 사이 값까지 읽습니다.
   조작할 것은 없고 숫자만 나옵니다. */
const NF = 8192;
const re = new Float32Array(NF), im = new Float32Array(NF);
const mag = new Float32Array(NF >> 1);
const win = new Float32Array(NF);
for (let i = 0; i < NF; i++) win[i] = 0.5 - 0.5*Math.cos(2*Math.PI*i/(NF-1));

function fft(){
  for (let i = 1, j = 0; i < NF; i++){
    let bit = NF >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j){
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= NF; len <<= 1){
    const ang = -2*Math.PI/len, wr = Math.cos(ang), wi = Math.sin(ang), h = len >> 1;
    for (let i = 0; i < NF; i += len){
      let cr = 1, ci = 0;
      for (let k = 0; k < h; k++){
        const a = i + k, b = a + h;
        const vr = re[b]*cr - im[b]*ci, vi = re[b]*ci + im[b]*cr;
        re[b] = re[a] - vr; im[b] = im[a] - vi;
        re[a] += vr;        im[a] += vi;
        const t = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = t;
      }
    }
  }
}

const KMIN = 8;
const fHist = [];
let fNow = null, aNow = 0;

function analyze(){
  if (n < NF) return null;
  const base = n - NF;
  let pk = 0, sum = 0;
  for (let i = 0; i < NF; i++){
    const v = buf[base + i], a = v < 0 ? -v : v;
    if (a > pk) pk = a;
    sum += v*v;
    re[i] = v*win[i]; im[i] = 0;
  }
  aNow = pk;
  if (Math.sqrt(sum/NF) < 0.0004) return null;      /* 사실상 무음 */
  fft();
  const kHi = (NF >> 1) - 2;
  let k = KMIN + 1, best = -1, tot = 0;
  for (let i = KMIN; i <= kHi; i++){
    const m = re[i]*re[i] + im[i]*im[i];
    mag[i] = m; tot += m;
    if (m > best && i > KMIN){ best = m; k = i; }
  }
  if (best < (tot/(kHi - KMIN + 1))*40) return null;  /* 뚜렷한 봉우리 없음 */
  const a = Math.log(mag[k-1] + 1e-20),
        b = Math.log(mag[k]   + 1e-20),
        c = Math.log(mag[k+1] + 1e-20);
  const den = a - 2*b + c;
  const d = den === 0 ? 0 : Math.max(-0.5, Math.min(0.5, 0.5*(a - c)/den));
  return (k + d)*SR/NF;
}

/* ── 그리기 ──────────────────────────────────────────────
   가로는 늘 녹음 전체, 세로는 최댓값에 저절로 맞춥니다. */
const H = 200;
const cv = $('scope'), cx = cv.getContext('2d');
let W = 1, lastW = 0, rt = null;

function refit(){
  const w = cv.clientWidth;
  if (w < 1 || w === lastW) return;
  lastW = w; W = w;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w*d); cv.height = Math.round(H*d);
  cv.style.height = H + 'px';
  cx.setTransform(d, 0, 0, d, 0, 0);
}
if (window.ResizeObserver) new ResizeObserver(refit).observe(cv);
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(refit, 150); });
window.addEventListener('orientationchange', () => setTimeout(refit, 300));
refit(); requestAnimationFrame(refit); setTimeout(refit, 300);

const hiA = new Float32Array(2048), loA = new Float32Array(2048);

function draw(){
  requestAnimationFrame(draw);
  cx.clearRect(0, 0, W, H);
  cx.lineWidth = 1; cx.strokeStyle = '#DDE2DA';
  for (let i = 1; i < 10; i++){
    const x = Math.round(W*i/10) + .5;
    cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke();
  }
  for (let i = 1; i < 4; i++){
    const y = Math.round(H*i/4) + .5;
    cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
  }
  cx.strokeStyle = '#AEB6AC';
  const mid = Math.round(H/2) + .5;
  cx.beginPath(); cx.moveTo(0, mid); cx.lineTo(W, mid); cx.stroke();
  if (n < 2) return;

  /* 잡아 둔 구간을 옅게 칠해 어디가 나가는지 보이게 합니다 */
  if (hasSeg()){
    const xa = segA/n*W, xb = Math.min(W, segEnd()/n*W);
    cx.fillStyle = 'rgba(29,110,110,.12)';
    cx.fillRect(xa, 0, xb - xa, H);
    cx.strokeStyle = 'rgba(29,110,110,.55)';
    for (const x of [xa, xb]){
      if (x <= 0 || x >= W) continue;
      cx.beginPath(); cx.moveTo(x + .5, 0); cx.lineTo(x + .5, H); cx.stroke();
    }
  }

  const vmax = Math.max(peak*1.12, 0.02);
  const g = (H/2)/vmax;
  const yOf = v => { const y = H/2 - v*g; return y < 0 ? 0 : (y > H ? H : y); };

  const cols = Math.min(W, 2048);
  const raw = n <= 120000;
  for (let px = 0; px < cols; px++){
    const a = Math.floor(n*px/cols), b = Math.max(a + 1, Math.floor(n*(px+1)/cols));
    let mn = 1e9, mx = -1e9;
    if (raw){
      for (let i = a; i < b; i++){ const v = buf[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    } else {
      const e0 = (a/DEC)|0, e1 = Math.max(e0 + 1, Math.ceil(b/DEC));
      for (let e = e0; e < e1; e++){ if (env0[e] < mn) mn = env0[e]; if (env1[e] > mx) mx = env1[e]; }
    }
    if (mx < mn){ mn = mx = 0; }
    loA[px] = mn; hiA[px] = mx;
  }
  cx.strokeStyle = '#B23A2E'; cx.lineWidth = 1; cx.lineJoin = 'round';
  cx.beginPath();
  for (let px = 0; px < cols; px++){
    const x = px/cols*W + .5, y = yOf(hiA[px]);
    px ? cx.lineTo(x, y) : cx.moveTo(x, y);
  }
  for (let px = cols - 1; px >= 0; px--) cx.lineTo(px/cols*W + .5, yOf(loA[px]));
  cx.closePath();
  cx.fillStyle = 'rgba(178,58,46,.22)'; cx.fill();
  cx.stroke();
}
requestAnimationFrame(draw);

/* ── 숫자 갱신 ───────────────────────────────────────────*/
setInterval(() => {
  if (running && buf){
    const f = analyze();
    /* 한 칸씩 튀는 것만 막고 변화는 놓치지 않도록 3개 중앙값 */
    if (f === null) fHist.length = 0;
    else { fHist.push(f); if (fHist.length > 3) fHist.shift(); }
    const s = [...fHist].sort((x,y) => x-y);
    fNow = s.length ? s[s.length >> 1] : null;
    if (n >= NF) flog.push({ i: n, f: fNow, a: aNow });
  }
  const has = n > 1;
  const sec = n/SR;
  $('vF').classList.toggle('dim', fNow == null);
  $('vA').classList.toggle('dim', !has);
  $('vF').innerHTML = fNow == null ? '—'
    : (fNow < 1000 ? fNow.toFixed(1) : fNow.toFixed(0)) + ' <small>Hz</small>';
  $('vA').textContent = has ? (running ? recent : peak).toFixed(3) : '—';
  $('tEnd').textContent = has ? sec.toFixed(2) + ' s' : '—';
  $('tag').textContent = running ? '기록 중' : (has ? '멈춤' : '—');

  const [a, b] = segRange();
  const rows = b - a;
  $('sub').textContent = has
    ? (hasSeg() ? '구간 ' : '전체 ') + ((b-a)/SR).toFixed(2) + '초 · '
      + rows.toLocaleString() + '행 · ' + (rows*19/1048576).toFixed(1) + ' MB · '
      + SR.toLocaleString() + ' Hz'
    : '대기 중';
  $('bA').disabled = rows < 2;
  $('bF').disabled = fRows().length < 1;
  $('bA').innerHTML = '진폭 <b>' + rows.toLocaleString() + '행</b>';
  $('bF').innerHTML = '진동수 <b>' + fRows().length.toLocaleString() + '행</b>';
  segUI();
  if (peak > 0.985 && running) banner('소리가 기기 한계를 넘었습니다. 마이크를 멀리 두세요.');
}, 100);

/* ── CSV ─────────────────────────────────────────────────
   백만 행을 한 문자열로 이으면 폰의 기억공간이 모자랄 수 있어
   5만 행씩 나누어 담습니다. 앞의 BOM은 엑셀이 한글 머리글을
   깨뜨리지 않게 하는 표식입니다. */
function fRows(){
  const [a, b] = segRange();
  return flog.filter(r => r.i >= a && r.i <= b);
}
function stamp(){
  const d = new Date(), p = v => String(v).padStart(2, '0');
  return '' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
    + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}
function save(name, parts){
  try{
    const url = URL.createObjectURL(new Blob(parts, {type:'text/csv;charset=utf-8'}));
    const el = document.createElement('a');
    el.href = url; el.download = name;
    document.body.appendChild(el); el.click();
    setTimeout(() => { URL.revokeObjectURL(url); el.remove(); }, 2000);
  }catch(err){ banner('내보내기에 실패했습니다: ' + (err.message || err)); }
}
const tail = () => (hasSeg() ? '_구간' : '_전체') + '.csv';

$('bA').addEventListener('click', () => {
  const [a, b] = segRange();
  if (b - a < 2) return;
  const parts = ['\ufeff시간(s),진폭\n'];
  const STEP = 50000;
  for (let s = a; s < b; s += STEP){
    const e = Math.min(b, s + STEP), rows = [];
    for (let i = s; i < e; i++) rows.push(((i-a)/SR).toFixed(6) + ',' + buf[i].toFixed(6));
    parts.push(rows.join('\n') + '\n');
  }
  save('진폭_' + stamp() + '_' + SR + 'Hz' + tail(), parts);
});

$('bF').addEventListener('click', () => {
  const rs = fRows();
  if (!rs.length) return;
  const a = segRange()[0];
  const rows = ['\ufeff시간(s),진동수(Hz),진폭'];
  for (const r of rs)
    rows.push(((r.i-a)/SR).toFixed(3) + ',' + (r.f == null ? '' : r.f.toFixed(2))
      + ',' + r.a.toFixed(6));
  save('진동수_' + stamp() + tail(), [rows.join('\n') + '\n']);
});
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 화면 | 기체 확산과 엔트로피</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <p id="notice" class="notice" hidden>firebase-config.js에 Firebase 설정값을 넣어야 앱이 동작합니다.</p>

  <section id="start" class="join">
    <h1>교사 화면</h1>
    <p class="sub">방을 만들면 학생에게 알려 줄 4자리 코드가 생깁니다.</p>
    <label>주제</label>
    <div id="topicSeg" class="seg">
      <button type="button" data-topic="gas" class="on">기체 확산</button>
      <button type="button" data-topic="heat">열의 이동</button>
    </div>
    <p id="topicHint" class="hint">칸막이를 열면 한쪽에 모여 있던 기체 분자가 퍼집니다.</p>
    <label for="inRounds">진행할 라운드 수</label>
    <input id="inRounds" type="number" inputmode="numeric" min="1" max="20" step="1" value="10">
    <label class="check"><input id="inPredict" type="checkbox" checked> <span>예상 점수 맞히기<br><span class="hint">학생이 입장할 때 마지막 라운드까지의 누적 점수를 예상해서 적고, 끝난 뒤 실제 점수와 가장 가까운 순서로 최종 순위를 공개합니다.</span></span></label>
    <label class="check"><input id="inTeams" type="checkbox"> <span>모둠 대항전으로 진행<br><span class="hint">학생이 빨강·파랑·초록·노랑 중 하나를 골라 팀이 되고, 점수를 팀별로 계산합니다.</span></span></label>
    <p id="startErr" class="err"></p>
    <button id="btnCreate" class="primary" disabled>방 만들기</button>
  </section>

  <section id="game" hidden>
    <header class="bar">
      <div><span class="room">방 코드<span id="hRoom" class="code"></span></span></div>
      <div class="chips"><span id="hRound" class="chip"></span> <span id="hKind" class="chip plain"></span> <button id="btnNew" class="ghost">새 방 만들기</button></div>
    </header>
    <div class="teacher">
      <div>
        <p id="status" class="status"></p>
        <div class="sides">
          <span><span id="lblL">왼쪽</span><b id="cL"></b><span id="tL" class="thermo" title="토큰 1개는 100 J이고, 토큰이 하나 들어오면 그 물체의 온도가 2 ℃ 올라요. 토큰이 없을 때는 20 ℃예요." hidden><span class="track"><i></i></span></span></span>
          <span></span>
          <span><span id="lblR">오른쪽</span><b id="cR"></b><span id="tR" class="thermo" title="토큰 1개는 100 J이고, 토큰이 하나 들어오면 그 물체의 온도가 2 ℃ 올라요. 토큰이 없을 때는 20 ℃예요." hidden><span class="track"><i></i></span></span></span>
        </div>
        <div id="board" class="board"></div>
        <section id="final" class="final" hidden></section>
        <section id="result" class="result" hidden></section>
      </div>

      <aside class="panel">
        <div>
          <h2>위치를 정하는 방식</h2>
          <div class="seg">
            <button id="mClick" data-mode="click">직접 선택</button>
            <button id="mRandom" data-mode="random">무작위 번호</button>
          </div>
        </div>
        <div>
          <p class="count">선택 완료 <b id="nDone">0</b> / 전체 <b id="nAll">0</b>명</p>
          <p id="teamSizes" class="sub" hidden></p>
        </div>
        <button id="btnStart" class="primary">칸막이 열기</button>
        <button id="btnReveal" class="primary" hidden>결과 보이기</button>
        <button id="btnColors" class="secondary" hidden>팀 색깔 공개</button>
        <button id="btnFinal" class="primary" hidden>최종 순위 공개</button>
        <button id="btnReset" class="ghost">처음 상태로 초기화</button>

        <div>
          <h2>점수 기록</h2>
          <div id="hist"></div>
        </div>
        <div id="avgBox">
          <h2>방식별 평균 점수</h2>
          <div class="avg">
            <div>직접 선택<b id="avgClick">–</b></div>
            <div>무작위 번호<b id="avgRandom">–</b></div>
          </div>
        </div>
      </aside>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const board = $("board");
let cells = buildBoard(board);
let db, uid, code, roomRef, choicesRef;
let meta = null, players = {}, priv = {}, pub = {}, choices = {}, results = {}, curKey = null, prevChoices = null;
let topic = "gas";
document.querySelectorAll("[data-topic]").forEach((b) => b.addEventListener("click", () => {
  topic = b.dataset.topic;
  document.querySelectorAll("[data-topic]").forEach((o) => o.classList.toggle("on", o === b));
  $("topicHint").textContent = topic === "heat"
    ? "뜨거운 물체(왼쪽)와 차가운 물체(오른쪽)를 접촉시키면 에너지가 나뉘어 온도가 같아집니다. 칸은 입자(한쪽에 12개)이고, 학생의 토큰 1개는 에너지 100 J로 물체의 온도를 2 ℃ 올립니다. 토큰이 없는 물체는 20 ℃입니다."
    : "칸막이를 열면 한쪽에 모여 있던 기체 분자가 퍼집니다.";
}));
const fail = (what) => (e) => alert(what + ": " + (e.code || e.message));

if (configReady()) {
  firebase.initializeApp(window.firebaseConfig);
  db = firebase.database();
  firebase.auth().signInAnonymously().then(async (c) => {
    uid = c.user.uid;
    const saved = localStorage.getItem("entropy_teacher");
    if (saved) {
      const s = await db.ref("rooms/" + saved + "/meta").get();
      if (s.exists() && s.val().teacherUid === uid) return open(saved);
      localStorage.removeItem("entropy_teacher");
    }
    $("btnCreate").disabled = false;
  }).catch(() => { $("startErr").textContent = "로그인에 실패했습니다. Firebase 콘솔에서 익명 로그인을 켰는지 확인하세요."; });
}

$("btnCreate").addEventListener("click", async () => {
  const rounds = Number($("inRounds").value);
  if (!Number.isInteger(rounds) || rounds < 1 || rounds > 20) return ($("startErr").textContent = "라운드 수는 1부터 20 사이의 정수로 적으세요.");
  $("btnCreate").disabled = true;
  try {
    for (let i = 0; i < 20; i++) {
      const c = String(1000 + Math.floor(Math.random() * 9000));
      const ref = db.ref("rooms/" + c + "/meta");
      if ((await ref.get()).exists()) continue;
      await ref.set({ teacherUid: uid, mode: "click", round: 0, roundKey: "r0", phase: "lobby", createdAt: Date.now(), totalRounds: rounds, teams: $("inTeams").checked, predict: $("inPredict").checked, topic });
      localStorage.setItem("entropy_teacher", c);
      return open(c);
    }
    throw new Error();
  } catch (e) {
    $("startErr").textContent = "방을 만들지 못했습니다. 데이터베이스 규칙과 databaseURL을 확인하세요.";
    $("btnCreate").disabled = false;
  }
});
$("btnNew").addEventListener("click", () => {
  if (confirm("지금 방을 닫고 새 방을 만들까요? 점수 기록은 이 화면에서 더 볼 수 없습니다.")) { localStorage.removeItem("entropy_teacher"); location.reload(); }
});
// 초기화: 칸막이를 닫고 분자를 왼쪽으로 되돌리며 라운드와 점수 기록을 지운다. 입장한 학생, 팀, 예상 점수는 그대로 남는다.
$("btnReset").addEventListener("click", () => {
  if (!meta || !confirm("처음 상태로 초기화할까요?\n" + TOPIC[topicOf(meta)].unit + "가 모두 왼쪽으로 돌아가고, 라운드와 점수 기록이 모두 지워집니다. 입장한 학생과 팀, 예상 점수는 그대로 남습니다.")) return;
  const game = (meta.game || 0) + 1;
  roomRef.update({ "meta/game": game, "meta/round": 0, "meta/roundKey": "g" + game + "r0", "meta/phase": "lobby", results: null, pub: null })
    .catch(fail("초기화하지 못했습니다"));
});
document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
  if (meta && meta.phase !== "selecting" && meta.phase !== "final") roomRef.child("meta/mode").set(b.dataset.mode);
}));
$("btnStart").addEventListener("click", () => {
  const next = meta.round + 1;
  roomRef.child("meta").update({ round: next, roundKey: keyOf(meta, next), phase: "selecting" });   // 칸막이 열기 또는 다음 라운드
});
const teamOf = () => { const m = {}; Object.keys(priv).forEach((u) => { if (priv[u] && priv[u].team) m[u] = priv[u].team; }); return m; };
$("btnReveal").addEventListener("click", () => {
  const list = Object.values(choices), n = list.length;
  if (n === 0) return alert("아직 제출한 학생이 없습니다.");
  const all = Object.keys(players).length;
  if (n < all && !confirm("아직 " + (all - n) + "명이 제출하지 않았습니다. 그래도 공개할까요?")) return;
  const nL = list.filter((c) => sideOf(c) === "L").length;
  const res = { round: meta.round, mode: meta.mode, n, nL, nR: n - nL };
  if (meta.teams) res.teams = teamResults(choices, teamOf()); else res.score = calcScore(n, nL);
  const upd = {};
  upd["results/" + curKey] = res;
  upd["meta/phase"] = "revealed";
  roomRef.update(upd).catch(fail("결과를 공개하지 못했습니다"));
});
// 팀 색깔 공개: 이번 라운드 분자의 팀을 학생 화면에 알려 준다
$("btnColors").addEventListener("click", () => {
  roomRef.child("pub/colors/" + curKey).set(teamOf()).catch(fail("색깔을 공개하지 못했습니다"));
});
// 최종 순위 공개: 예상 점수와 실제 점수의 차이로 순위를 매겨 모두에게 보여 준다
$("btnFinal").addEventListener("click", () => {
  const upd = { "pub/final": buildFinal(meta, players, priv, results), "meta/phase": "final" };
  roomRef.update(upd).catch(fail("최종 순위를 공개하지 못했습니다"));
});

function open(c) {
  code = c; roomRef = db.ref("rooms/" + c);
  $("start").hidden = true; $("game").hidden = false; $("hRoom").textContent = c;
  roomRef.child("meta").on("value", (s) => {
    meta = s.val(); if (!meta) return;
    if (meta.roundKey !== curKey) {
      if (choicesRef) choicesRef.off();
      const had = curKey !== null;
      prevChoices = had ? choices : null;   // 지난 라운드의 분자 위치를 이어서 쓴다
      if (!had && meta.round > 1)
        roomRef.child("choices/" + keyOf(meta, meta.round - 1)).get().then((x) => { prevChoices = x.val(); render(); }).catch(() => {});
      curKey = meta.roundKey; choices = {};
      choicesRef = roomRef.child("choices/" + curKey);
      choicesRef.on("value", (x) => { choices = x.val() || {}; render(); }, fail("학생 응답을 읽지 못했습니다. 데이터베이스 규칙을 확인하세요"));
    }
    render();
  });
  roomRef.child("players").on("value", (s) => { players = s.val() || {}; render(); });
  roomRef.child("results").on("value", (s) => { results = s.val() || {}; render(); });
  roomRef.child("private").on("value", (s) => { priv = s.val() || {}; render(); }, fail("예상 점수와 팀 정보를 읽지 못했습니다. 데이터베이스 규칙을 새 것으로 바꿨는지 확인하세요"));
  roomRef.child("pub").on("value", (s) => { pub = s.val() || {}; render(); }, () => {});
}

function render() {
  if (!meta) return;
  cells = ensureGrid(board, meta);
  const phase = meta.phase, teams = !!meta.teams, total = meta.totalRounds || 0;
  const nAll = Object.keys(players).length, list = phase === "lobby" ? [] : Object.values(choices);
  const shown = phase === "revealed" || phase === "final", last = total > 0 && meta.round >= total;
  $("hRound").textContent = meta.round ? meta.round + (total ? " / " + total : "") + "라운드" : "시작 전" + (total ? " · 총 " + total + "라운드" : "");
  const heat = topicOf(meta) === "heat", T = TOPIC[topicOf(meta)];
  $("hKind").textContent = T.name + " · " + (teams ? "모둠 대항전" : "반 전체 점수");
  $("nDone").textContent = list.length;
  $("nAll").textContent = nAll;
  $("teamSizes").hidden = !teams;
  if (teams) {
    const size = {}; Object.keys(players).forEach((u) => { const t = priv[u] && priv[u].team; if (t) size[t] = (size[t] || 0) + 1; });
    $("teamSizes").innerHTML = "팀 인원: " + TEAMS.map((t) => teamTag(t) + " " + (size[t] || 0)).join(" · ");
  }
  board.classList.toggle("open", phase !== "lobby");
  board.classList.toggle("teams", teams);

  const colorsOut = !!(pub.colors && pub.colors[curKey]), usePredict = meta.predict !== false;
  $("status").textContent =
    phase === "lobby" ? (heat ? "처음 상태입니다. 에너지 " + nAll + "개가 모두 왼쪽 물체에 있어 왼쪽은 " + tempOf(nAll) + " ℃, 오른쪽은 " + tempOf(0) + " ℃입니다. '접촉시키기'를 누르세요."
                           : "처음 상태입니다. 분자 " + nAll + "개가 칸막이 왼쪽에 모여 있습니다. '칸막이 열기'를 누르세요.")
    : phase === "selecting" ? "학생들이 위치를 정하는 중입니다. " + nAll + "명 중 " + list.length + "명이 선택을 마쳤습니다."
    : phase === "final" ? "최종 순위를 공개했습니다. 학생 화면에도 같은 순위가 보입니다."
    : "결과를 공개했습니다." + (teams && !colorsOut ? " '팀 색깔 공개'를 누르면 " + T.unit + "가 팀 색으로 바뀝니다." : "") + (last ? (usePredict ? " 마지막 라운드입니다. '최종 순위 공개'를 누르세요." : " 마지막 라운드까지 마쳤습니다.") : "");

  // 화면에 보이는 분자 위치와, 그 라운드에 공개된 팀 색깔 (학생 화면과 같은 기준)
  const ids = Object.keys(players).sort();
  const prev = meta.round > 1 && prevChoices;
  const shownKey = shown ? curKey : prev ? keyOf(meta, meta.round - 1) : null;
  const colors = (teams && shownKey && pub.colors && pub.colors[shownKey]) || null;
  const gas = (shown ? gasList(choices) : prev ? gasList(prevChoices) : initialList(ids))
    .map((m) => Object.assign(m, { team: colors ? colors[m.id] || "" : "" }));
  setGas(board, gas, shown);

  renderTopic(board, meta, gas);

  document.querySelectorAll("[data-mode]").forEach((b) => {
    b.classList.toggle("on", b.dataset.mode === meta.mode);
    b.disabled = phase === "selecting" || phase === "final";
  });
  $("btnStart").hidden = phase === "selecting" || phase === "final" || (phase === "revealed" && last);
  $("btnStart").textContent = phase === "revealed" ? "다음 라운드 시작" : T.open;
  $("btnReveal").hidden = phase !== "selecting";
  $("btnColors").hidden = !(teams && shown);
  $("btnColors").disabled = colorsOut;
  $("btnColors").textContent = colorsOut ? "팀 색깔 공개됨" : "팀 색깔 공개";
  $("btnFinal").hidden = !(phase === "revealed" && last && usePredict);

  const fin = phase === "final" && pub.final;
  $("final").hidden = !fin;
  if (fin) $("final").innerHTML = finalHTML(pub.final, meta, null);
  const r = results[curKey], showR = shown && r;
  $("result").hidden = !showR;
  if (showR) $("result").innerHTML = resultHTML(meta, r, results, null);
  $("hist").innerHTML = historyHTML(meta, results, "아직 공개된 라운드가 없습니다.");
  $("avgBox").hidden = teams;
  ["click", "random"].forEach((m) => {
    const rs = sortedResults(results).filter((x) => x.mode === m);
    $(m === "click" ? "avgClick" : "avgRandom").textContent = rs.length ? (rs.reduce((s, x) => s + (x.score || 0), 0) / rs.length).toFixed(1) + "점" : "–";
  });
}
</script>
</body>
</html>

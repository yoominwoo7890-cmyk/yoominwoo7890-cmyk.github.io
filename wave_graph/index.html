/* ---------- 재생 ---------- */
let playing=false, lastTs=0;
function togglePlay(){
  playing=!playing; document.getElementById('playBtn').textContent=playing?'⏸ 정지':'▶ 재생';
  if(playing){ lastTs=performance.now(); requestAnimationFrame(loop); }
}
function loop(ts){
  if(!playing) return;
  S.t=+(S.t+(ts-lastTs)/1000*S.playSpeed).toFixed(4); lastTs=ts;
  updateTimeUI(); draw(); requestAnimationFrame(loop);
}

/* =================================================================
   공통: 글자(아래첨자·줄바꿈), 범례
   ================================================================= */
const SANS="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";
const SERIF="'Times New Roman','Batang',serif";
function rich(str,size,math=false){  // S_1, d_{12} → 아래첨자, math: 영문자 기울임
  const segs=[]; let i=0, buf='';
  while(i<str.length){ const c=str[i];
    if(c==='_' && i+1<str.length){ if(buf){segs.push([0,buf]);buf='';}
      if(str[i+1]==='{'){ const j=str.indexOf('}',i+2), e=j<0?str.length:j; segs.push([1,str.slice(i+2,e)]); i=e+1; }
      else { segs.push([1,str[i+1]]); i+=2; }
    } else { buf+=c; i++; } }
  if(buf) segs.push([0,buf]);
  let out='', sub=false; const dy=(size*0.28).toFixed(1);
  const it=v=> math ? esc(v).replace(/([A-Za-z]+)/g,'<tspan font-style="italic">$1</tspan>') : esc(v);
  segs.forEach(([t,v])=>{
    if(t===1){ out+=`<tspan dy="${dy}" font-size="${(size*0.68).toFixed(1)}">${esc(v)}</tspan>`; sub=true; }
    else { out+=`<tspan${sub?` dy="-${dy}"`:''}>${it(v)}</tspan>`; sub=false; }
  });
  return out;
}
function T2(x,y,str,o={}){
  const size=o.size||+S.fs, family=o.family||SERIF, anchor=o.anchor||'middle';
  const useHalo=(o.halo!==false && S.labelHalo);
  const lines=String(str).split('|'), lh=size*1.15, y0=y-(lines.length-1)*lh/2;
  return lines.map((ln,i)=>{
    const base=`x="${x.toFixed(2)}" y="${(y0+i*lh).toFixed(2)}" font-size="${size}" font-family="${family}" text-anchor="${anchor}"`, inner=rich(ln,size,o.math);
    // 흰 테두리를 글자 전체 아래에 따로 깔아 기울임체 글자가 지워지지 않게 함
    return (useHalo? `<text ${base} fill="#fff" stroke="#fff" stroke-width="${S.haloW}" stroke-linejoin="round">${inner}</text>` : '') + `<text ${base} fill="#000">${inner}</text>`;
  }).join('');
}
function legendSvg(cx,y,size,cw,tw,dash){
  const L=30, a=S.legendCrest||'', b=S.legendTrough||'';
  const w1=L+6+a.length*size, w2=L+6+b.length*size, gap=size*1.2, tot=w1+gap+w2;
  let x=cx-tot/2, o='';
  o+=`<line x1="${x}" y1="${y}" x2="${x+L}" y2="${y}" stroke="#000" stroke-width="${cw}"/>`;
  o+=T2(x+L+6,y+size*0.35,a,{anchor:'start',family:SANS,size,halo:false});
  x+=w1+gap;
  o+=`<line x1="${x}" y1="${y}" x2="${x+L}" y2="${y}" stroke="#000" stroke-width="${tw}" stroke-dasharray="${dash}"/>`;
  o+=T2(x+L+6,y+size*0.35,b,{anchor:'start',family:SANS,size,halo:false});
  return o;
}

/* =================================================================
   1차원 파면(마루·골 선) 그림
   ================================================================= */
function frontPositions(t,a,b){
  const w=2*Math.PI/S.T, ph=S.phi*Math.PI/180, TWO=2*Math.PI;
  const g=x=>phase(x) - S.dir*w*t + ph;
  const N=4000, res={crest:[],trough:[]};
  let x1=a, g1=g(a);
  for(let i=1;i<=N;i++){
    const x2=a+(b-a)*i/N, g2=g(x2), last=i===N;
    if(g2>g1){
      [[Math.PI/2,res.crest],[-Math.PI/2,res.trough]].forEach(([c0,arr])=>{
        for(let n=Math.ceil((g1-c0)/TWO-1e-12); ; n++){
          const c=c0+n*TWO; if(c>g2+1e-12 || (c>=g2-1e-12 && !last)) break;
          arr.push(x1+(c-g1)/(g2-g1)*(x2-x1));
        }
      });
    }
    x1=x2; g1=g2;
  }
  return res;
}
function drawFronts(){
  const s=S, fs=+s.fs, W=+s.W, sw=+s.axisLw;
  // '여러 시각 겹치기'를 켜면 곡선 목록의 시각마다 한 줄씩, 끄면 한 줄만
  const multiRows = s.multi && s.curves.length;
  const times = multiRows ? s.curves.map(c=>+c.p) : [0];
  const rl = multiRows ? s.curves.map(c=>String(c.label||'').trim()) : [];
  const rowLbl=i=> rl[i] ? rl[i] : (times[i]===0 ? 't = 0' : `t = ${fmt(times[i])}초`);
  const lblW=Math.max(...times.map((_,i)=>rowLbl(i).replace(/_\{?|\}/g,'').length))*fs*0.6+12;
  const mL=lblW+10, mR=fs*0.6+10;
  const nameH=s.media.length>1? fs*1.5:0, top=nameH+8;
  const sh=+s.stripH, rowH=sh+fs*1.7+ +s.stripGap;
  const legendH=s.showLegend? fs*2:0;
  const H=Math.ceil(top+times.length*rowH-(+s.stripGap)+legendH+6);
  const pw=W-mL-mR, X=x=>mL+(x-s.xAxMin)/(s.xAxMax-s.xAxMin)*pw;
  GEOM={ scaleX: pw/(s.xAxMax-s.xAxMin), scaleY:1, handles:[], drags:[] };
  const ws=Math.max(+s.waveStart,s.xAxMin), we=Math.min(+s.waveEnd,s.xAxMax);
  const ah=Math.max(9,sw*6);
  let g='', txt='';
  times.forEach((t,r)=>{
    const y0=top+r*rowH, yb=y0+sh;
    // 띠 테두리
    g+=`<rect x="${X(ws)}" y="${y0}" width="${X(we)-X(ws)}" height="${sh}" fill="none" stroke="#777" stroke-width="1" stroke-dasharray="2 2"/>`;
    // 파면
    const fp=frontPositions(t+(+S.t),ws,we);
    fp.crest.forEach(x=>{ g+=`<line x1="${X(x)}" y1="${y0+5}" x2="${X(x)}" y2="${yb-5}" stroke="${s.color}" stroke-width="${s.lw}"/>`; });
    fp.trough.forEach(x=>{ g+=`<line x1="${X(x)}" y1="${y0+5}" x2="${X(x)}" y2="${yb-5}" stroke="${s.color}" stroke-width="${s.lw}" stroke-dasharray="6 4"/>`; });
    if(s.showXAxis!==false){
    // 축
    g+=`<line x1="${X(s.xAxMin)}" y1="${yb}" x2="${X(s.xAxMax)-ah*0.6}" y2="${yb}" stroke="#000" stroke-width="${sw}"/>`;
    g+=arrowHead(X(s.xAxMax),yb,1,0,ah);
    GEOM.handles.push({kind:'x', x:X(s.xAxMax), y:yb});
    if(s.tickStep>0){ const st=+s.tickStep;
      for(let k=Math.ceil((s.xAxMin-1e-9)/st); k*st<=s.tickEnd+1e-9; k++)
        g+=`<line x1="${X(k*st)}" y1="${yb-4}" x2="${X(k*st)}" y2="${yb+4}" stroke="#000" stroke-width="${Math.max(1,sw*0.8)}"/>`; }
    let labels=[];
    if(s.labelMode==='auto' && s.labelStep>0){ const st=+s.labelStep;
      for(let k=Math.ceil((s.xAxMin-1e-9)/st); k*st<=s.tickEnd+1e-9; k++) labels.push(+(k*st).toFixed(6)); }
    else if(s.labelMode==='custom') labels=parseList(s.customLabels);
    labels.forEach(x=>{ txt+=textEl(X(x)+(+s.labelDx||0), yb+fs+3+(+s.labelDy||0), fmt(x), 'middle'); });
    txt+=textEl(X(s.xAxMax)+fs*0.4, yb+fs*1.45, s.xLabel, 'end', s.italicVar);
    }
    txt+=T2(mL-12, y0+sh/2+fs*0.35, rowLbl(r), {anchor:'end', math:true, halo:false});
    // 매질 이름 (첫 줄 위)
    if(r===0 && s.media.length>1) s.media.forEach((m,i)=>{ const [lo,hi]=bounds(i); const a=Math.max(ws,lo), b=Math.min(we,hi);
      const lx=isNum(m.labelX)? +m.labelX : (a+b)/2;
      if(b>a){ txt+=textEl(X(lx), y0-7, m.name, 'middle');
        const w=String(m.name).length*fs*0.95+10;
        GEOM.drags.push({kind:'name', i, lx0:lx, vert:false, box:[X(lx)-w/2, y0-7-fs*1.05, w, fs*1.4]}); } });
  });
  if(s.showLegend) txt+=legendSvg(W/2, H-legendH/2-2, fs, s.lw, s.lw, '6 4');
  document.getElementById('svgWrap').innerHTML =
    `<svg id="waveSvg" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#fff"/>${g}${txt}</svg>`;
  updateInfo();
}

/* =================================================================
   2차원 그리기
   ================================================================= */
const POSOPT=[['u','위'],['d','아래'],['l','왼쪽'],['r','오른쪽'],['ul','왼쪽 위'],['ur','오른쪽 위'],['dl','왼쪽 아래'],['dr','오른쪽 아래']];
function posOff(pos,fs){
  return ({u:[0,-9,'middle'], d:[0,fs+5,'middle'], l:[-8,fs*0.35,'end'], r:[8,fs*0.35,'start'],
    ul:[-5,-7,'end'], ur:[5,-7,'start'], dl:[-5,fs+3,'end'], dr:[5,fs+3,'start']})[pos] || [0,-9,'middle'];
}
const num=(v,d)=>{ const n=parseFloat(v); return isFinite(n)?n:d; };
function resolvePt(str){
  const k=String(str||'').trim(), d=S.d2;
  const p=d.points.find(q=>q.name===k) || d.sources.find(q=>q.type==='point' && q.name===k);
  if(p) return [+p.x,+p.y];
  const m=k.split(',').map(Number); if(m.length===2 && m.every(isFinite)) return m;
  return null;
}
let FREEZE2D=null, LAST2D=null, D2DRAG=null, PTMODE=false;
const PT_NAMES=['P','Q','R','A','B','C','D','E','F','G','H','K','L','M','N'];
function nextPtName(){ const used=new Set(S.d2.points.map(p=>p.name)); return PT_NAMES.find(c=>!used.has(c)) || ('P_'+(S.d2.points.length+1)); }
function togglePtMode(on){
  PTMODE = on===undefined ? !PTMODE : on;
  document.getElementById('ptModeBtn').classList.toggle('on',PTMODE);
  document.body.classList.toggle('ptmode',PTMODE);
  if(!PTMODE) renderHover(HOV=null);
  draw();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && PTMODE) togglePtMode(false); });
/* 점 찍을 때 붙는 위치: 파면(마루·골)끼리의 교차점 → 격자 교차점 → 0.05 단위 */
function frontCurves(){
  const d=S.d2, out=[], rx0=+d.rx0, rx1=+d.rx1, ry0=+d.ry0, ry1=+d.ry1;
  const corners=[[rx0,ry0],[rx0,ry1],[rx1,ry0],[rx1,ry1]];
  d.sources.forEach(q=>{
    const lam=num(q.lambda,0); if(!(lam>0)) return;
    const base=num(q.r0,0)+lam/S.T*S.t, rmin=num(q.rmin,0);
    const offs=[]; if(d.showCrest) offs.push([0,'마루']); if(d.showTrough) offs.push([lam/2,'골']);
    if(q.type==='point'){
      const rmax=Math.min(num(q.rmax,Infinity), Math.max(...corners.map(([cx,cy])=>Math.hypot(cx-q.x,cy-q.y)))+lam);
      offs.forEach(([o,k])=>{ for(let n=Math.ceil((rmin-base-o)/lam-1e-9);;n++){ const r=base+o+n*lam; if(r>rmax+1e-9) break; if(r>1e-9) out.push({t:'c',cx:+q.x,cy:+q.y,r,k}); } });
    } else {
      const a=q.angle*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a), h=num(q.width,6)/2;
      const rmax=Math.min(num(q.rmax,Infinity), Math.max(...corners.map(([cx,cy])=>(cx-q.x)*ux+(cy-q.y)*uy))+lam);
      offs.forEach(([o,k])=>{ for(let n=Math.ceil((rmin-base-o)/lam-1e-9);;n++){ const r=base+o+n*lam; if(r>rmax+1e-9) break; if(r>=0) out.push({t:'l',px:+q.x+ux*r,py:+q.y+uy*r,dx:-uy,dy:ux,h,k}); } });
    }
  });
  return out;
}
function intersect(A,B){
  const P=[];
  if(A.t==='c'&&B.t==='c'){
    const dx=B.cx-A.cx, dy=B.cy-A.cy, D=Math.hypot(dx,dy); if(D<1e-9||D>A.r+B.r||D<Math.abs(A.r-B.r)) return P;
    const a=(A.r*A.r-B.r*B.r+D*D)/(2*D), hh=Math.sqrt(Math.max(0,A.r*A.r-a*a)), mx=A.cx+a*dx/D, my=A.cy+a*dy/D;
    P.push([mx+hh*dy/D, my-hh*dx/D],[mx-hh*dy/D, my+hh*dx/D]);
  } else if(A.t==='l'&&B.t==='l'){
    const det=A.dx*(-B.dy)-A.dy*(-B.dx); if(Math.abs(det)<1e-9) return P;
    const bx=B.px-A.px, by=B.py-A.py, s=(bx*(-B.dy)-by*(-B.dx))/det, u=(A.dx*by-A.dy*bx)/det;
    if(Math.abs(s)<=A.h+1e-9 && Math.abs(u)<=B.h+1e-9) P.push([A.px+A.dx*s, A.py+A.dy*s]);
  } else {
    const C=A.t==='c'?A:B, L=A.t==='c'?B:A;
    const fx=L.px-C.cx, fy=L.py-C.cy, b=fx*L.dx+fy*L.dy, c=fx*fx+fy*fy-C.r*C.r, disc=b*b-c;
    if(disc<0) return P;
    [-b+Math.sqrt(disc), -b-Math.sqrt(disc)].forEach(s=>{ if(Math.abs(s)<=L.h+1e-9) P.push([L.px+L.dx*s, L.py+L.dy*s]); });
  }
  return P;
}
function snapPoint2D(x,y,sc){
  const tol=10/sc, F=frontCurves(); let best=null;
  for(let i=0;i<F.length;i++) for(let j=i+1;j<F.length;j++){
    intersect(F[i],F[j]).forEach(([px,py])=>{ const dd=Math.hypot(px-x,py-y);
      if(dd<tol && (!best||dd<best.d)) best={d:dd,x:px,y:py,k:F[i].k===F[j].k? `${F[i].k}+${F[j].k} 교차점` : '마루+골 교차점'}; });
  }
  if(best) return [+best.x.toFixed(3), +best.y.toFixed(3), best.k];
  const d=S.d2;
  if(d.grid && d.gridStep>0){ const g=+d.gridStep, gx=Math.round(x/g)*g, gy=Math.round(y/g)*g;
    if(Math.hypot(gx-x,gy-y)<7/sc) return [+gx.toFixed(3), +gy.toFixed(3), '격자 교차점']; }
  return [+(Math.round(x/0.05)*0.05).toFixed(3), +(Math.round(y/0.05)*0.05).toFixed(3), ''];
}
function draw2D(){
  GEOM=null;
  const d=S.d2, fs=+S.fs, sc=num(d.scale,40);
  const rx0=+d.rx0, rx1=+d.rx1, ry0=+d.ry0, ry1=+d.ry1;
  let bx0=rx0,bx1=rx1,by0=ry0,by1=ry1;
  const inc=(x,y)=>{ if(!isFinite(x)||!isFinite(y)) return; bx0=Math.min(bx0,x);bx1=Math.max(bx1,x);by0=Math.min(by0,y);by1=Math.max(by1,y); };
  d.points.forEach(p=>inc(+p.x,+p.y));
  d.dims.forEach(m=>{inc(+m.x1,+m.y1);inc(+m.x2,+m.y2);});
  d.texts.forEach(t=>inc(+t.x,+t.y));
  d.sources.forEach(q=>{ if(q.type==='point'){ if(q.showDot) inc(+q.x,+q.y); }
    else if(q.bar){ const a=q.angle*Math.PI/180, px=-Math.sin(a), py=Math.cos(a), h=q.width/2;
      inc(+q.x+px*h,+q.y+py*h); inc(+q.x-px*h,+q.y-py*h);
      if(q.barText){ const ls=String(q.barText).split('|'), nl=ls.length, dd=fs*(0.9+0.6*nl)/sc, ux=Math.cos(a), uy=Math.sin(a);
        const cx=+q.x-ux*dd, cy=+q.y-uy*dd, hw=Math.max(...ls.map(l=>l.length))*fs*0.55/sc, hh=(nl*fs*1.15/2+4)/sc;
        inc(cx-hw,cy-hh); inc(cx+hw,cy+hh); } } });
  // 끄는 동안에는 그림 범위를 고정해서 끌던 대상이 마우스를 따라오게 함
  if(FREEZE2D){ ({bx0,bx1,by0,by1}=FREEZE2D); } else LAST2D={bx0,bx1,by0,by1};
  const pad=fs*1.5+12, legendH=S.showLegend? fs*1.6:0;
  const W=Math.ceil((bx1-bx0)*sc+2*pad), H=Math.ceil((by1-by0)*sc+2*pad+legendH);
  const X=x=>pad+(x-bx0)*sc, Y=y=>pad+(by1-y)*sc;
  GEOM={ handles:[], drags:[], sc, d2map:{ xOf:px=>bx0+(px-pad)/sc, yOf:py=>by1-(py-pad)/sc, X, Y } };
  // 끌 수 있는 대상: 파원, 평면파 막대(중심·끝), 점, 글자, 치수선(양 끝·가운데)
  const D=(kind,ref,cx,cy,w=20,h=20,extra={})=>GEOM.drags.push(Object.assign({kind, d2:true, ref, box:[cx-w/2,cy-h/2,w,h]},extra));
  d.sources.forEach((q,i)=>{
    if(q.type==='point') D('src',q,X(q.x),Y(q.y));
    else { const a=q.angle*Math.PI/180, px=-Math.sin(a), py=Math.cos(a), h=num(q.width,6)/2;
      D('src',q,X(q.x),Y(q.y),22,22);
      D('rot',q,X(+q.x+px*h),Y(+q.y+py*h),18,18); }
  });
  d.points.forEach(p=>D('pt',p,X(p.x),Y(p.y)));
  d.texts.forEach(t=>{ const size=num(t.size,fs), w=Math.max(...String(t.text).split('|').map(l=>l.length))*size*0.8+10; D('txt',t,X(t.x),Y(t.y),w,size*1.4*String(t.text).split('|').length); });
  d.dims.forEach(m=>{ D('dim1',m,X(m.x1),Y(m.y1),16,16); D('dim2',m,X(m.x2),Y(m.y2),16,16);
    D('dimm',m,(X(m.x1)+X(m.x2))/2,(Y(m.y1)+Y(m.y2))/2,22,22); });
  let g='', fr='', txt='', bg='';
  const cw=num(d.crestW,2), tw=num(d.troughW,2), dash='7 5';

  // 격자
  if(d.grid && d.gridStep>0){ const st=+d.gridStep, gl=`stroke="#888" stroke-width="0.9" stroke-dasharray="1.5 3"`;
    for(let k=Math.ceil((rx0-1e-9)/st); k*st<=rx1+1e-9; k++) bg+=`<line x1="${X(k*st)}" y1="${Y(ry0)}" x2="${X(k*st)}" y2="${Y(ry1)}" ${gl}/>`;
    for(let k=Math.ceil((ry0-1e-9)/st); k*st<=ry1+1e-9; k++) bg+=`<line x1="${X(rx0)}" y1="${Y(k*st)}" x2="${X(rx1)}" y2="${Y(k*st)}" ${gl}/>`; }
  if(d.border) bg+=`<rect x="${X(rx0)}" y="${Y(ry1)}" width="${(rx1-rx0)*sc}" height="${(ry1-ry0)*sc}" fill="none" stroke="#000" stroke-width="1"/>`;

  // 파면
  const corners=[[rx0,ry0],[rx0,ry1],[rx1,ry0],[rx1,ry1]];
  d.sources.forEach(q=>{
    const lam=num(q.lambda,0); if(!(lam>0)) return;
    const v=lam/S.T, base=num(q.r0,0)+v*S.t, rmin=num(q.rmin,0);
    const sets=[]; if(d.showCrest) sets.push([0,cw,'']); if(d.showTrough) sets.push([lam/2,tw,dash]);
    if(q.type==='point'){
      const far=Math.max(...corners.map(([cx,cy])=>Math.hypot(cx-q.x,cy-q.y)));
      const rmax=Math.min(num(q.rmax,Infinity), far+lam);
      sets.forEach(([off,w,da])=>{
        for(let n=Math.ceil((rmin-base-off)/lam-1e-9); ; n++){ const r=base+off+n*lam; if(r>rmax+1e-9) break; if(r<=1e-9) continue;
          fr+=`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="${(r*sc).toFixed(2)}" fill="none" stroke="#000" stroke-width="${w}"${da?` stroke-dasharray="${da}"`:''}/>`; } });
    } else {
      const a=q.angle*Math.PI/180, ux=Math.cos(a), uy=Math.sin(a), px=-uy, py=ux, h=num(q.width,6)/2;
      const far=Math.max(...corners.map(([cx,cy])=>(cx-q.x)*ux+(cy-q.y)*uy));
      const rmax=Math.min(num(q.rmax,Infinity), far+lam);
      sets.forEach(([off,w,da])=>{
        for(let n=Math.ceil((rmin-base-off)/lam-1e-9); ; n++){ const r=base+off+n*lam; if(r>rmax+1e-9) break; if(r<0) continue;
          const cx=+q.x+ux*r, cy=+q.y+uy*r;
          fr+=`<line x1="${X(cx+px*h)}" y1="${Y(cy+py*h)}" x2="${X(cx-px*h)}" y2="${Y(cy-py*h)}" stroke="#000" stroke-width="${w}"${da?` stroke-dasharray="${da}"`:''}/>`; } });
      if(q.bar){
        g+=`<line x1="${X(+q.x+px*h)}" y1="${Y(+q.y+py*h)}" x2="${X(+q.x-px*h)}" y2="${Y(+q.y-py*h)}" stroke="#999" stroke-width="9"/>`;
        if(q.barText){ const nl=String(q.barText).split('|').length, dd=fs*(0.9+0.6*nl);
          txt+=T2(X(q.x)-ux*dd, Y(q.y)+uy*dd+fs*0.35, q.barText, {family:SANS}); }
      }
    }
  });
  const clip=`<clipPath id="clip2d"><rect x="${X(rx0)}" y="${Y(ry1)}" width="${(rx1-rx0)*sc}" height="${(ry1-ry0)*sc}"/></clipPath>`;

  // 선분
  d.segs.forEach(sg=>{ const a=resolvePt(sg.from), b=resolvePt(sg.to); if(!a||!b) return;
    g+=`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="#000" stroke-width="${num(sg.w,2.5)}"${sg.dash?' stroke-dasharray="6 4"':''}/>`; });

  // 치수선
  d.dims.forEach(m=>{
    const x1=X(+m.x1), y1=Y(+m.y1), x2=X(+m.x2), y2=Y(+m.y2), L=Math.hypot(x2-x1,y2-y1); if(L<1) return;
    const ux=(x2-x1)/L, uy=(y2-y1)/L, nx=-uy, ny=ux, ahs=8;
    const arrows=m.ends==='arrow'||m.ends==='arrowbar', bars=m.ends==='bar'||m.ends==='arrowbar';
    const s1=arrows?ahs*0.6:0;
    g+=`<line x1="${x1+ux*s1}" y1="${y1+uy*s1}" x2="${x2-ux*s1}" y2="${y2-uy*s1}" stroke="#000" stroke-width="1.2"/>`;
    if(arrows){ g+=arrowHead(x1,y1,-ux,-uy,ahs); g+=arrowHead(x2,y2,ux,uy,ahs); }
    if(bars){ const b=7; [[x1,y1],[x2,y2]].forEach(([x,y])=>{ g+=`<line x1="${x+nx*b}" y1="${y+ny*b}" x2="${x-nx*b}" y2="${y-ny*b}" stroke="#000" stroke-width="1.2"/>`; }); }
    const off=num(m.off,12), mx=(x1+x2)/2+nx*off, my=(y1+y2)/2+ny*off;
    const sgn=Math.sign(off)||1, ex=nx*sgn, ey=ny*sgn;
    let anchor='middle', by=my+fs*0.35;
    if(Math.abs(ex)>Math.abs(ey)) anchor= ex>0?'start':'end';
    else by = ey>0 ? my+fs*0.75 : my;
    txt+=T2(mx,by,m.label,{anchor});
  });

  // 파원 점·이름
  d.sources.forEach(q=>{ if(q.type!=='point'||!q.showDot) return;
    g+=`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="3.8" fill="#000"/>`;
    if(q.name){ const [dx,dy,an]=posOff(q.pos,fs); txt+=T2(X(q.x)+dx,Y(q.y)+dy,q.name,{anchor:an}); } });
  // 점
  d.points.forEach(p=>{ if(p.dot) g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3.8" fill="#000"/>`;
    if(p.name){ const [dx,dy,an]=posOff(p.pos,fs); txt+=T2(X(p.x)+dx,Y(p.y)+dy,p.name,{anchor:an}); } });
  // 글자
  d.texts.forEach(t=>{ const size=num(t.size,fs); txt+=T2(X(t.x),Y(t.y)+size*0.35,t.text,{size,family:t.family==='sans'?SANS:SERIF}); });
  // 범례
  if(S.showLegend) txt+=legendSvg(W/2, H-pad*0.5-legendH*0.45, fs, cw, tw, dash);

  document.getElementById('svgWrap').innerHTML =
    `<svg id="waveSvg" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>${clip}</defs><rect width="100%" height="100%" fill="#fff"/>${bg}<g clip-path="url(#clip2d)">${fr}</g>${g}${txt}</svg>`;
  updateInfo();
}
const plain=s=>String(s).replace(/_\{([^}]*)\}/g,'$1').replace(/_(.)/g,'$1');
function info2D(){
  const d=S.d2;
  let h=`T = ${fmt(S.T)} s, f = ${fmt(1/S.T)} Hz, t = ${fmt(S.t)} s<br>`;
  const ps=d.sources.filter(q=>q.type==='point');
  d.sources.forEach((q,i)=>{ h+=`${q.type==='point'?esc(plain(q.name)||'점파원'):'평면파 '+(i+1)}: λ = ${fmt(q.lambda)}, v = ${fmt(q.lambda/S.T)}<br>`; });
  if(ps.length){
    d.points.forEach(p=>{
      const ds=ps.map(q=>Math.hypot(p.x-q.x,p.y-q.y));
      h+=`<b>${esc(plain(p.name))}</b>: `+ds.map((r,i)=>`${esc(plain(ps[i].name))}까지 ${fmt(r)}`).join(', ');
      if(ds.length===2){ const dr=Math.abs(ds[0]-ds[1]), lam=+ps[0].lambda;
        h+=`, 경로차 ${fmt(dr)}`+(ps[0].lambda==ps[1].lambda && lam>0? ` (= ${fmt(dr/lam)}λ)`:''); }
      h+='<br>';
    });
  }
  document.getElementById('info').innerHTML=h;
}

/* ---------- 2차원 목록 편집 ---------- */
function fieldHtml(f){
  if(f.type==='select') return `<select data-k="${f.k}">${f.options.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>`;
  if(f.type==='check') return `<input type="checkbox" data-k="${f.k}">`;
  return `<input type="${f.type==='text'?'text':'number'}" data-k="${f.k}" step="${f.step||0.5}"${f.blank?' placeholder="끝까지"':''}>`;
}
function listEditor(boxId, arr, fieldsFn, titleFn, rer=render2DLists){
  const box=document.getElementById(boxId); box.innerHTML='';
  arr.forEach((it,i)=>{
    const fields=fieldsFn(it), div=document.createElement('div'); div.className='medium';
    div.innerHTML=`<div class="head"><b style="font-size:12px">${titleFn(it,i)}</b><button data-del style="padding:2px 8px">삭제</button></div>
      <div class="grid2">${fields.map(f=>`<label class="fl"><span>${f.label}</span>${fieldHtml(f)}</label>`).join('')}</div>`;
    div.querySelectorAll('[data-k]').forEach(inp=>{
      const f=fields.find(ff=>ff.k===inp.dataset.k);
      if(inp.type==='checkbox') inp.checked=!!it[f.k]; else inp.value=(it[f.k]??'');
      const ev=(inp.tagName==='SELECT'||inp.type==='checkbox')?'change':'input';
      inp.addEventListener(ev,()=>{
        let v;
        if(inp.type==='checkbox') v=inp.checked;
        else if(f.type==='number'){ if(inp.value==='' && f.blank) v=''; else { v=parseFloat(inp.value); if(!isFinite(v)) return; if(f.pos && v<=0) return; } }
        else v=inp.value;
        it[f.k]=v;
        if(f.k==='type' && v==='plane'){ // 평면파로 바꾸면 진행 방향이 영역 가운데를 향하도록
          const dd=S.d2, cx=(+dd.rx0+ +dd.rx1)/2-it.x, cy=(+dd.ry0+ +dd.ry1)/2-it.y;
          if(Math.hypot(cx,cy)>1e-6) it.angle=Math.round(Math.atan2(cy,cx)*180/Math.PI/5)*5;
          if(!(+it.rmin<1)) it.rmin=0.5; }
        if(f.rerender) rer(); draw();
      });
    });
    div.querySelector('[data-del]').onclick=()=>{ arr.splice(i,1); rer(); draw(); };
    box.appendChild(div);
  });
}
function render2DLists(){
  const d=S.d2;
  listEditor('srcList', d.sources, it=> it.type==='point' ? [
      {k:'type',label:'종류',type:'select',options:[['point','점파원'],['plane','평면파']],rerender:true},
      {k:'name',label:'이름',type:'text'},
      {k:'x',label:'x',type:'number'},{k:'y',label:'y',type:'number'},
      {k:'lambda',label:'파장 λ',type:'number',pos:true},{k:'r0',label:'첫 마루',type:'number',step:0.25},
      {k:'rmin',label:'최소 r',type:'number'},{k:'rmax',label:'최대 r',type:'number',blank:true},
      {k:'showDot',label:'점 표시',type:'check'},{k:'pos',label:'이름 위치',type:'select',options:POSOPT},
    ] : [
      {k:'type',label:'종류',type:'select',options:[['point','점파원'],['plane','평면파']],rerender:true},
      {k:'angle',label:'방향(°)',type:'number',step:15},
      {k:'x',label:'장치 x',type:'number'},{k:'y',label:'장치 y',type:'number'},
      {k:'lambda',label:'파장 λ',type:'number',pos:true},{k:'r0',label:'첫 마루',type:'number',step:0.25},
      {k:'rmin',label:'최소 거리',type:'number'},{k:'rmax',label:'최대 거리',type:'number',blank:true},
      {k:'width',label:'파면 길이',type:'number'},{k:'bar',label:'장치 표시',type:'check'},
      {k:'barText',label:'장치 글자',type:'text'},
    ], (it,i)=> it.type==='point' ? `점파원 ${esc(plain(it.name))}` : `평면파 ${i+1}`);
  listEditor('ptList', d.points, ()=>[
      {k:'name',label:'이름',type:'text'},{k:'pos',label:'이름 위치',type:'select',options:POSOPT},
      {k:'x',label:'x',type:'number',step:0.25},{k:'y',label:'y',type:'number',step:0.25},
      {k:'dot',label:'점 표시',type:'check'},
    ], it=>`점 ${esc(plain(it.name))}`);
  listEditor('segList', d.segs, ()=>[
      {k:'from',label:'시작',type:'text'},{k:'to',label:'끝',type:'text'},
      {k:'w',label:'굵기',type:'number',step:0.5},{k:'dash',label:'점선',type:'check'},
    ], (it,i)=>`선분 ${i+1}`);
  listEditor('dimList', d.dims, ()=>[
      {k:'x1',label:'x₁',type:'number',step:0.25},{k:'y1',label:'y₁',type:'number',step:0.25},
      {k:'x2',label:'x₂',type:'number',step:0.25},{k:'y2',label:'y₂',type:'number',step:0.25},
      {k:'label',label:'글자',type:'text'},{k:'off',label:'글자 거리',type:'number',step:2},
      {k:'ends',label:'끝 모양',type:'select',options:[['arrowbar','화살표+막대'],['arrow','화살표'],['bar','막대']]},
    ], (it,i)=>`치수선 ${i+1}`);
  listEditor('txtList', d.texts, ()=>[
      {k:'text',label:'글자',type:'text'},{k:'size',label:'크기',type:'number',step:1},
      {k:'x',label:'x',type:'number',step:0.25},{k:'y',label:'y',type:'number',step:0.25},
      {k:'family',label:'글꼴',type:'select',options:[['serif','명조'],['sans','고딕']]},
    ], (it,i)=>`글자 ${i+1}`);
}
function renderCurves(){
  const t=S.hMode==='t';
  listEditor('curveList', S.curves, ()=>[
      {k:'p', label: t?'위치 x':'시각 t', type:'number', step:0.05},
      {k:'dash', label:'선 모양', type:'select', options:[['solid','실선'],['dashed','점선'],['dotted','촘촘한 점선']]},
      {k:'label', label:'범례 글자', type:'text'},
    ], (it,i)=>`곡선 ${i+1}`, renderCurves);
  document.getElementById('curveUnit').textContent = t? '값은 관찰 위치 x(m)입니다.' : '값은 시각 t(s)입니다.';
}
function addCurve(){
  const t=S.hMode==='t', n=S.curves.length;
  const dashes=['solid','dashed','dotted'];
  if(t) S.curves.push({p:n===0?0:+(n*0.5).toFixed(2), dash:dashes[n%3], label:n===0?'x=0':`x=x_${n}`});
  else S.curves.push({p:n===0?0:+(S.T*0.25*n).toFixed(4), dash:dashes[n%3], label:n===0?'t=0':`t=t_${n===1?0:n-1}`});
  S.multi=true; syncInputs(); renderCurves(); draw();
}
function add2D(kind){
  const d=S.d2, cx=(+d.rx0+ +d.rx1)/2, cy=(+d.ry0+ +d.ry1)/2;
  if(kind==='src'){ const n=d.sources.filter(q=>q.type==='point').length+1;
    d.sources.push({type:'point', name:'S_'+n, x:cx, y:cy, lambda:2, r0:0, rmin:0.5, rmax:'', showDot:true, pos:'d', angle:-90, width:8, bar:true, barText:'물결파|발생 장치'}); }
  if(kind==='plane') d.sources.push({type:'plane', name:'', x:cx, y:+d.ry1, lambda:2, r0:0, rmin:0.5, rmax:'', showDot:false, pos:'d', angle:-90, width:8, bar:true, barText:'물결파|발생 장치'});
  if(kind==='pt'){ const nm=nextPtName();
    d.points.push({name:nm, x:cx, y:cy, pos:'ul', dot:true}); }
  if(kind==='seg') d.segs.push({from:d.points[0]?.name||'0,0', to:d.points[1]?.name||'1,1', w:2.5, dash:false});
  if(kind==='dim') d.dims.push({x1:+d.rx1-1, y1:+d.ry0-0.4, x2:+d.rx1, y2:+d.ry0-0.4, label:'1 m', ends:'arrowbar', off:12});
  if(kind==='txt') d.texts.push({text:'(가)', size:+S.fs, x:cx, y:+d.ry0-1, family:'serif'});
  render2DLists(); draw();
}
document.querySelectorAll('[data-k2]').forEach(el=>{
  const ev=(el.tagName==='SELECT'||el.type==='checkbox')?'change':'input';
  el.addEventListener(ev,()=>{ let v;
    if(el.type==='checkbox') v=el.checked; else if(el.type==='number'){ v=parseFloat(el.value); if(!isFinite(v)) return; } else v=el.value;
    S.d2[el.dataset.k2]=v; draw(); });
});
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
  const sel=document.getElementById(b.parentElement.dataset.for);
  if(sel.value===b.dataset.v) return;
  sel.value=b.dataset.v; sel.dispatchEvent(new Event('change'));
  applyModeUI();   // 선택된 버튼 색 갱신
}));
document.getElementById('dimSel').addEventListener('change',e=>{ if(PTMODE && e.target.value!=='2d') togglePtMode(false); S.dim=e.target.value; syncInputs(); draw(); });
document.querySelector('[data-key=style1d]').addEventListener('change',()=>applyModeUI());
document.querySelector('[data-key=labelMode]').addEventListener('change',()=>applyModeUI());
// 반대 방향 파동을 켜면 합성파(최대 A1+A2)가 잘리지 않게 세로축 범위를 넓힘
function fitY2(){
  if(!S.w2on) return;
  const Amax=Math.max(...mediumAmps())+Math.max(...mediumAmps(-S.dir));
  if(S.yMax < Amax*1.15 || S.yMin > -Amax*1.15){
    S.yMax=+(Math.max(S.yMax, Amax*1.3)).toFixed(2); S.yMin=+(Math.min(S.yMin, -Amax*1.2)).toFixed(2);
    syncInputs(); draw();
  }
}
document.querySelector('[data-key=multi]').addEventListener('change',()=>{ if(S.multi && !S.curves.length){ addCurve(); addCurve(); } });


syncInputs(); renderMedia(); render2DLists(); renderCurves(); draw();
</script>
</body>
</html>

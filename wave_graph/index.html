<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>파동 그림 그리기</title>
<style>
  :root { --panel:#f6f7f9; --line:#dfe2e7; --accent:#2b6cb0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:#222; background:#fff; display:flex; height:100vh; overflow:hidden; }
  #panel { width:390px; min-width:390px; height:100vh; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); padding:12px 12px 40px; font-size:13px; }
  #right { flex:1; display:flex; flex-direction:column; min-width:0; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; background:#fff; padding:20px; }
  #timebar { border-top:1px solid var(--line); background:var(--panel); padding:8px 14px; font-size:13px; }
  #timebar:empty, #timebar.off { display:none; }
  .trow { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:3px 0; }
  .trow .tl { font-weight:bold; margin-right:2px; }
  .trow input[type=range] { flex:1; min-width:160px; }
  .sep { width:1px; height:22px; background:#cfd3d9; margin:0 4px; }
  .hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  h1 { font-size:16px; margin:0; }
  details { background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; }
  summary { cursor:pointer; padding:8px 10px; font-weight:bold; user-select:none; }
  details.sub { border:none; border-top:1px dashed var(--line); border-radius:0; margin:8px 0 0; }
  details.sub summary { padding:6px 0; font-weight:normal; color:#2b6cb0; font-size:12.5px; }
  .sec { padding:2px 10px 10px; }
  .row { display:flex; align-items:center; gap:6px; margin:5px 0; flex-wrap:wrap; }
  .row > label:first-child:not(.ck) { min-width:104px; color:#444; }
  label.ck { color:#333; display:inline-flex; align-items:center; gap:4px; }
  label.sl { color:#444; margin-left:6px; }
  input[type=number], input[type=text], select { padding:3px 5px; border:1px solid #c5c9d0; border-radius:4px; font-size:13px; font-family:inherit; background:#fff; }
  input[type=number] { width:70px; }
  input[type=text] { width:170px; }
  input.s { width:58px !important; } input.xs { width:44px !important; } input.m { width:96px !important; }
  .unit { color:#777; font-size:12px; }
  button { font-family:inherit; font-size:13px; padding:4px 9px; border:1px solid #b9bec7; background:#fff; border-radius:5px; cursor:pointer; }
  button:hover { background:#eef3fa; }
  .tip { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:#dfe6ef; color:#3d5a80; font-size:11px; font-weight:bold; cursor:help; vertical-align:middle; }
  .medium { border:1px solid #e3e6ea; border-radius:6px; padding:6px 8px; margin:6px 0; background:#fafbfc; }
  .medium .head { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .hint { color:#777; font-size:11.5px; line-height:1.45; margin:4px 0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; margin-top:4px; }
  .fl { display:flex; align-items:center; gap:4px; color:#555; font-size:12px; }
  .fl > span { min-width:50px; }
  .fl input[type=number] { width:64px; } .fl input[type=text] { width:88px; } .fl select { max-width:96px; }
  .seg { display:flex; flex:1; border:1px solid #b9bec7; border-radius:6px; overflow:hidden; }
  .seg button { flex:1; border:none; border-radius:0; padding:6px 8px; background:#fff; color:#333; }
  .seg button + button { border-left:1px solid #b9bec7; }
  .seg button.on { background:var(--accent); color:#fff; font-weight:bold; }
  .seg button:not(.on):hover { background:#eef3fa; }
  .topbox { background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin:0 0 8px; }
  .topbox .row > label:first-child { min-width:52px; font-weight:bold; }
  #info { font-size:12px; line-height:1.6; }
  #waveImg { display:block; max-width:none; }
  #svgWrap { position:relative; line-height:0; }
  #stage.dragging { justify-content:flex-start; align-items:flex-start; }
  svg.pv { position:absolute; left:0; top:0; pointer-events:none; z-index:3; overflow:visible; }
  .pvtip { position:absolute; z-index:6; pointer-events:none; background:rgba(30,40,55,.62); color:#fff; font-size:12px; line-height:1.3; padding:3px 7px; border-radius:5px; white-space:nowrap; }
  .ah { position:absolute; width:24px; height:24px; border-radius:50%; z-index:5; touch-action:none; }
  .ah.hx { cursor:ew-resize; } .ah.hy { cursor:ns-resize; }
  #stage:hover .ah { background:rgba(43,108,176,.13); outline:1.5px dashed rgba(43,108,176,.55); }
  .ah:hover, .ah.active { background:rgba(43,108,176,.28) !important; }
  .dg { position:absolute; z-index:4; cursor:move; border-radius:4px; touch-action:none; }
  .dg.tip { cursor:ew-resize; border-radius:50%; z-index:5; }
  #stage:hover .dg { outline:1px dashed rgba(43,108,176,.45); }
  .dg.pt2 { border-radius:50%; } .dg.rot { cursor:grab; }
  body.ptmode #svgWrap { cursor:crosshair !important; }
  .dg.delpt { cursor:pointer; } .dg.delpt:hover { background:rgba(210,50,50,.25) !important; outline-color:#d33 !important; }
  .dg:hover { background:rgba(43,108,176,.10); } .dg.tip:hover { background:rgba(43,108,176,.25); }
  #topbar { border-bottom:1px solid var(--line); background:var(--panel); padding:6px 14px; font-size:13px; }
  #topbar .trow { gap:8px 12px; margin:4px 0; }
  #topbar .seg { flex:none; }
  #topbar .seg button { padding:5px 12px; white-space:nowrap; }
  #topbar button { white-space:nowrap; }
  .tgroup { display:flex; align-items:center; gap:6px; }
  .grow { flex:1; }
  .q { display:flex; align-items:center; gap:6px; flex:0 1 250px; min-width:200px; }
  .q .nf { min-width:100px; }
  .ql { font-size:12px; color:#444; white-space:nowrap; }
  .chip { border-radius:14px; padding:3px 11px; font-size:12px; color:#555; }
  #w2Bar { border-top:1px dashed var(--line); padding-top:6px; }
  .w2title { font-weight:bold; color:#234; }
  .chip.on { background:#e3eefb; border-color:var(--accent); color:var(--accent); font-weight:bold; }
  body.nopanel #panel { display:none; }
  #panelBtn.on { background:#e3eefb; border-color:var(--accent); color:var(--accent); }
  /* 슬라이더 + 값 (정확한 숫자칸은 접힘) */
  .nf { display:inline-flex; align-items:center; gap:5px; flex:1 1 130px; min-width:110px; }
  .nf input[type=range] { flex:1; min-width:60px; height:18px; margin:0; accent-color:var(--accent); }
  .nf .val { min-width:42px; padding:1px 6px; font-size:12px; border:1px solid transparent; border-bottom:1px dashed #9aa4b1; border-radius:3px; background:none; color:#234; text-align:right; cursor:text; }
  .nf .val:hover { background:#eef3fa; border-color:#c5d3e4; }
  .nf input[type=number] { display:none; width:66px !important; }
  .nf.edit input[type=number] { display:inline-block; }
  .nf.edit .val { display:none; }
  .fl:has(.nf) { grid-column:1/-1; }
  .fl.ro b { font-weight:normal; color:#234; } .fl .nf { min-width:0; flex:1 1 auto; }
  .fl > span { min-width:64px; }
  .fl .nf .val { min-width:34px; }
  #panel { width:420px; min-width:420px; }
</style>
</head>
<body class="nopanel">
<div id="panel">
  <div class="hdr">
    <h1>⚙ 세부 설정</h1>
    <button onclick="togglePanel(false)" title="세부 설정 닫기">✕</button>
  </div>

  <details open class="only1d">
    <summary>파동</summary>
    <div class="sec">
      <div class="row"><label>진동수 f (Hz)</label><input type="number" id="f" step="0.1"></div>
    </div>
  </details>

  <!-- ===================== 1차원 ===================== -->
  <details open class="only1d">
    <summary>매질 <span class="tip" title="매질마다 속력만 정하면 파장은 주기에 맞춰 λ = vT로 자동 계산됩니다.&#10;경계의 반사 계수는 속력으로 자동 계산됩니다: r = (v투과 − v입사) / (v입사 + v투과) (줄의 경우).&#10;r = 반사파 진폭 ÷ 입사파 진폭, 투과파 진폭 = (1 + r) × 입사파 진폭입니다.&#10;느린 매질로 입사하면 r < 0 → 고정단 반사(반사파가 뒤집힘), 빠른 매질로 입사하면 r > 0 → 자유단 반사(반사파가 그대로)입니다.&#10;매질을 2개 이상 두면 매질 이름과 경계 점선이 자동으로 표시됩니다.&#10;'경계 x'는 그 매질이 끝나는 위치입니다.&#10;진동수는 모든 매질에서 같고, 경계에서 파동은 끊기지 않습니다.">?</span></summary>
    <div class="sec">
      <div id="mediaList"></div>
      <div class="row"><button onclick="addMedium()">+ 매질 추가</button></div>
      <div class="row"><label>반사파</label>
        <select data-key="reflShow"><option value="sum">입사파와 합쳐서</option><option value="both">합성파 + 반사파 점선</option><option value="sep">따로 (가는 점선)</option><option value="none">그리지 않음 (진폭만 반영)</option></select></div>
      <div class="hint">매질 이름은 그림에서 끌어서 옮깁니다.</div>
      <div class="hint" id="tModeMediaHint" style="display:none">t축 그래프는 관찰 위치가 속한 매질의 진폭으로 그립니다.</div>
    </div>
  </details>

  <details open id="frontSec">
    <summary>파면 그림 <span class="tip" title="마루는 실선·골은 점선 세로선으로 그립니다.&#10;여러 시각을 줄마다 그리려면 '여러 시각 겹치기'를 켜고 곡선 목록에 시각과 줄 이름을 넣으세요.&#10;띠는 '파동 시작 x'부터 가로축 화살표 근처까지 그려집니다.&#10;재생하거나 시간을 넘기면 모든 줄이 함께 움직입니다.">?</span></summary>
    <div class="sec">
      <div class="row"><label>띠 높이 (px)</label><input type="number" data-key="stripH" step="2"></div>
      <div class="row"><label>줄 간격 (px)</label><input type="number" data-key="stripGap" step="2"></div>
      <div class="row"><label class="ck"><input type="checkbox" data-key="showLegend"> 범례</label>
        <input type="text" data-key="legendCrest" class="s"><input type="text" data-key="legendTrough" class="s"></div>
    </div>
  </details>

  <details open class="only1d">
    <summary>축 · 눈금</summary>
    <div class="sec">
      <div class="row"><label class="ck"><input type="checkbox" data-key="showXAxis"> 가로축 표시</label>
        <label class="ck" id="showYRow"><input type="checkbox" data-key="showYAxis"> 세로축 표시</label>
        <span class="tip" title="끄면 그 축의 선·화살표·눈금·숫자·이름이 모두 숨겨집니다.">?</span></div>
      <div class="row"><label>가로축 표시 범위 <span class="tip" title="슬라이더 값은 보이는 구간의 시작 위치입니다.&#10;움직이면 축 길이·그림 크기는 그대로 두고 보이는 구간 전체가 좌우로 옮겨집니다(파동·눈금도 함께).&#10;축 길이는 그림에서 가로축 화살표를 끌어서 바꿉니다.">?</span></label><input type="number" id="xPan" step="0.5"></div>
      <div class="row"><label></label><span class="unit" id="xRangeTxt"></span></div>
      <div class="row"><label>파동 시작 x</label><input type="number" data-key="waveStart" step="0.1"></div>
      <div class="row" id="front1Row"><label>파동 앞머리 <span class="tip" title="t = 0에 파동이 도달해 있는 맨 앞 위치입니다. 그 앞은 아직 진동하지 않아 파동이 없습니다.&#10;재생하면 앞머리가 파동 속력으로 나아갑니다.&#10;'없음'이면 끝없이 이어진 파동입니다. 오른쪽 칸은 앞머리에 붙는 이름입니다.">?</span></label><input type="number" data-key="front1" data-blank step="0.5" placeholder="없음"><input type="text" data-key="front1Label" class="xs" title="앞머리 이름"><button onclick="S.front1='';syncInputs();draw();" style="padding:2px 7px;font-size:12px" title="앞머리 없애기 (끝없는 파동)">없음</button></div>
      <div class="row"><label>눈금 간격 <span class="tip" title="0이면 눈금을 그리지 않습니다.">?</span></label><input type="number" data-key="tickStep" step="0.5"></div>
      <div class="row"><label>숫자 라벨</label>
        <select data-key="labelMode"><option value="auto">일정 간격</option><option value="custom">직접 입력</option><option value="none">없음</option></select></div>
      <div class="row" id="labelStepRow"><label>라벨 간격</label><input type="number" data-key="labelStep" step="0.5"></div>
      <div class="row" id="customRow"><label>직접 입력</label><input type="text" data-key="customLabels" placeholder="예: 1,2,3,4,6,8"></div>
      <div class="row"><label class="ck"><input type="checkbox" data-key="grid"> 격자 <span class="tip" title="세로 격자선(│)을 아래 간격마다 그립니다. 0이면 그리지 않습니다.&#10;세로선은 세로축에 찍은 눈금의 범위까지 그립니다(눈금이 없으면 세로축 전체).&#10;가로 점선이 필요하면 세로축을 클릭해 눈금을 찍고, 그림을 클릭해 점선을 그리세요.">?</span></label></div>
      <div class="row"><label>격자 간격</label><input type="number" data-key="gridX" step="0.5"></div>
      <details class="sub">
        <summary>축 이름 · 글자 세부 설정</summary>
        <div class="row"><label>가로축 이름</label><input type="text" data-key="xLabel" class="m">
          <select data-key="xLabelPos"><option value="below">화살표 아래</option><option value="right">화살표 오른쪽</option></select></div>
        <div class="row"><label>세로축 이름</label><input type="text" data-key="yLabel" class="m"><span class="tip" title="| 를 넣으면 줄이 바뀝니다. 예: 변위|(m)">?</span></div>
        <div class="row"><label class="ck"><input type="checkbox" data-key="italicVar"> 축 이름 첫 글자 기울임</label>
          <label class="ck"><input type="checkbox" data-key="showOrigin"> 원점 "0"</label></div>
        <div class="row"><label>숫자 위치</label>
          <select data-key="labelPos"><option value="auto">자동 (파동 피하기)</option><option value="center">눈금 바로 아래</option><option value="right">눈금 오른쪽 아래</option></select>
          <span class="tip" title="자동: 숫자가 파동 선과 겹치지 않는 자리(바로 아래 → 오른쪽 아래 → 왼쪽 아래 → 위쪽)를 고릅니다.">?</span></div>
        <div class="row"><label>숫자 가로 이동</label><input type="number" data-key="labelDx" step="1"></div>
        <div class="row"><label>숫자 세로 이동</label><input type="number" data-key="labelDy" step="1"></div>
        <div class="row"><label class="ck"><input type="checkbox" data-key="labelHalo"> 글자 흰 테두리 <span class="tip" title="글자 둘레를 흰색으로 감싸서 선 위에 있어도 글자가 보이게 합니다.">?</span></label></div>
        <div class="row"><label>테두리 두께</label><input type="number" data-key="haloW" step="1"></div>
      </details>
    </div>
  </details>



  <details id="curveSec">
    <summary>여러 시각 겹쳐 그리기 <span class="tip" title="켜져 있는 동안에는 아래 목록의 시각(t축 모드에서는 위치)으로 곡선을 겹쳐 그립니다. 파면 그림에서는 목록의 시각마다 한 줄씩 그리고, 범례 글자가 줄 이름이 됩니다.&#10;재생하거나 시간을 넘기면 모든 곡선이 시간 간격을 유지한 채 함께 움직입니다(t = 0일 때 목록의 시각 그대로).&#10;범례 글자에 t=t_0처럼 쓰면 t₀ 아래첨자가 되고, 영문자는 기울임체로 나옵니다.">?</span></summary>
    <div class="sec">
      <div class="row"><label class="ck"><input type="checkbox" data-key="multi"> 겹쳐 그리기</label>
        <span class="unit">범례</span><select data-key="curveLegend"><option value="ur">오른쪽 위</option><option value="ul">왼쪽 위</option><option value="none">없음</option></select></div>
      <div id="curveList"></div>
      <div class="row"><button onclick="addCurve()">+ 곡선 추가</button><span class="unit" id="curveUnit"></span></div>
    </div>
  </details>

  <!-- ===================== 2차원 ===================== -->
  <details open class="only2d">
    <summary>영역 · 격자 · 선 <span class="tip" title="파면은 이 영역 밖으로 나가면 잘립니다.&#10;점, 치수선, 글자는 영역 밖에도 놓을 수 있습니다.">?</span></summary>
    <div class="sec">
      <div class="row"><label>영역 x 시작</label><input type="number" data-k2="rx0" step="0.5"></div>
      <div class="row"><label>영역 x 끝</label><input type="number" data-k2="rx1" step="0.5"></div>
      <div class="row"><label>영역 y 아래</label><input type="number" data-k2="ry0" step="0.5"></div>
      <div class="row"><label>영역 y 위</label><input type="number" data-k2="ry1" step="0.5"></div>
      <div class="row"><label>1단위 크기 (px)</label><input type="number" data-k2="scale" step="2"></div>
      <div class="row"><label class="ck"><input type="checkbox" data-k2="grid"> 점선 격자</label><label class="ck"><input type="checkbox" data-k2="border"> 테두리</label>
        <label class="ck"><input type="checkbox" data-k2="showCrest"> 마루</label><label class="ck"><input type="checkbox" data-k2="showTrough"> 골</label></div>
      <div class="row"><label>격자 간격</label><input type="number" data-k2="gridStep" step="0.5"></div>
      <div class="row"><label>마루 굵기</label><input type="number" data-k2="crestW" step="0.2"></div>
      <div class="row"><label>골 굵기</label><input type="number" data-k2="troughW" step="0.2"></div>
      <div class="row"><label class="ck"><input type="checkbox" data-key="showLegend"> 범례</label>
        <input type="text" data-key="legendCrest" class="s"><input type="text" data-key="legendTrough" class="s"></div>
    </div>
  </details>

  <details open class="only2d">
    <summary>파원 <span class="tip" title="파면 위치 = 첫 마루 + v·t + nλ (v = λ/T), 골은 마루 사이 λ/2 지점입니다.&#10;최대 r을 비우면 영역 끝까지 그립니다.&#10;평면파의 (x, y)는 발생 장치 중심, 방향은 0° = 오른쪽, 90° = 위, −90° = 아래입니다.&#10;이름에 S_1처럼 쓰면 아래첨자, 글자에 | 를 넣으면 줄바꿈입니다.">?</span></summary>
    <div class="sec">
      <div id="srcList"></div>
      <div class="row"><button onclick="add2D('src')">+ 점파원 (원형파)</button><button onclick="add2D('plane')">+ 평면파 (직선)</button></div>
    </div>
  </details>

  <details open class="only2d">
    <summary>점 (P, Q, R …)</summary>
    <div class="sec">
      <div id="ptList"></div>

<script>
const DEFAULTS = {
  W:800, H:240, pad:0,
  xAxMin:0, xAxMax:8.4, yMin:-1.35, yMax:1.9,
  waveStart:0, waveEnd:7.7,
  hMode:'x', obsX:0, axisSaved:{},
  T:1, t:0, dtVal:0.125, dtUnit:'T', dir:1, phi:0, playSpeed:0.5,
  amp:1, reflShow:'sum',
  media:[{name:'매질 A', end:6, lambda:2, v:2, A:1, r:0, labelX:''}],
  showNames:false, nameY:1.55, showBoundary:true,
  xLabel:'x(m)', yLabel:'변위', italicVar:true, showOrigin:true,
  tickStep:0.5, tickEnd:7.5, labelMode:'auto', labelStep:1, customLabels:'', labelPos:'auto', labelHalo:true, haloW:5, labelDx:0, labelDy:0,
  yTicks:'', yTickLabels:'', yGuides:false, grid:false, gridX:0.5, yLines:[],
  showArrow:true, arrowText:'진행 방향', arrowX:0.4, arrowLen:1.0, arrowY:1.55,
  lw:2.5, axisLw:1.5, fs:18, color:'#000000',
  front1:'', front1Label:'A', w2src:'ends', w2rel:'same', w2on:false, w2A:1, w2phi:0, w2front:'', w2Label:'B', w2show:'sum',
  envelope:false, nodes:false,
  showArrow2:true, arrow2X:5, arrow2Len:1.0, arrow2Y:1.55,
  showXAxis:true, showYAxis:true,
  multi:false, curves:[], curveLegend:'ur', xLabelPos:'below',
  dim:'1d', style1d:'graph', frontRows:'0,3', frontRowLabels:'', stripH:46, stripGap:26,
  showLegend:true, legendCrest:'마루', legendTrough:'골',
  d2:{ rx0:0, rx1:10, ry0:0, ry1:6, scale:42, grid:true, gridStep:1, border:false,
    showCrest:true, showTrough:true, crestW:2.2, troughW:2,
    sources:[
      {type:'point', name:'S_1', x:2, y:1, lambda:2, r0:0, rmin:1.5, rmax:'', showDot:true, pos:'ul', angle:-90, width:6, bar:true, barText:'물결파|발생 장치'},
      {type:'point', name:'S_2', x:8, y:1, lambda:2, r0:0, rmin:1.5, rmax:'', showDot:true, pos:'ul', angle:-90, width:6, bar:true, barText:'물결파|발생 장치'}],
    points:[{name:'P', x:4.25, y:4.31, pos:'ul', dot:true},{name:'Q', x:5, y:4.6, pos:'u', dot:true},{name:'R', x:5.75, y:4.31, pos:'ur', dot:true}],
    segs:[],
    dims:[{x1:10.35, y1:0, x2:10.35, y2:1, label:'1 m', ends:'arrowbar', off:10},
          {x1:9, y1:-0.35, x2:10, y2:-0.35, label:'1 m', ends:'arrowbar', off:12}],
    texts:[] },
};
let S = JSON.parse(JSON.stringify(DEFAULTS));

/* ---------- 계산 ---------- */
function bounds(i){
  const m=S.media, last=m.length-1;
  return [i===0?-Infinity:+m[i-1].end, i===last?Infinity:+m[i].end];
}
function integK(a,b){ // ∫_a^b k dx, a<b
  let s=0;
  S.media.forEach((m,i)=>{ const [lo,hi]=bounds(i);
    const ov=Math.min(b,hi)-Math.max(a,lo); if(ov>0) s+=ov*2*Math.PI/m.lambda; });
  return s;
}
function phase(x){ return x>=0? integK(0,x) : -integK(x,0); }
function yAt(x,A,t=S.t){
  const w=2*Math.PI/S.T;
  return A*Math.sin(phase(x) - S.dir*w*t + S.phi*Math.PI/180);
}
/* 경계 k(매질 k와 k+1 사이)의 반사 계수: 줄에서 r = (v투과 − v입사) / (v입사 + v투과), 파동 진행 방향 기준 */
function rAuto(k,d=+S.dir){
  const a=+S.media[k].v, b=+S.media[k+1].v;
  return d>0 ? (b-a)/(a+b) : (a-b)/(a+b);
}
function reflType(k){
  const r=rAuto(k);
  if(Math.abs(r)<1e-9) return '반사 없음 (속력이 같음)';
  return r<0 ? '고정단 반사 — 반사파가 뒤집힘 (느린 매질로 입사)' : '자유단 반사 — 반사파가 그대로 (빠른 매질로 입사)';
}
/* 매질별 진폭: 파동이 출발하는 매질의 진폭 S.amp에서 시작해, 경계를 지날 때마다 투과 진폭 = (1 + r) × 입사 진폭 */
// d: 진행 방향 (+1 → 왼쪽 매질에서 출발, −1 → 오른쪽 매질에서 출발). 출발 매질의 진폭은 S.amp
function mediumAmps(d=+S.dir){
  const n=S.media.length, A=new Array(n), a0=+S.amp, rr=k=>rAuto(k,d);
  if(d>0){ A[0]=a0; for(let i=0;i<n-1;i++) A[i+1]=A[i]*(1+rr(i)); }
  else { A[n-1]=a0; for(let i=n-1;i>0;i--) A[i-1]=A[i]*(1+rr(i-1)); }
  return A;
}
function ampAt(x){ return mediumAmps()[mediumIdx(x)]; }
// 두 번째 파동(반대 방향): 첫 번째 파동과 같은 진폭으로 반대쪽 끝에서 출발
function amp2At(x){ return mediumAmps(-S.dir)[mediumIdx(x)]; }
function mediumIdx(x){ for(let i=0;i<S.media.length;i++){ const [lo,hi]=bounds(i); if(x<hi||i===S.media.length-1) return i; } }
// 가로축 값 u에서의 변위 (x모드: u=위치, 시각 S.t 고정 / t모드: u=시간, 위치 S.obsX 고정)
/* ---- 앞머리(파면 끝)와 반대 방향 파동 ---- */
function invPhase(target){ let lo=-1e4, hi=1e4; for(let i=0;i<70;i++){ const m=(lo+hi)/2; if(phase(m)<target) lo=m; else hi=m; } return (lo+hi)/2; }
const isNum=v=> v!=='' && v!=null && isFinite(+v);
let frontCache={};
function frontPos(F0,d,t){       // t=0에 F0에 있던 앞머리가 시각 t에 있는 위치
  if(!isNum(F0)) return null;
  const key=F0+'|'+d+'|'+t; if(key in frontCache) return frontCache[key];
  return frontCache[key]=invPhase(phase(+F0) + d*2*Math.PI/S.T*t);
}
/* 정상파 '양쪽 끝에서 동시에 출발': 파동 1·2가 t=0에 구간 양 끝에서 출발 */
function srcMode(){ return S.w2on; }   // 두 번째 파동은 항상 양쪽 끝에서 동시에 출발
function effFronts(){            // t=0에서의 앞머리 위치 [파동1, 파동2]
  if(srcMode()){ const ws=+S.waveStart, we=+S.waveEnd; return +S.dir>0? [ws,we] : [we,ws]; }
  return [S.front1, S.w2front];
}
function effPhases(){            // 라디안 [파동1, 파동2]
  if(srcMode()){
    // 앞머리에서 변위 0, 그 뒤 첫 반파가 마루(또는 골)가 되도록 위상을 정함
    // 파동 1은 마루부터, 파동 2는 '같음'이면 마루부터 / '반대'면 골부터 (두 파원이 같은/반대 위상으로 진동)
    const [F1,F2]=effFronts(), d1=+S.dir, opp=(S.w2rel==='opp')?Math.PI:0;
    const ph=(F,d)=>(d>0?Math.PI:0)-phase(+F);
    return [ph(F1,d1), ph(F2,-d1)+opp];
  }
  return [S.phi*Math.PI/180, S.phi*Math.PI/180+((S.w2rel==='opp')?Math.PI:0)];
}
function comps(x,t){
  const w=2*Math.PI/S.T, d1=+S.dir, Ph=phase(x), P=effPhases(), F=effFronts();
  const AM=mediumAmps(), mi=mediumIdx(x);
  let y1=AM[mi]*Math.sin(Ph - d1*w*t + P[0]);
  const f1=frontPos(F[0],d1,t);
  if(f1!==null && (d1>0? x>f1+1e-9 : x<f1-1e-9)) y1=NaN;
  // 반사파 (여러 번 반사는 생략)
  //  매질 mi의 앞쪽 경계에서 되돌아오는 파동
  let yR=NaN;
  if(S.reflShow!=='none'){
    const Pf=isNum(F[0])? phase(+F[0])+d1*w*t : null;
    const reached=path=> Pf===null || (d1>0? path<=Pf+1e-9 : path>=Pf-1e-9);
    const add=v=>{ yR=(isFinite(yR)?yR:0)+v; };
    const bi = d1>0 ? mi : mi-1;
    if(bi>=0 && bi<S.media.length-1){
      const r=rAuto(bi), b=+S.media[bi].end, path=2*phase(b)-Ph;
      if(Math.abs(r)>1e-12 && (d1>0? x<=b : x>=b) && reached(path)) add(r*AM[mi]*Math.sin(path - d1*w*t + P[0]));
    }
  }
  if((S.reflShow==='sum'||S.reflShow==='both') && isFinite(yR)) y1=(isFinite(y1)?y1:0)+yR;
  let y2=NaN;
  if(S.w2on){
    const d2=-d1; y2=amp2At(x)*Math.sin(Ph - d2*w*t + P[1]);
    const f2=frontPos(F[1],d2,t);
    if(f2!==null && (d2>0? x>f2+1e-9 : x<f2-1e-9)) y2=NaN;
  }
  const sum=(isNaN(y1)&&isNaN(y2))? NaN : (isNaN(y1)?0:y1)+(isNaN(y2)?0:y2);
  return {y1,y2,sum,yR};
}
// p: x모드에서는 시각, t모드에서는 관찰 위치 (생략하면 현재 값)
function waveXT(u,p){ return S.hMode==='t' ? [p===undefined? +S.obsX : +p, u] : [u, p===undefined? S.t : +p]; }
function waveY(u,p){ const [x,t]=waveXT(u,p); return comps(x,t).sum; }
const DASH={solid:'', dashed:'7 5', dotted:'2 4'};
function activeCurves(){
  // x축 모드: 각 곡선의 시각에 현재 시각 t를 더해서, 재생하면 모든 곡선이 함께 움직임
  if(S.multi && S.curves.length) return S.curves.map(c=>({p:+c.p+(S.hMode==='x'? +S.t:0), dash:c.dash, label:c.label}));
  return [{p:undefined, dash:'solid', label:''}];
}
const fmt = n => { if(!isFinite(n)) return '—'; const v=parseFloat((+n).toFixed(4)); return (v<0?'−':'')+Math.abs(v); };

/* ---------- 그리기 ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function textEl(x,y,str,anchor='middle',italicFirst=false){
  const ff=`font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"`;
  let inner=esc(str);
  if(italicFirst && /^[A-Za-z]/.test(str)){
    inner=`<tspan font-style="italic" font-family="'Times New Roman',serif" font-size="${S.fs*1.1}">${esc(str[0])}</tspan>${esc(str.slice(1))}`;
  }
  // 흰 테두리는 글자 전체 아래에 따로 깔아서, 다음 글자의 테두리가 앞 글자(기울임체 등)를 지우지 않게 함
  const base=`x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${S.fs}" ${ff} text-anchor="${anchor}"`;
  const halo = S.labelHalo ? `<text ${base} fill="#fff" stroke="#fff" stroke-width="${(+S.haloW).toFixed(2)}" stroke-linejoin="round">${inner}</text>` : '';
  return `${halo}<text ${base} fill="#000">${inner}</text>`;
}
function arrowHead(x,y,dx,dy,size){
  const L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, px=-uy, py=ux;
  const bx=x-ux*size, by=y-uy*size, h=size*0.45;
  return `<path d="M${x},${y} L${(bx+px*h).toFixed(2)},${(by+py*h).toFixed(2)} L${(bx-px*h).toFixed(2)},${(by-py*h).toFixed(2)} Z" fill="#000"/>`;
}
function parseList(s){ return String(s||'').split(/[,\s]+/).filter(v=>v!=='').map(Number).filter(v=>isFinite(v)); }

function draw(){
  if(S.dim==='2d') draw2D();
  else if(S.hMode==='x' && S.style1d==='fronts') drawFronts();
  else drawGraph();
  updateTimeUI(); syncMediaRO(); toImage(); placeHandles(); syncQuick(); enhanceNumbers(); refreshSliders(); syncChips();
}

/* =================================================================
   축 화살표 끌어서 축 길이 조절
   (눈금 간격의 픽셀 크기는 그대로 두고 그림 크기를 함께 바꿔서, 화살표가 마우스를 따라옴)
   ================================================================= */
let GEOM=null, DRAG=null;
const AH_TIP={x:'끌어서 가로축 길이 조절 (파동도 함께 늘어남)', yTop:'끌어서 세로축 길이 조절 (위아래 같은 만큼)'};
function arrowDrags(which,x1,x2,yy,tipAtEnd){
  const fs=+S.fs, L=Math.min(x1,x2), R=Math.max(x1,x2);
  GEOM.drags.push({kind:'arrow', which, box:[L, yy-fs*1.3, R-L, fs*1.3+8]});
  const tx=tipAtEnd? x2 : x1;
  GEOM.drags.push({kind:'tip', which, tipAtEnd, box:[tx-10, yy-10, 20, 20]});
}
let IDRAG=null;
const DG_TIP={name:'끌어서 매질 이름 옮기기', arrow:'끌어서 진행 방향 화살표 옮기기', tip:'화살촉을 끌어서 화살표 길이 조절',
  src:'끌어서 파원 옮기기', rot:'끌어서 평면파 발생 장치의 방향·길이 조절', pt:'끌어서 점 옮기기', txt:'끌어서 글자 옮기기',
  dim1:'끌어서 치수선 끝 옮기기', dim2:'끌어서 치수선 끝 옮기기', dimm:'끌어서 치수선 옮기기'};
function start2DDrag(e,it){
  e.preventDefault(); e.stopPropagation();
  const q=it.ref;
  if(PTMODE && it.kind==='pt'){ const i=S.d2.points.indexOf(q); if(i>=0) S.d2.points.splice(i,1);
    // 그 점을 쓰는 선분도 함께 삭제
    S.d2.segs=S.d2.segs.filter(sg=>sg.from!==q.name && sg.to!==q.name);
    render2DLists(); draw(); return; }
  D2DRAG={it, x0:e.clientX, y0:e.clientY, sc:GEOM.sc, snap:JSON.parse(JSON.stringify(q))};
  FREEZE2D=LAST2D? {...LAST2D} : null;
  document.body.style.cursor='move';
  window.addEventListener('pointermove',move2DDrag);
  window.addEventListener('pointerup',()=>{ window.removeEventListener('pointermove',move2DDrag);
    D2DRAG=null; FREEZE2D=null; document.body.style.cursor=''; render2DLists(); draw(); },{once:true});
}
function move2DDrag(e){
  if(!D2DRAG) return;
  const {it,sc,snap:o}=D2DRAG, q=it.ref, dx=(e.clientX-D2DRAG.x0)/sc, dy=-(e.clientY-D2DRAG.y0)/sc;
  const r=v=>+(Math.round(v/0.05)*0.05).toFixed(3);
  if(it.kind==='src'||it.kind==='pt'||it.kind==='txt'){ q.x=r(+o.x+dx); q.y=r(+o.y+dy); }
  else if(it.kind==='dim1'){ q.x1=r(+o.x1+dx); q.y1=r(+o.y1+dy); }
  else if(it.kind==='dim2'){ q.x2=r(+o.x2+dx); q.y2=r(+o.y2+dy); }
  else if(it.kind==='dimm'){ q.x1=r(+o.x1+dx); q.y1=r(+o.y1+dy); q.x2=r(+o.x2+dx); q.y2=r(+o.y2+dy); }
  else if(it.kind==='rot'){
    // 막대 끝을 끌면: 막대 방향이 마우스 쪽을 향하고, 길이 = 중심까지 거리 × 2. 진행 방향은 막대에 수직
    const a0=o.angle*Math.PI/180, h0=num(o.width,6)/2;
    const ex=-Math.sin(a0)*h0+dx, ey=Math.cos(a0)*h0+dy, L=Math.hypot(ex,ey);
    if(L>0.1){ let a=Math.atan2(-ex,ey)*180/Math.PI; a=Math.round(a/5)*5; q.angle=((a+540)%360)-180; q.width=r(Math.max(0.5,2*L)); }
  }
  draw();
}
function startItemDrag(e,it){
  e.preventDefault(); e.stopPropagation();
  const k=it.which===2? ['arrow2X','arrow2Len','arrow2Y'] : ['arrowX','arrowLen','arrowY'];
  IDRAG={it, k, x0:e.clientX, y0:e.clientY, sx:GEOM.scaleX, sy:GEOM.scaleY,
    ax0:+S[k[0]], len0:+S[k[1]], ay0:+S[k[2]]};
  document.body.style.cursor = it.kind==='tip'? 'ew-resize' : 'move';
  window.addEventListener('pointermove',moveItemDrag);
  window.addEventListener('pointerup',()=>{ window.removeEventListener('pointermove',moveItemDrag); IDRAG=null; document.body.style.cursor=''; draw(); },{once:true});
}
function moveItemDrag(e){
  if(!IDRAG) return;
  const d=IDRAG, it=d.it, dx=(e.clientX-d.x0)/d.sx, dy=-(e.clientY-d.y0)/d.sy, r=v=>+(Math.round(v/0.05)*0.05).toFixed(3);
  if(it.kind==='name'){
    const m=S.media[it.i]; if(!m) return;
    m.labelX=r(it.lx0+dx); if(it.vert) m.labelY=r(it.ly0+dy);
  } else if(it.kind==='arrow'){
    S[d.k[0]]=r(d.ax0+dx); S[d.k[2]]=r(d.ay0+dy);
  } else {
    if(it.tipAtEnd) S[d.k[1]]=Math.max(0.2, r(d.len0+dx));
    else { const nx=Math.min(r(d.ax0+dx), d.ax0+d.len0-0.2); S[d.k[0]]=nx; S[d.k[1]]=r(d.len0-(nx-d.ax0)); }
  }
  draw();
}
/* =================================================================
   세로축 눈금 · 점선을 마우스로 추가/삭제
   - 세로축 위: 반투명 눈금 + 값 미리보기 → 클릭하면 눈금 추가 (기존 눈금 위면 삭제)
   - 그림 안: 가까운 눈금에서 커서까지 반투명 가로 점선 → 클릭하면 점선 그리기 (기존 점선 위면 삭제)
   ================================================================= */
let HOV=null;
function yTickList(){ return parseList(S.yTicks); }
function yLabelList(){ return String(S.yTickLabels||'').split(',').map(v=>v.trim()); }
function snapY(v,A){
  const pxTol=7/A.sy, cands=[];
  mediumAmps().forEach(a=>cands.push(a,-a));
  if(S.w2on){ const a=Math.max(...mediumAmps())+Math.max(...mediumAmps(-S.dir)); cands.push(a,-a); }
  for(const c of cands) if(Math.abs(v-c)<pxTol) return c;
  return +(Math.round(v/0.1)*0.1).toFixed(4);
}
function hoverCalc(e){
  if(S.dim==='2d' && PTMODE && GEOM && GEOM.d2map && !D2DRAG){
    const img=document.getElementById('waveImg'); if(!img) return null;
    const rc=img.getBoundingClientRect(), px=e.clientX-rc.left, py=e.clientY-rc.top, M=GEOM.d2map;
    const [x,y,snapKind]=snapPoint2D(M.xOf(px),M.yOf(py),GEOM.sc);
    return {mode:'addPt', x, y, snapKind, px:M.X(x), py:M.Y(y), name:nextPtName()};
  }
  if(!GEOM || !GEOM.axis || DRAG || IDRAG) return null;
  const A=GEOM.axis, img=document.getElementById('waveImg'); if(!img) return null;
  const r=img.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  A.sy=GEOM.scaleY;
  if(!A.SY || py<A.top-6 || py>A.bot+6) return null;
  const ticks=yTickList();
  if(Math.abs(px-A.ax)<=10){                       // 세로축 위
    const hit=ticks.findIndex(v=>Math.abs(A.Y(v)-py)<=6);
    if(hit>=0) return {mode:'delTick', i:hit, v:ticks[hit], px, py};
    const v=snapY(A.yOf(py),A);
    if(Math.abs(v)<1e-9) return null;
    return {mode:'addTick', v, px, py};
  }
  if(px<A.ax+10 || px>A.plotR) return null;           // 그림 안
  const L=S.yLines||[];
  const hl=L.findIndex(l=>Math.abs(A.Y(l.y)-py)<=5 && px>=A.ax && px<=A.X(l.x)+6);
  if(hl>=0) return {mode:'delLine', i:hl, l:L[hl], px, py};
  let best=null; ticks.forEach(v=>{ const d=Math.abs(A.Y(v)-py); if(d<=12 && (!best||d<best.d)) best={v,d}; });
  if(!best) return null;
  const x=+(Math.round(A.xOf(px)/0.05)*0.05).toFixed(4);
  return {mode:'addLine', v:best.v, x, px, py};
}
function renderHover(h){
  const wrap=document.getElementById('svgWrap');
  wrap.querySelectorAll('svg.pv, .pvtip').forEach(e=>e.remove());
  wrap.style.cursor = h? 'pointer' : '';
  if(!h) return;
  const A=GEOM.axis, img=document.getElementById('waveImg');
  const W=img.width, H=img.height, ns='http://www.w3.org/2000/svg';
  let inner='', tip='';
  if(h.mode==='addPt'){
    inner=`<circle cx="${h.px}" cy="${h.py}" r="4.5" fill="#2b6cb0" opacity=".6"/>`+(h.snapKind? `<circle cx="${h.px}" cy="${h.py}" r="9" fill="none" stroke="#2b6cb0" stroke-width="1.5" opacity=".55"/>`:'');
    tip=`${h.name} (${fmt(h.x)}, ${fmt(h.y)})`+(h.snapKind? ` <span style="opacity:.8">· ${h.snapKind}</span>`:'')+` <span style="opacity:.75">· 클릭해서 점 추가</span>`;
  }
  if(h.mode==='addTick'){ const y=A.Y(h.v);
    inner=`<line x1="${A.ax-5}" y1="${y}" x2="${A.ax+5}" y2="${y}" stroke="#2b6cb0" stroke-width="2.5" opacity=".55"/>`;
    tip=`${fmt(h.v)} <span style="opacity:.75">· 클릭해서 눈금 추가</span>`; }
  if(h.mode==='delTick'){ const y=A.Y(h.v);
    inner=`<line x1="${A.ax-6}" y1="${y}" x2="${A.ax+6}" y2="${y}" stroke="#d33" stroke-width="3" opacity=".7"/>`;
    tip=`${fmt(h.v)} <span style="opacity:.75">· 클릭해서 눈금 삭제</span>`; }
  if(h.mode==='addLine'){ const y=A.Y(h.v), x2=A.X(h.x);
    inner=`<line x1="${A.ax}" y1="${y}" x2="${x2}" y2="${y}" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="3 3" opacity=".55"/>
      <circle cx="${x2}" cy="${y}" r="3" fill="#2b6cb0" opacity=".55"/>`;
    tip=`y = ${fmt(h.v)}, x = ${fmt(h.x)} <span style="opacity:.75">· 클릭해서 점선 그리기</span>`; }
  if(h.mode==='delLine'){ const y=A.Y(h.l.y);
    inner=`<line x1="${A.ax}" y1="${y}" x2="${A.X(h.l.x)}" y2="${y}" stroke="#d33" stroke-width="2.5" stroke-dasharray="3 3" opacity=".7"/>`;
    tip=`<span style="opacity:.85">클릭해서 이 점선 삭제</span>`; }
  const sv=document.createElementNS(ns,'svg'); sv.setAttribute('class','pv'); sv.setAttribute('width',W); sv.setAttribute('height',H); sv.innerHTML=inner;
  wrap.appendChild(sv);
  const t=document.createElement('div'); t.className='pvtip'; t.innerHTML=tip;
  t.style.left=(h.px+14)+'px'; t.style.top=(h.py-30)+'px';
  wrap.appendChild(t);
}
function applyHover(h){
  if(!h) return;
  if(h.mode==='addPt'){ S.d2.points.push({name:h.name, x:h.x, y:h.y, pos:'ul', dot:true}); render2DLists(); draw(); renderHover(HOV=null); return; }
  if(h.mode==='addTick'){
    const t=yTickList(), lb=yLabelList();
    t.push(h.v); while(lb.length<t.length-1) lb.push(''); lb.length=t.length-1; lb.push('');
    S.yTicks=t.map(v=>fmt(v).replace('−','-')).join(',');
    S.yTickLabels=lb.some(x=>x)? lb.join(',') : '';
  } else if(h.mode==='delTick'){
    const t=yTickList(), lb=yLabelList();
    t.splice(h.i,1); if(lb.length>h.i) lb.splice(h.i,1);
    S.yTicks=t.map(v=>fmt(v).replace('−','-')).join(',');
    S.yTickLabels=lb.some(x=>x)? lb.join(',') : '';
    S.yLines=(S.yLines||[]).filter(l=>Math.abs(l.y-h.v)>1e-9);
  } else if(h.mode==='addLine'){
    S.yLines=(S.yLines||[]).filter(l=>Math.abs(l.y-h.v)>1e-9);   // 같은 눈금의 점선은 하나만
    S.yLines.push({y:h.v, x:h.x});
  } else if(h.mode==='delLine'){
    S.yLines.splice(h.i,1);
  }
  syncInputs(); draw();
  renderHover(HOV=null);
}
(function(){
  const wrap=document.getElementById('svgWrap');
  wrap.addEventListener('pointermove',e=>{
    if(e.target.closest('.dg, .ah')){ if(HOV){ HOV=null; renderHover(null); } return; }
    HOV=hoverCalc(e); renderHover(HOV);
  });
  wrap.addEventListener('pointerleave',()=>{ HOV=null; renderHover(null); });
  wrap.addEventListener('click',e=>{ if(e.target.closest('.dg, .ah')) return; const h=hoverCalc(e); if(h) applyHover(h); });
})();

function placeHandles(){
  const wrap=document.getElementById('svgWrap');
  wrap.querySelectorAll('.ah, .dg').forEach(e=>e.remove());
  if(!GEOM) return;
  (GEOM.drags||[]).forEach(it=>{
    const d=document.createElement('div');
    d.className='dg'+(it.kind==='tip'?' tip':'')+(it.d2 && it.kind!=='txt'?' pt2':'')+(it.kind==='rot'?' rot':'');
    const [x,y,w,h]=it.box; d.style.left=x+'px'; d.style.top=y+'px'; d.style.width=w+'px'; d.style.height=h+'px';
    d.title=(PTMODE && it.kind==='pt')? '클릭해서 점 삭제' : DG_TIP[it.kind];
    if(PTMODE && it.kind==='pt') d.classList.add('delpt');
    d.addEventListener('pointerdown',e=> it.d2 ? start2DDrag(e,it) : startItemDrag(e,it));
    wrap.appendChild(d);
  });
  GEOM.handles.forEach(h=>{
    const d=document.createElement('div'); d.className='ah '+(h.kind==='x'?'hx':'hy');
    if(DRAG && DRAG.kind===h.kind) d.classList.add('active');
    d.style.left=(h.x-12)+'px'; d.style.top=(h.y-12)+'px'; d.title=AH_TIP[h.kind];
    d.addEventListener('pointerdown',e=>startAxisDrag(e,h));
    wrap.appendChild(d);
  });
}
function startAxisDrag(e,h){
  e.preventDefault();
  const stage=document.getElementById('stage'), wrap=document.getElementById('svgWrap');
  const sr=stage.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
  DRAG={ kind:h.kind, x0:e.clientX, y0:e.clientY, W0:+S.W, H0:+S.H,
    xMax0:+S.xAxMax, yMax0:+S.yMax, yMin0:+S.yMin, waveEnd0:+S.waveEnd, tickEnd0:+S.tickEnd, sx:GEOM.scaleX, sy:GEOM.scaleY,
    left0: wr.left-sr.left+stage.scrollLeft-parseFloat(getComputedStyle(stage).paddingLeft),
    top0: wr.top-sr.top+stage.scrollTop-parseFloat(getComputedStyle(stage).paddingTop) };
  // 끄는 동안 그림 위치를 고정 (가운데 정렬 때문에 그림이 움직이지 않게)
  stage.classList.add('dragging');
  wrap.style.marginLeft=DRAG.left0+'px'; wrap.style.marginTop=DRAG.top0+'px';
  document.body.style.cursor = h.kind==='x' ? 'ew-resize' : 'ns-resize';
  window.addEventListener('pointermove',moveAxisDrag);
  window.addEventListener('pointerup',endAxisDrag,{once:true});
}
function moveAxisDrag(e){
  if(!DRAG) return;
  const d=DRAG, dx=e.clientX-d.x0, dy=e.clientY-d.y0, r=(v,st)=>Math.round(v/st)*st;
  let grow=0;   // 세로축: 위쪽으로 늘어난 픽셀
  if(d.kind==='x'){
    // 가로축 끝과 함께 파동·눈금 끝도 같은 만큼 이동 → 늘린 부분에 파동이 이어서 나타남
    const v=Math.max(+S.xAxMin+0.2, r(d.xMax0+dx/d.sx,0.1)), dv=v-d.xMax0;
    S.xAxMax=+v.toFixed(4); S.W=Math.round(d.W0+dv*d.sx);
    S.waveEnd=+Math.max(+S.waveStart+0.1, d.waveEnd0+dv).toFixed(4);
    S.tickEnd=+Math.max(+S.xAxMin, d.tickEnd0+dv).toFixed(4);
  } else {
    // 세로축: 위쪽과 아래쪽을 같은 만큼 늘이거나 줄임
    const dmin=-Math.min(d.yMax0, -d.yMin0)+0.05;
    const dv=Math.max(dmin, r(-dy/d.sy,0.05));
    S.yMax=+(d.yMax0+dv).toFixed(4); S.yMin=+(d.yMin0-dv).toFixed(4);
    grow=dv*d.sy; S.H=Math.round(d.H0+2*grow);
  }
  const wrap=document.getElementById('svgWrap');
  // 세로축을 늘릴 때는 가로축(변위 0) 위치를 고정
  wrap.style.marginTop=(d.top0-grow)+'px';
  syncInputs(); draw();
}
function endAxisDrag(){
  window.removeEventListener('pointermove',moveAxisDrag);
  DRAG=null; document.body.style.cursor='';
  const stage=document.getElementById('stage'), wrap=document.getElementById('svgWrap');
  stage.classList.remove('dragging'); wrap.style.marginLeft=''; wrap.style.marginTop='';
  draw();
}

/* =================================================================
   그림을 <img>로 표시 → 오른쪽 클릭 "이미지 복사" 가능
   바로 SVG 이미지로 보여 주고, 조작이 멈추면 3배 해상도 PNG로 교체
   ================================================================= */
let rasterTimer=null, lastBlobUrl=null, lastPngBlob=null, curSvg=null;
const PNG_SCALE=3;
function rasterize(svgUrl,W,H){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas'); c.width=Math.round(W*PNG_SCALE); c.height=Math.round(H*PNG_SCALE);
      const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=> b? res(b) : rej(new Error('toBlob')), 'image/png');
    };
    im.onerror=()=>rej(new Error('load')); im.src=svgUrl;
  });
}
function toImage(){
  const wrap=document.getElementById('svgWrap'), svg=wrap.querySelector('svg'); if(!svg) return;
  const W=+svg.getAttribute('width'), H=+svg.getAttribute('height');
  const svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg));
  let img=document.getElementById('waveImg');
  if(!img){ img=document.createElement('img'); img.id='waveImg'; img.alt='파동 그림'; img.title='오른쪽 클릭 → 이미지 복사'; }
  img.width=W; img.height=H; img.src=svgUrl;
  wrap.replaceChildren(img);
  curSvg={svgUrl,W,H}; lastPngBlob=null;
  clearTimeout(rasterTimer);
  rasterTimer=setTimeout(()=>{
    const mine=curSvg;
    rasterize(mine.svgUrl,mine.W,mine.H).then(b=>{
      if(curSvg!==mine) return;                       // 그 사이 그림이 바뀌었으면 버림
      lastPngBlob=b;
      // blob: 주소는 이 페이지 밖에서 열리지 않으므로, 그림 데이터를 직접 담은 data: 주소로 표시
      return blobToDataURL(b).then(u=>{ if(curSvg===mine) img.src=u; });
    }).catch(()=>{});
  }, playing? 600 : 150);
}
function blobToDataURL(b){ return new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }

/* =================================================================
   숫자 입력 → 슬라이더 + 값 표시 (클릭하면 정확한 숫자칸)
   ================================================================= */
// 가로축 표시 범위: 축 길이는 그대로 두고 보이는 구간을 통째로 이동
function panX(v){
  const d=v-(+S.xAxMin); if(Math.abs(d)<1e-12) return;
  ['xAxMin','xAxMax','waveStart','waveEnd','tickEnd'].forEach(k=>S[k]=+(+S[k]+d).toFixed(4));
  if(isNum(S.front1)) S.front1=+(+S.front1+d).toFixed(4);
  if(isNum(S.w2front)) S.w2front=+(+S.w2front+d).toFixed(4);
  syncInputs(); draw();
}
function syncQuick(){
  const set=(id,v)=>{ const e=document.getElementById(id); if(e && document.activeElement!==e) e.value=parseFloat((+v).toFixed(6)); };
  if(S.media[0]){ set('qV',S.media[0].v); } set('qA',S.amp); set('xPan',S.xAxMin); set('qFs',S.fs);
  const xr=document.getElementById('xRangeTxt'); if(xr) xr.textContent=`보이는 구간: ${fmt(S.xAxMin)} ~ ${fmt(S.xAxMax)} ${S.hMode==='t'?'s':'m'}`;
  if(S.d2.sources[0]) set('q2Lambda',S.d2.sources[0].lambda);
}
function syncChips(){
  document.querySelectorAll('.chip[data-tog]').forEach(b=>b.classList.toggle('on', S[b.dataset.tog]!==false && !!S[b.dataset.tog]));
  document.querySelectorAll('.chip[data-tog2]').forEach(b=>b.classList.toggle('on', !!S.d2[b.dataset.tog2]));
}
document.querySelectorAll('.chip[data-tog]').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.tog; S[k]=!S[k];

}));
document.querySelectorAll('.chip[data-tog2]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.tog2; S.d2[k]=!S.d2[k]; syncInputs(); draw(); }));
const qIn=(id,fn)=>document.getElementById(id).addEventListener('input',e=>{ const v=parseFloat(e.target.value); if(isFinite(v)) fn(v); });
qIn('qV',v=>{ if(v<=0) return; const m=S.media[0]; m.v=v; m.lambda=v*S.T; renderMedia(); draw(); });
qIn('qA',v=>{ if(v<0) return; S.amp=v; fitY2(); draw(); });
qIn('xPan',v=>panX(v));
qIn('qFs',v=>{ if(v<8||v>48) return; const k=v/(+S.fs);

  S.fs=v; render2DLists(); draw(); });
qIn('q2Lambda',v=>{ if(v<=0) return; S.d2.sources.forEach(q=>q.lambda=v); render2DLists(); draw(); });
function togglePanel(on){
  const open = on===undefined ? document.body.classList.contains('nopanel') : on;

  document.getElementById('panelBtn').classList.toggle('on', open);

function rangeFor(el){
  const xa=+S.xAxMin, xb=+S.xAxMax, ya=+S.yMin, yb=+S.yMax, d=S.d2;
  const k=el.dataset.key||el.dataset.k2||el.dataset.f||el.dataset.k||el.id;
  const inList=id=>!!el.closest('#'+id);
  const R=(min,max,step)=>({min,max,step});
  if(inList('srcList')||inList('ptList')||inList('dimList')||inList('txtList')){
    const span=Math.max(+d.rx1-+d.rx0,+d.ry1-+d.ry0);
    return ({x:R(+d.rx0-2,+d.rx1+2,0.05), y:R(+d.ry0-2,+d.ry1+2,0.05), x1:R(+d.rx0-2,+d.rx1+2,0.05), x2:R(+d.rx0-2,+d.rx1+2,0.05),
      y1:R(+d.ry0-2,+d.ry1+2,0.05), y2:R(+d.ry0-2,+d.ry1+2,0.05), lambda:R(0.1,10,0.1), r0:R(0,4,0.05), rmin:R(0,span,0.1),
      rmax:R(0,span*1.5,0.1), angle:R(-180,180,5), width:R(0.5,span*1.5,0.1), off:R(-40,40,1), size:R(8,40,1)})[k] || R(0,10,0.1);
  }
  if(inList('curveList')) return S.hMode==='t'? R(xa,xb,0.05) : R(0,2*S.T,S.T/100);
  if(inList('segList')) return R(0.5,6,0.25);
  if(inList('mediaList')) return ({v:R(0.1,20,0.1), end:R(xa,xb,0.1), r:R(-1,1,0.05)})[k] || R(0,10,0.1);
  return ({
    T:R(0.1,10,0.1), f:R(0.1,10,0.1), phi:R(-180,180,5), obsX:R(xa,xb,0.05),
    nameY:R(ya,yb,0.05), arrowY:R(ya,yb,0.05), arrow2Y:R(ya,yb,0.05), arrowX:R(xa,xb,0.1), arrow2X:R(xa,xb,0.1),
    arrowLen:R(0.2,5,0.1), arrow2Len:R(0.2,5,0.1), front1:R(xa,xb,0.1), w2front:R(xa,xb,0.1),
    stripH:R(20,120,2), stripGap:R(0,80,2),
    xAxMin:R(-10,10,0.5), xAxMax:R(1,40,0.1), yMin:R(-5,0,0.05), yMax:R(0,5,0.05),
    waveStart:R(xa,xb,0.1), waveEnd:R(xa,xb,0.1), tickStep:R(0,5,0.25), tickEnd:R(xa,xb,0.5),
    labelStep:R(0.25,10,0.25), gridY:R(0,2,0.25), gridX:R(0,5,0.25), labelDx:R(-20,20,1), labelDy:R(-20,20,1), haloW:R(0,10,1),
    rx0:R(-20,20,0.5), rx1:R(0,40,0.5), ry0:R(-20,20,0.5), ry1:R(0,40,0.5), scale:R(10,100,1), gridStep:R(0.25,5,0.25),
    crestW:R(0.5,5,0.1), troughW:R(0.5,5,0.1), qV:R(0.1,20,0.1), qA:R(0,5,0.1), xPan:R(-20,20,0.1), qFs:R(10,36,1), q2Lambda:R(0.1,10,0.1),
  })[k] || R(0,10,0.1);
}
function enhanceNumbers(){
  document.querySelectorAll('#panel input[type=number]:not([data-enh]), #topbar input[type=number]:not([data-enh])').forEach(num=>{
    num.dataset.enh='1';
    const wrap=document.createElement('span'); wrap.className='nf';
    const sl=document.createElement('input'); sl.type='range';
    const val=document.createElement('button'); val.type='button'; val.className='val'; val.title='눌러서 정확한 값 입력';
    num.parentNode.insertBefore(wrap,num);
    wrap.append(sl,val,num);
    sl.addEventListener('input',()=>{ num.value=sl.value; num.dispatchEvent(new Event('input',{bubbles:true})); syncOne(wrap); });
    num.addEventListener('input',()=>syncOne(wrap));
    val.addEventListener('click',()=>{ wrap.classList.add('edit'); num.focus(); num.select(); });
    num.addEventListener('blur',()=>{ wrap.classList.remove('edit'); syncOne(wrap); });
    num.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key==='Escape') num.blur(); });
    syncOne(wrap);
  });
}
function syncOne(wrap){
  const [sl,val,num]=wrap.children, r=rangeFor(num), raw=num.value;
  let mn=r.min, mx=r.max; const v=parseFloat(raw);
  if(isFinite(v)){ if(v<mn) mn=v; if(v>mx) mx=v; }
  if(mx<=mn) mx=mn+r.step;
  sl.min=mn; sl.max=mx; sl.step=r.step;
  if(isFinite(v)) sl.value=v; else sl.value=(num.placeholder==='끝까지'? mx : mn);
  val.textContent = (raw==='' ? (num.placeholder||'—') : fmt(v));
}
function refreshSliders(){ document.querySelectorAll('#panel .nf, #topbar .nf').forEach(w=>{ if(document.activeElement!==w.children[0]) syncOne(w); else w.children[1].textContent=fmt(+w.children[2].value); }); }
function drawGraph(){
  const s=S, fs=+s.fs, pad=+s.pad||0;
  const W=+s.W, H=+s.H;
  const yTickVals=parseList(s.yTicks);
  const yTickLbl=String(s.yTickLabels||'').split(',').map(v=>v.trim());
  const yLblW=Math.max(Math.max(...String(s.yLabel).split('|').map(l=>l.length))*fs*1.0, yTickVals.length? fs*2.2:0, fs*1.0);
  const legN=(s.multi && s.curves.length && s.curveLegend!=='none')? s.curves.filter(c=>c.label!=='').length : 0;
  const legH=legN? legN*fs*1.25+4 : 0;
  const yLines=String(s.yLabel).split('|'), yExtra=(yLines.length-1)*fs*1.15;
  const topX=Math.max(legH,yExtra);
  const mL=yLblW+12+pad, mR=(s.xLabelPos==='right'? String(s.xLabel).length*fs*0.62+14 : fs*0.6+8)+pad, mT=fs*0.7+6+pad+topX, mB=8+pad;
  const pw=W-mL-mR, ph=H-mT-mB;
  const X=x=>mL+(x-s.xAxMin)/(s.xAxMax-s.xAxMin)*pw;
  const Y=y=>mT+(s.yMax-y)/(s.yMax-s.yMin)*ph;
  const x0 = (0>=s.xAxMin && 0<=s.xAxMax)? 0 : s.xAxMin;
  const ax=X(x0), ay=Y(0);
  const ah=Math.max(9, s.axisLw*6);
  let g='', txt='';

  // 격자
  frontCache={};
  if(s.grid){
    const gl=`stroke="#888" stroke-width="0.9" stroke-dasharray="3 3"`;
    const yv=parseList(s.yTicks), gy0=yv.length? Math.min(...yv):s.yMin, gy1=yv.length? Math.max(...yv):s.yMax;
    const gx0=x0, gx1=+s.tickEnd;
    const gX=+s.gridX;   // 세로선(│) 간격 — 가로 방향으로 몇 칸마다
    if(gX>0) for(let k=Math.ceil((gx0-1e-9)/gX); k*gX<=gx1+1e-9; k++)
      g+=`<line x1="${X(k*gX)}" y1="${Y(gy1)}" x2="${X(k*gX)}" y2="${Y(gy0)}" ${gl}/>`;
  }
  // y 눈금 가로 점선
  // 클릭으로 그린 점선 (세로축 눈금에서 가로로)
  (s.yLines||[]).forEach(l=>{ g+=`<line x1="${ax}" y1="${Y(l.y)}" x2="${X(l.x)}" y2="${Y(l.y)}" stroke="#555" stroke-width="1" stroke-dasharray="2 3"/>`; });

  // 경계 점선
  const xm = s.hMode==='x';
  if(xm && s.media.length>1){
    s.media.slice(0,-1).forEach(m=>{ const e=+m.end;
      if(e>s.xAxMin && e<s.xAxMax) g+=`<line x1="${X(e)}" y1="${Y(s.yMax)+4}" x2="${X(e)}" y2="${Y(s.yMin)}" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/>`; });
  }

  // 축
  const sw=s.axisLw, SX=s.showXAxis!==false, SY=s.showYAxis!==false;
  if(SX){ g+=`<line x1="${X(s.xAxMin)}" y1="${ay}" x2="${X(s.xAxMax)-ah*0.6}" y2="${ay}" stroke="#000" stroke-width="${sw}"/>`;
    g+=arrowHead(X(s.xAxMax),ay,1,0,ah); }
  if(SY){ g+=`<line x1="${ax}" y1="${Y(s.yMin)}" x2="${ax}" y2="${Y(s.yMax)+ah*0.6}" stroke="#000" stroke-width="${sw}"/>`;
    g+=arrowHead(ax,Y(s.yMax),0,-1,ah); }
  GEOM={ scaleX: pw/(s.xAxMax-s.xAxMin), scaleY: ph/(s.yMax-s.yMin), handles:[], drags:[],
    axis:{ X, Y, ax, ay, SY, plotR: X(s.xAxMax), top: Y(s.yMax), bot: Y(s.yMin),
      xOf: px=>s.xAxMin+(px-mL)/pw*(s.xAxMax-s.xAxMin), yOf: py=>s.yMax-(py-mT)/ph*(s.yMax-s.yMin) } };
  if(SX) GEOM.handles.push({kind:'x', x:X(s.xAxMax), y:ay});
  if(SY) GEOM.handles.push({kind:'yTop', x:ax, y:Y(s.yMax)});

  // x 눈금
  if(SX && s.tickStep>0){
    const st=+s.tickStep;
    for(let k=Math.ceil((s.xAxMin+1e-9)/st); k*st<=s.tickEnd+1e-9; k++){
      const x=k*st; if(Math.abs(x-x0)<1e-9) continue;
      g+=`<line x1="${X(x)}" y1="${ay-4}" x2="${X(x)}" y2="${ay+4}" stroke="#000" stroke-width="${Math.max(1,sw*0.8)}"/>`;
    }
  }
  // x 라벨
  let labels=[];
  if(s.labelMode==='auto' && s.labelStep>0){
    const st=+s.labelStep;
    for(let k=Math.ceil((s.xAxMin-1e-9)/st); k*st<=s.tickEnd+1e-9; k++){ const x=+(k*st).toFixed(6); if(Math.abs(x)>1e-9) labels.push(x); }
  } else if(s.labelMode==='custom') labels=parseList(s.customLabels);
  // 파동이 특정 픽셀 상자를 지나가는지 검사
  const curvesNow=activeCurves();
  const wsA=Math.max(+s.waveStart,s.xAxMin), weA=Math.min(+s.waveEnd,s.xAxMax);
  const invX=px=>s.xAxMin+(px-mL)/pw*(s.xAxMax-s.xAxMin);
  const waveHits=(l,r,t,b)=>{
    const m=2;
    for(let px=l-m; px<=r+m; px+=1){ const x=invX(px); if(x<wsA||x>weA) continue;
      for(const c of curvesNow){ const py=Y(waveY(x,c.p)); if(py>=t-m && py<=b+m) return true; } }
    return false;
  };
  const candidates={
    right:  (xp,w)=>[xp+3, 'start', xp+3, xp+3+w, 'below'],
    left:   (xp,w)=>[xp-3, 'end', xp-3-w, xp-3, 'below'],
    center: (xp,w)=>[xp, 'middle', xp-w/2, xp+w/2, 'below'],
  };

    const str=fmt(x), w=str.length*fs*0.58, capH=fs*0.74, xp=X(x);

    const belowBase=ay+fs+3, aboveBase=ay-6;
    let order;
    if(s.labelPos==='auto') order=[['center','below'],['right','below'],['left','below'],['right','above'],['left','above'],['center','above']];
    else order=[[s.labelPos,'below']];
    let pick=null;
    for(const [h,v] of order){
      const [tx,anc,l,r]=candidates[h](xp+dx,w);
      const base=(v==='below'?belowBase:aboveBase)+dy;
      if(s.labelPos!=='auto' || !waveHits(l,r,base-capH,base+1)){ pick=[tx,base,anc]; break; }
    }
    if(!pick){ const [tx,anc]=candidates.right(xp+dx,w); pick=[tx,belowBase+dy,anc]; }
    txt+=textEl(pick[0],pick[1],str,pick[2]);
  });
  // 원점, 축 이름
  if(s.showOrigin && SY) txt+=textEl(ax-7,ay+fs*0.35,'0','end');
  if(!SX);
  else if(s.xLabelPos==='right') txt+=textEl(X(s.xAxMax)+8,ay+fs*0.35,s.xLabel,'start',s.italicVar);
  else txt+=textEl(X(s.xAxMax)+fs*0.4,ay+fs*1.45,s.xLabel,'end',s.italicVar);
  if(SY) yLines.forEach((ln,i)=>{ txt+=textEl(ax-6,Y(s.yMax)+fs*0.45-(yLines.length-1-i)*fs*1.15,ln,'end'); });

  // y 눈금
  if(SY) yTickVals.forEach((v,i)=>{
    g+=`<line x1="${ax-4}" y1="${Y(v)}" x2="${ax+4}" y2="${Y(v)}" stroke="#000" stroke-width="${Math.max(1,sw*0.8)}"/>`;
    const lb=(yTickLbl[i]!==undefined && yTickLbl[i]!=='')? yTickLbl[i] : fmt(v);
    txt+=textEl(ax-7,Y(v)+fs*0.35,lb,'end');
  });

  // 파동
  const ws=Math.max(+s.waveStart,s.xAxMin), we=Math.min(+s.waveEnd,s.xAxMax);
  const segs = xm ? s.media.map((m,i)=>{ const [lo,hi]=bounds(i); return [Math.max(ws,lo), Math.min(we,hi)]; }) : [[ws,we]];
  const pathOf=(fn)=>{ let d='', pen=false;
    segs.forEach(([a,b])=>{
      if(b<=a) return;
      const n=Math.max(2,Math.ceil((X(b)-X(a))*1.5));
      for(let j=0;j<=n;j++){ const u=a+(b-a)*j/n, y=fn(u);
        if(!isFinite(y)){ pen=false; continue; }
        d+=(pen?'L':'M')+X(u).toFixed(2)+','+Y(y).toFixed(2)+' '; pen=true; }
    });
    return d; };
  const strokeP=(d,da,w)=>`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="${da?'butt':'round'}"${da?` stroke-dasharray="${da}"`:''}/>`;
  const showSum = !s.w2on || s.w2show!=='parts', showParts = s.w2on && s.w2show!=='sum';
  curvesNow.forEach(c=>{
    if(showParts){
      ['y1','y2'].forEach(k=>{ g+=strokeP(pathOf(u=>{ const [x,t]=waveXT(u,c.p); return comps(x,t)[k]; }), s.w2show==='parts'?(DASH[c.dash]||''):'5 4', s.w2show==='parts'? s.lw : Math.max(1,s.lw*0.55)); });
    }
    if(showSum) g+=strokeP(pathOf(u=>waveY(u,c.p)), DASH[c.dash]||'', s.lw);
    if((s.reflShow==='sep'||s.reflShow==='both') && s.media.length>1)
      g+=strokeP(pathOf(u=>{ const [x,t]=waveXT(u,c.p); return comps(x,t).yR; }), '5 4', Math.max(1,s.lw*0.6));
  });
  // 정상파: 배 진폭(포락선)과 마디 (x축 모드, 두 파동이 겹친 구간)
  if(xm && s.w2on && (s.envelope||s.nodes)){
    const t=curvesNow[0].p===undefined? S.t : curvesNow[0].p, d1=+s.dir;
    const FF=effFronts(), f1=frontPos(FF[0],d1,t), f2=frontPos(FF[1],-d1,t);
    let lo=ws, hi=we;
    if(d1>0){ if(f1!==null) hi=Math.min(hi,f1); if(f2!==null) lo=Math.max(lo,f2); }
    else    { if(f1!==null) lo=Math.max(lo,f1); if(f2!==null) hi=Math.min(hi,f2); }

      const amp=x=>{ const A1=ampAt(x), A2=amp2At(x); return Math.sqrt(Math.max(0,A1*A1+A2*A2-2*A1*A2*Math.cos(2*phase(x)+p1+p2))); };
      if(s.envelope){
        const segsE=[[lo,hi]], envD=sg=>{ let d=''; const n=Math.ceil((X(hi)-X(lo))*1.5);
          for(let j=0;j<=n;j++){ const x=lo+(hi-lo)*j/n; d+=(j?'L':'M')+X(x).toFixed(2)+','+Y(sg*amp(x)).toFixed(2)+' '; } return d; };
        g+=`<path d="${envD(1)}" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3"/>`;
        g+=`<path d="${envD(-1)}" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3"/>`;
      }
      if(s.nodes){

        }
      }

  }
  // t축 모드: 재생 중 현재 시각 표시 (세로 점선 + 곡선 위 점)
  if(!xm && +S.t!==0){
    const span=we-ws; let tm=+S.t;

    const xp=X(tm);
    g+=`<line x1="${xp}" y1="${Y(s.yMax)}" x2="${xp}" y2="${Y(s.yMin)}" stroke="#d33" stroke-width="1.2" stroke-dasharray="4 3"/>`;

  // 앞머리 이름 (A, B)
  if(xm && !s.multi && !srcMode()){
    const lab=(F0,d,name,which)=>{ if(!name) return; const f=frontPos(F0,d,S.t); if(f===null||f<ws||f>we) return;

  if(s.multi && s.curves.length && s.curveLegend!=='none'){
    const L=30, lh=fs*1.25, items=s.curves.filter(c=>c.label!=='');
    const tw=Math.max(0,...items.map(c=>c.label.replace(/_\{?|\}/g,'').length))*fs*0.55;

    items.forEach((c,i)=>{ const yy=mT-topX+fs*0.1+i*lh, da=DASH[c.dash]||'';
      g+=`<line x1="${x0}" y1="${yy}" x2="${x0+L}" y2="${yy}" stroke="${s.color}" stroke-width="${s.lw}"${da?` stroke-dasharray="${da}"`:''}/>`;
      txt+=T2(x0+L+6, yy+fs*0.35, c.label, {anchor:'start', math:true, halo:false}); });
  }

  // 매질 이름
  if(xm && s.media.length>1){
    s.media.forEach((m,i)=>{
      const [lo,hi]=bounds(i); const a=Math.max(ws,lo), b=Math.min(we,hi);
      let lx = isNum(m.labelX)? +m.labelX : (a+b)/2;
      const ly = isNum(m.labelY)? +m.labelY : +s.nameY;
      if(b>a || isNum(m.labelX)){
        txt+=textEl(X(lx),Y(ly)+fs*0.35,m.name,'middle');
        const w=String(m.name).length*fs*0.95+10;
        GEOM.drags.push({kind:'name', i, lx0:lx, ly0:ly, vert:true, box:[X(lx)-w/2, Y(ly)-fs*0.7, w, fs*1.4]});
      }
    });
  }
  // 진행 방향 화살표
  if(xm && s.showArrow){
    const x1=X(s.arrowX), x2=X(+s.arrowX+ +s.arrowLen), yy=Y(s.arrowY);
    const [from,to]= s.dir>0? [x1,x2]:[x2,x1];
    const ah2=Math.max(8,sw*5.5), dirv=Math.sign(to-from)||1;
    g+=`<line x1="${from}" y1="${yy}" x2="${to-dirv*ah2*0.6}" y2="${yy}" stroke="#000" stroke-width="${sw}"/>`;
    g+=arrowHead(to,yy,dirv,0,ah2);
    txt+=textEl((x1+x2)/2,yy-fs*0.45,s.arrowText,'middle');
    arrowDrags(1, x1, x2, yy, to===x2);
  }
  if(xm && s.w2on && s.showArrow){   // 두 번째 화살표는 첫 번째 화살표 표시 여부를 따름
    const x1=X(s.arrow2X), x2=X(+s.arrow2X+ +s.arrow2Len), yy=Y(s.arrow2Y);
    const [from,to]= s.dir>0? [x2,x1]:[x1,x2];
    const ah2=Math.max(8,sw*5.5), dirv=Math.sign(to-from)||1;
    g+=`<line x1="${from}" y1="${yy}" x2="${to-dirv*ah2*0.6}" y2="${yy}" stroke="#000" stroke-width="${sw}"/>`;
    g+=arrowHead(to,yy,dirv,0,ah2);
    txt+=textEl((x1+x2)/2,yy-fs*0.45,s.arrowText,'middle');
    arrowDrags(2, x1, x2, yy, to===x2);
  }

  document.getElementById('svgWrap').innerHTML =
    `<svg id="waveSvg" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="#fff"/>${g}${txt}</svg>`;
  updateInfo();
}

function updateInfo(){
  if(S.dim==='2d'){ info2D(); return; }
  const f=1/S.T, w=2*Math.PI/S.T;
  let h=`T = ${fmt(S.T)} s, f = ${fmt(f)} Hz, ω = ${fmt(w)} rad/s<br>`;
  if(S.hMode==='t'){ const mi=mediumIdx(+S.obsX); h+=`관찰 위치 x = ${fmt(S.obsX)} m (${esc(S.media[mi].name)})<br>`; }
  const AMs=mediumAmps();
  S.media.forEach((m,i)=>{ h+=`${esc(m.name)}: v = ${fmt(m.v)} m/s, λ = ${fmt(m.lambda)} m, k = ${fmt(2*Math.PI/m.lambda)} rad/m, A = ${fmt(AMs[i])}`+(i<S.media.length-1? `, 경계 반사 계수 r = ${fmt(+rAuto(i).toFixed(3))} (${reflType(i).split(' —')[0]})`:'')+'<br>'; });
  document.getElementById('info').innerHTML=h;
}

/* ---------- 입력 연결 ---------- */
function syncInputs(){
  document.querySelectorAll('[data-key]').forEach(el=>{
    const v=S[el.dataset.key];
    if(el.type==='checkbox') el.checked=!!v; else el.value=v;
  });
  document.querySelectorAll('[data-k2]').forEach(el=>{
    const v=S.d2[el.dataset.k2];
    if(el.type==='checkbox') el.checked=!!v; else el.value=v;
  });
  document.getElementById('T').value=parseFloat((+S.T).toFixed(6));
  document.getElementById('f').value=parseFloat((1/S.T).toFixed(6));
  if(typeof updateTimeUI==='function') updateTimeUI();
  if(typeof applyModeUI==='function') applyModeUI();
}
document.querySelectorAll('[data-key]').forEach(el=>{
  const ev = (el.tagName==='SELECT'||el.type==='checkbox'||el.type==='color')?'change':'input';
  el.addEventListener(ev,()=>{
    const k=el.dataset.key; let v;
    if(el.type==='checkbox') v=el.checked;
    else if(el.dataset.blank!==undefined && el.value.trim()===''){ v=''; }
    else if(el.type==='number'||el.dataset.type==='int'){ v=parseFloat(el.value); if(!isFinite(v)) return; }
    else v=el.value;
    S[k]=v; draw();
  });
});
function setPeriod(T){
  if(!(T>0)) return;
  S.T=T;
  S.media.forEach(m=>{ m.lambda=m.v*T; });   // 속력은 그대로, 파장 = vT
  renderMedia(); updateTimeUI(); draw();
}
document.getElementById('T').addEventListener('input',e=>{ const T=parseFloat(e.target.value); if(T>0){ setPeriod(T); document.getElementById('f').value=parseFloat((1/T).toFixed(6)); }});
document.getElementById('f').addEventListener('input',e=>{ const f=parseFloat(e.target.value); if(f>0){ setPeriod(1/f); document.getElementById('T').value=parseFloat((1/f).toFixed(6)); }});

  return {xAxMin:0, xAxMax:+(4.2*T).toFixed(4), waveStart:0, waveEnd:+(3.85*T).toFixed(4), tickStep:+(T/4).toFixed(4),

/* ---------- 매질 편집 ---------- */
function renderMedia(){
  const box=document.getElementById('mediaList'); box.innerHTML='';
  S.media.forEach((m,i)=>{
    const last=i===S.media.length-1;
    const div=document.createElement('div'); div.className='medium';
    div.innerHTML=`
      <div class="head"><input type="text" data-f="name" style="width:120px">
        ${S.media.length>1?'<button data-del style="padding:2px 8px">삭제</button>':''}</div>
      <div class="grid2">
        <label class="fl"><span>속력 v</span><input type="number" data-f="v" step="0.5"></label>
        <div class="fl ro"><span>파장 λ</span><b data-ro="lambda"></b></div>
        <div class="fl ro"><span>진폭 A</span><b data-ro="A"></b></div>
        ${last?'':`<label class="fl"><span>경계 x</span><input type="number" data-f="end" step="0.5"></label>
        <div class="fl ro"><span>반사 계수 r</span><b data-ro="r"></b></div>
        <div class="fl ro" style="grid-column:1/-1"><span>경계 반사</span><b data-ro="rtype"></b></div>`}
      </div>`;
    div.querySelectorAll('[data-f]').forEach(inp=>{
      const f=inp.dataset.f;
      inp.value = f==='v'? parseFloat((+m.v).toFixed(6)) : (m[f]??'');
      inp.addEventListener('input',()=>{
        if(f==='name'){ m.name=inp.value; draw(); return; }
        const v=parseFloat(inp.value); if(!isFinite(v)) return;
        if(f==='v'){ if(v<=0) return; m.v=v; m.lambda=v*S.T; }
        else if(f==='r'){ m.r=Math.max(-1,Math.min(1,v)); }
        else m[f]=v;
        draw();
      });
    });
    const del=div.querySelector('[data-del]');
    if(del) del.onclick=()=>{ S.media.splice(i,1); renderMedia(); draw(); };
    box.appendChild(div);
  });
  syncMediaRO();
}
function syncMediaRO(){
  const A=mediumAmps();
  document.querySelectorAll('#mediaList .medium').forEach((div,i)=>{ const m=S.media[i]; if(!m) return;
    const l=div.querySelector('[data-ro=lambda]'), a=div.querySelector('[data-ro=A]');
    if(l) l.textContent=fmt(m.v*S.T)+' m'; if(a) a.textContent=fmt(A[i]);
    const rr=div.querySelector('[data-ro=r]'); if(rr && S.media[i+1]) rr.textContent=fmt(+rAuto(i).toFixed(3));
    const rt=div.querySelector('[data-ro=rtype]'); if(rt && S.media[i+1]) rt.textContent=reflType(i);
  });
}
function addMedium(){
  const m=S.media, prev=m[m.length-1];
  const [lo]=bounds(m.length-1);
  const a=Math.max(isFinite(lo)?lo:S.waveStart,S.waveStart);
  prev.end=+(((a+S.waveEnd)/2)).toFixed(2);
  const letter=String.fromCharCode(65+m.length);
  prev.r=prev.r||0;
  m.push({name:'매질 '+letter, end:prev.end+10, lambda:prev.v*2*S.T, v:prev.v*2, r:0, labelX:''});
  syncInputs(); renderMedia(); draw();
}

function setT(t){ S.t=+(+t).toFixed(6); updateTimeUI(); draw(); }
function stepTime(sign){ const d=(+S.dtVal||0)*(S.dtUnit==='T'?S.T:1); setT(S.t+sign*d); }
function jumpT(frac){ setT(S.t+frac*S.T); }
function updateTimeUI(){
  document.getElementById('t').value=parseFloat((+S.t).toFixed(6));
  document.getElementById('tInT').textContent=`(= ${fmt(S.t/S.T)} T)`;
  // 양쪽 끝에서 출발하는 정상파는 두 파동이 구간을 다 지날 때까지 볼 수 있게 슬라이더 범위를 늘림
  let mx=2;
  if(S.dim!=='2d' && srcMode()) mx=Math.max(2, Math.ceil((phase(+S.waveEnd)-phase(+S.waveStart))/(2*Math.PI))+1);
  const r=S.t/S.T, sl=document.getElementById('tSlider');
  sl.max=mx; document.getElementById('tSliderMax').textContent=`0 ~ ${mx}T`;
  sl.value = (r>=0 && r<=mx) ? r : (((r%mx)+mx)%mx);
}
document.getElementById('tSlider').addEventListener('input',e=>setT(parseFloat(e.target.value)*S.T));
document.getElementById('t').addEventListener('input',updateTimeUI);
function resetPlay(){
  if(playing) togglePlay();
  S.playSpeed=DEFAULTS.playSpeed; S.dtVal=DEFAULTS.dtVal; S.dtUnit=DEFAULTS.dtUnit;
  syncInputs(); setT(0);
}
function resetAll(){
  if(playing) togglePlay();
  const keep={dim:S.dim, hMode:S.hMode, style1d:S.style1d};
  S=JSON.parse(JSON.stringify(DEFAULTS));
  S.dim=keep.dim; S.style1d=keep.style1d;
  if(keep.hMode==='t'){ S.axisSaved.x=Object.fromEntries(AXKEYS.map(k=>[k,S[k]])); Object.assign(S,tAxisDefaults()); S.hMode='t'; }
